$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/signature.schema.yaml"
title: "Signature"
description: >
  Electronic signature binding a person, an explicit meaning, and the exact
  git version of the subject record at signing time. Signatures are immutable.

type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"

required:
- kind
- recordId
- signedBy
- action
- meaning
- subject
- signedAt
- authentication

properties:
  kind:
    const: "signature"

  recordId:
    type: string
    pattern: "^SIG-[A-Z0-9][A-Z0-9_-]*$"

  signedBy:
    type: string
    pattern: "^USR-[A-Z0-9][A-Z0-9_-]*$"

  action:
    type: string
    enum: [ executed, reviewed, approved, verified, released, witnessed, acknowledged ]

  meaning:
    type: object
    additionalProperties: false
    required: [ code ]
    properties:
      code:
        type: string
        enum: [ executed, reviewed, approved, verified, released, witnessed, acknowledged ]
      statement:
        type: string

  subject:
    type: object
    additionalProperties: false
    required: [ recordId ]
    properties:
      recordId:
        type: string
      revisionRef:
        type: object
        additionalProperties: false
        required: [ kind, type, id ]
        description: >
          Immutable record-revision snapshot of the subject at signing time
          (2026-10-03 signature-integrity contract). Optional in the schema
          only so legacy gitCommit-only signatures stay readable as historical
          evidence; enforcement that NEW transitions require a verifiable
          snapshot lives in the update path (SIGNATURE_REVISION_REQUIRED).
        properties:
          kind:
            const: "record"
          type:
            const: "record-revision"
          id:
            type: string
            pattern: "^REV-[A-F0-9]+$"
      contentHash:
        type: string
        pattern: "^[a-f0-9]{64}$"
        description: "Canonical SHA-256 of the signed snapshot — drives STALE_SIGNATURE / SIGNED_CONTENT_CHANGED."
      gitCommit:
        type: string
        pattern: "^[a-f0-9]{7,40}$"
      lifecycleId:
        type: string
      targetState:
        type: string

  signedAt:
    type: string
    format: date-time

  authentication:
    type: object
    additionalProperties: false
    required: [ method ]
    properties:
      method:
        type: string
        enum: [ password_reauthentication ]
