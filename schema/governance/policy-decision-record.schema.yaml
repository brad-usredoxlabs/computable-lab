$schema: https://json-schema.org/draft/2020-12/schema
$id: https://computable-lab.com/schema/computable-lab/policy-decision-record.schema.yaml
title: Policy decision record
description: "Immutable record of ONE evaluation against a declared policy set: the evaluated attributes (closed over the exact policy-set match vocabulary), the matched rule ids, the outcome from the shipped PolicyDecisionDisposition vocabulary, and the obligations that remain after the decision."
type: object
additionalProperties: false
required: [kind, id, policy_set_ref, evaluated_attributes, matched_rule_ids, outcome, remaining_obligations, evaluated_at]
$defs:
  evaluated_attributes:
    type: object
    additionalProperties: false
    properties:
      capability: { type: string, minLength: 1 }
      effect_kind: { type: string, enum: [read, external_disclosure, workflow_state_change, domain_mutation, compute_submission, deployment] }
      record_kind: { type: string, minLength: 1 }
      regulated: { type: boolean }
      actor_role: { type: string, minLength: 1 }
      provenance_completeness: { type: string, minLength: 1 }
      environment: { type: string, minLength: 1 }
properties:
  kind: { const: policy-decision-record }
  id: { type: string, pattern: '^PDR-[A-Z0-9][A-Z0-9_-]*$' }
  policy_set_ref:
    type: object
    additionalProperties: false
    required: [id, version]
    properties:
      id: { type: string, pattern: '^PSET-[A-Z0-9][A-Z0-9_-]*$' }
      version: { type: integer, minimum: 1 }
  evaluated_attributes: { $ref: '#/$defs/evaluated_attributes' }
  matched_rule_ids:
    description: "Rule ids matched by this evaluation. A record produced from a policy set's configured DEFAULT names NO rule, because a default is not a rule."
    type: array
    minItems: 0
    uniqueItems: true
    items: { type: string, minLength: 1 }
  outcome: { type: string, enum: [allowed, needs-confirmation, blocked] }
  remaining_obligations: { type: array, items: { type: string, minLength: 1 } }
  evaluated_at: { type: string, format: date-time }
