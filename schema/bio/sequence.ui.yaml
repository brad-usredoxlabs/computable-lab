uiVersion: 1
schemaId: https://computable-lab.com/schema/bio/sequence.schema.yaml
form:
  sections:
  - title: Sequence
    fields:
    - path: $.id
      label: ID
      widget: text
      readonly: true
    - path: $.label
      label: Name
      widget: text
      readonly: false
    - {path: $.alphabet, label: Alphabet, widget: select}
    - {path: $.topology, label: Topology, widget: select}
    - {path: $.residues, label: Sequence (5′ → 3′), widget: textarea}
  layout: sections
display:
  titleField: $.label
list:
  columns:
  - path: $.label
    label: Name
  - path: $.id
    label: ID
