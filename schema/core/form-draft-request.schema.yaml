$schema: https://json-schema.org/draft/2020-12/schema
$id: https://computable-lab.com/schema/computable-lab/form-draft-request.schema.yaml
title: Form draft compile and accept requests
$defs:
  compile:
    type: object
    additionalProperties: false
    required: [adapter, intent]
    properties:
      adapter: {type: string, minLength: 1}
      intent: {type: object}
      userRequest:
        type: string
        description: Latest user request that produced this AI proposal. Direct form edits omit this to supersede the prior request.
      draftId: {type: string, minLength: 1}
      revision: {type: integer, minimum: 1}
      target:
        type: object
        additionalProperties: false
        required: [recordId]
        properties:
          recordId: {type: string, minLength: 1}
          contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    dependentRequired:
      draftId: [revision]
      revision: [draftId]
  accept:
    type: object
    additionalProperties: false
    required: [draftId, revision, reviewHash]
    properties:
      draftId: {type: string, minLength: 1}
      revision: {type: integer, minimum: 1}
      reviewHash: {type: string, pattern: '^[a-f0-9]{64}$'}
