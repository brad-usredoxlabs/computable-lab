$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/datatypes/composition-entry.schema.yaml"
title: "Composition Entry"
description: >
  Structured formulation entry for a component in a mixture or stock.

type: object
additionalProperties: false
required: [ component_ref, role ]
properties:
  component_ref:
    $ref: "./ref.schema.yaml"
  role:
    type: string
    enum:
    - solute
    - solvent
    - buffer_component
    - additive
    - activity_source
    - cells
    - other
  concentration:
    $ref: "./concentration.schema.yaml"
  concentration_range:
    type: object
    additionalProperties: false
    required: [ unit ]
    properties:
      min:
        type: number
      max:
        type: number
      unit:
        type: string
      basis:
        type: string
        enum: [ molar, mass_per_volume, activity_per_volume, count_per_volume, volume_fraction, mass_fraction ]
  source:
    type: string
