# E9: identityLevels members are declared referent levels (the identity-purpose
# discriminator the fact-builder reads — no invented level nouns).
- id: material-eligibility-identity-levels-are-referent-levels
  title: "identityLevels members are declared referentLevels"
  severity: error
  scope: record
  when:
    op: exists
    path: identityLevels
  assert:
    op: allIn
    path: identityLevels
    collectionPath: referentLevels
  message:
    template: "identityLevels members must be members of referentLevels"

# E11 (fix-run 1 D2): every identityRolePolicies member names a DECLARED
# policy id — the identity role tag is single-sourced (identityRole) and
# attached by ID reference, so a dangling name (a role aimed at a policy that
# does not exist) is rejected at the data layer. Shape: root allIn against
# the policy-id wildcard projection (probe-verified).
- id: material-eligibility-identity-role-policies-declared
  title: "identityRolePolicies members name declared policy ids"
  severity: error
  scope: record
  when:
    op: exists
    path: identityRolePolicies
  assert:
    op: allIn
    path: identityRolePolicies
    collectionPath: policies[*].id
  message:
    template: "identityRolePolicies members must name declared policy ids (the role tag is attached by id — never a duplicate role literal)"

# E10: every policy declares BOTH arms of the three-state law (§7.1): a
# requires completeness guard and an assert business predicate. The meta-schema
# requires the keys; this rule makes an EMPTY/blank arm fail loudly at the
# data layer (a policy that asserts nothing is a silent pass waiting to happen).
- id: material-eligibility-policies-carry-both-arms
  title: "policies declare requires and assert arms"
  severity: error
  scope: record
  when:
    op: exists
    path: policies
  assert:
    op: everyItem
    collectionPath: policies
    assert:
      op: all
      predicates:
      - op: exists
        path: requires
      - op: exists
        path: assert
  message:
    template: "an eligibility policy must declare both a requires guard and an assert predicate"
