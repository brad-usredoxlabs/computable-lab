                                          predicates:
                                          - op: all
                                            predicates:
                                            - op: any
                                              predicates:
                                              - op: equals
                                                path: collectionPath
                                                value: demanded.custodyNeverTiers
                                              - op: equals
                                                path: collectionPath
                                                value: demanded.identityOnlyTiers
                                            - op: not
                                              not:
                                                op: equals
                                                path: op
                                                value: noneIn
                                          - op: all
                                            predicates:
                                            - op: any
                                              predicates:
                                              - op: equals
