                  op: equals
                  path: assert.op
                  value: noneIn
            - op: all
              predicates:
              - op: any
                predicates:
                - op: equals
                  path: assert.path
                  value: demanded.custodyNeverTiers
                - op: equals
                  path: assert.path
                  value: demanded.identityOnlyTiers
              - op: any
                predicates:
                - op: equals
                  path: assert.op
                  value: allIn
                - op: equals
                  path: assert.op
                  value: in
            - op: all
              predicates:
              - op: equals
                path: assert.op
                value: in
              - op: any
                predicates:
                - op: equals
                  path: assert.valuesPath
                  value: demanded.custodyNeverTiers
                - op: equals
                  path: assert.valuesPath
                  value: demanded.identityOnlyTiers
        - op: any
          predicates:
          - op: not
            not:
              op: nonEmpty
              path: assert.predicates
          - op: everyItem
            collectionPath: assert.predicates
            assert:
              op: all
              predicates:
              - op: not
                not:
                  op: any
                  predicates:
                  - op: all
                    predicates:
                    - op: any
                      predicates:
                      - op: equals
                        path: collectionPath
                        value: demanded.custodyNeverTiers
                      - op: equals
                        path: collectionPath
                        value: demanded.identityOnlyTiers
                    - op: not
                      not:
                        op: equals
                        path: op
                        value: noneIn
                  - op: all
                    predicates:
                    - op: any
                      predicates:
                      - op: equals
                        path: path
                        value: demanded.custodyNeverTiers
                      - op: equals
                        path: path
                        value: demanded.identityOnlyTiers
                    - op: any
                      predicates:
                      - op: equals
                        path: op
                        value: allIn
                      - op: equals
                        path: op
                        value: in
                  - op: all
                    predicates:
                    - op: equals
                      path: op
                      value: in
                    - op: any
                      predicates:
                      - op: equals
                        path: valuesPath
                        value: demanded.custodyNeverTiers
                      - op: equals
                        path: valuesPath
                        value: demanded.identityOnlyTiers
              - op: any
                predicates:
                - op: not
                  not:
                    op: nonEmpty
                    path: predicates
                - op: everyItem
                  collectionPath: predicates
                  assert:
                    op: all
                    predicates:
                    - op: not
                      not:
                        op: any
                        predicates:
                        - op: all
                          predicates:
                          - op: any
                            predicates:
                            - op: equals
                              path: collectionPath
                              value: demanded.custodyNeverTiers
                            - op: equals
                              path: collectionPath
                              value: demanded.identityOnlyTiers
                          - op: not
                            not:
                              op: equals
                              path: op
                              value: noneIn
                        - op: all
                          predicates:
                          - op: any
                            predicates:
                            - op: equals
                              path: path
                              value: demanded.custodyNeverTiers
                            - op: equals
                              path: path
                              value: demanded.identityOnlyTiers
                          - op: any
                            predicates:
                            - op: equals
                              path: op
                              value: allIn
                            - op: equals
                              path: op
                              value: in
                        - op: all
                          predicates:
                          - op: equals
                            path: op
                            value: in
                          - op: any
                            predicates:
                            - op: equals
                              path: valuesPath
                              value: demanded.custodyNeverTiers
                            - op: equals
                              path: valuesPath
                              value: demanded.identityOnlyTiers
                    - op: any
                      predicates:
                      - op: not
                        not:
                          op: nonEmpty
                          path: predicates
                      - op: everyItem
                        collectionPath: predicates
                        assert:
                          op: all
                          predicates:
                          - op: not
                            not:
                              op: any
                              predicates:
                              - op: all
                                predicates:
                                - op: any
                                  predicates:
                                  - op: equals
                                    path: collectionPath
                                    value: demanded.custodyNeverTiers
                                  - op: equals
                                    path: collectionPath
                                    value: demanded.identityOnlyTiers
                                - op: not
                                  not:
                                    op: equals
                                    path: op
                                    value: noneIn
                              - op: all
                                predicates:
                                - op: any
                                  predicates:
                                  - op: equals
                                    path: path
                                    value: demanded.custodyNeverTiers
                                  - op: equals
                                    path: path
                                    value: demanded.identityOnlyTiers
                                - op: any
                                  predicates:
                                  - op: equals
                                    path: op
                                    value: allIn
                                  - op: equals
                                    path: op
                                    value: in
                              - op: all
                                predicates:
                                - op: equals
                                  path: op
                                  value: in
                                - op: any
                                  predicates:
                                  - op: equals
                                    path: valuesPath
                                    value: demanded.custodyNeverTiers
                                  - op: equals
                                    path: valuesPath
                                    value: demanded.identityOnlyTiers
                          - op: any
                            predicates:
                            - op: not
                              not:
                                op: nonEmpty
                                path: predicates
                            - op: everyItem
                              collectionPath: predicates
                              assert:
                                op: all
                                predicates:
                                - op: not
                                  not:
                                    op: any
                                    predicates:
                                    - op: all
                                      predicates:
                                      - op: any
                                        predicates:
                                        - op: equals
                                          path: collectionPath
                                          value: demanded.custodyNeverTiers
                                        - op: equals
                                          path: collectionPath
                                          value: demanded.identityOnlyTiers
                                      - op: not
                                        not:
                                          op: equals
                                          path: op
                                          value: noneIn
                                    - op: all
                                      predicates:
                                      - op: any
                                        predicates:
                                        - op: equals
                                          path: path
                                          value: demanded.custodyNeverTiers
                                        - op: equals
                                          path: path
