# UI specification for Equipment records
uiVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/equipment.schema.yaml"

display:
  titleField: "$.name"
  icon: "equipment"

form:
  layout: "sections"
  sections:
  - title: "Identity"
    fields:
    - path: "$.id"
      widget: "text"
      label: "ID"
      readonly: true
    - path: "$.kind"
      widget: "text"
      label: "Kind"
      readonly: true
      hidden: true
    - path: "$.name"
      widget: "text"
      label: "Name"
      required: true
    # QMS8-C (D3): the Status field is retired with the domain field it edited.
    # The record's lifecycle state is shown by the DocumentControlBar state pill
    # (labels come from schema/core/lifecycles/registry-ops.lifecycle.yaml).
  - title: "Details"
    fields:
    - path: "$.equipmentClassRef"
      widget: "record-ref"
      label: "Equipment Class"
      refKind: "equipment-class"
    - path: "$.instrumentRef"
      widget: "record-ref"
      label: "Linked Instrument"
      refKind: "instrument"
    - path: "$.manufacturer"
      widget: "text"
      label: "Manufacturer"
    - path: "$.model"
      widget: "text"
      label: "Model"
    - path: "$.serialNumber"
      widget: "text"
      label: "Serial Number"
    - path: "$.assetTag"
      widget: "text"
      label: "Asset Tag"
    - path: "$.location"
      widget: "text"
      label: "Location"
  - title: "Readiness"
    fields:
    - path: "$.readiness.calibrationRequired"
      widget: "checkbox"
      label: "Calibration Required"
    - path: "$.readiness.qualificationRequired"
      widget: "checkbox"
      label: "Qualification Required"
  - title: "Notes"
    fields:
    - path: "$.notes"
      widget: "markdown"
      label: "Notes"

list:
  columns:
  - path: "$.id"
    label: "ID"
    width: "120px"
  - path: "$.name"
    label: "Name"
  # QMS8-C (D3): the Status column is retired with the domain field it rendered.
  - path: "$.location"
    label: "Location"
