$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/measurement.schema.yaml"
title: "Measurement"
description: >
  Instrument measurement dataset. FAIR record (1 per read event).
  Contains parsed instrument output with per-well data.

type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"

required:
- kind
- recordId
- title
- assayType

properties:
  kind:
    const: "measurement"

  recordId:
    type: string
    description: "Stable local identifier (e.g., MSR-000001)."

  title:
    type: string

  eventGraphRef:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Which event graph this measurement belongs to."

  readEventRef:
    type: string
    description: "eventId of the read event that produced this measurement."

  # INSTR-COLLAPSE-1 C1: the physical source is an EQUIPMENT record. The ref
  # target is pinned to type: equipment (schema floor; precedent:
  # equipment.schema.yaml equipmentClassRef pins type: equipment-class inside
  # allOf on datatypes/ref.schema.yaml). "Any ref" is not an accepted shape.
  equipmentRef:
    allOf:
    - $ref: "./datatypes/ref.schema.yaml"
    - type: object
      properties:
        kind: { const: record }
        type: { const: equipment }
    description: "Which equipment performed the measurement."
    # INSTR-COLLAPSE-1 C2 (OQ-1 decision (a)): the capability requirement is
    # DECLARED on the ref slot it governs (x-jsonld ContextBuilder.ts:154 and
    # verb-definition derivedFrom.fn precedents — data names the resolver).
    # Interpreted policy-free by server/src/capabilities/DeclaredCapabilityGate.ts;
    # the verb comes from the producing READ EVENT's data, never a TS literal.
    x-capability-gate:
      verbFrom:
        resolver: read-event-verb
        path: readEventRef
        graphPath: eventGraphRef

  # L2-RUN-ATTACH-CAPABILITY-1 (RUN-IS-THE-PROVENANCE-RECORD): which material
  # (material/aliquot record) went INTO the read this measurement came from.
  # Plain record ref pinned to the material kinds — the same ref-slot precedent
  # as equipmentRef above, minus the capability gate (no capability governs it).
  materialRef:
    allOf:
    - $ref: "./datatypes/ref.schema.yaml"
    - type: object
      properties:
        kind: { const: record }
        type: { enum: [material, aliquot] }
    description: "Which material (record) this measurement was taken from. Optional: legacy measurements predate the binding."

  labwareInstanceRef:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Which plate was read."

  measurementContextRef:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Measurement context that planned or scoped this read."

  timepoint:
    type: string
    description: "Observation timepoint for this specific measurement instance."

  seriesId:
    type: string
    description: "Optional grouping key for repeated reads across timepoints or linked runs."

  assayType:
    type: string
    enum: [ qpcr, plate_reader, microscopy, gc_fid, gc_ms, flow, other ]

  channels:
    type: array
    description: "Measurement channels/filters."
    items:
      type: object
      additionalProperties: false
      required: [ channelId ]
      properties:
        channelId:
          type: string
        target:
          type: string
          description: "What is being measured (e.g., gene name)."
        reporter:
          type: string
          description: "Dye or filter (e.g., FITC, TRITC)."

  shape:
    type: object
    description: "Dataset shape metadata."
    additionalProperties: false
    properties:
      wells:
        type: integer
        minimum: 1
      channels:
        type: integer
        minimum: 1
      timepoints:
        type: integer
        minimum: 1
        description: "e.g., qPCR cycles."

  data:
    type: array
    description: "Inline measurement values (for small datasets)."
    items:
      type: object
      additionalProperties: false
      required: [ well, metric, value ]
      properties:
        well:
          type: string
        channelId:
          type: string
        metric:
          type: string
          description: "Measurement metric (e.g., Ct, RFU, OD)."
        value:
          type: number
        unit:
          type: string
        timeMin:
          type: number
          description: >
            Retention time in minutes, as the parser transcribed it (declared
            on MeasurementRow; emitted by chromatographic parsers such as
            agilent6890). Absent for non-chromatographic reads.

  artifacts:
    type: array
    description: "References to raw/processed data files."
    items:
      type: object
      additionalProperties: false
      required: [ role ]
      properties:
        fileRef:
          $ref: "./datatypes/file-ref.schema.yaml"
        role:
          type: string
          description: "Artifact role (raw_data, processed_data, etc.)."

  parserInfo:
    type: object
    description: "Provenance of the parser that produced this record."
    additionalProperties: false
    properties:
      parserId:
        type: string
        description: "Parser identifier (e.g., quantstudio_v2)."
      parserVersion:
        type: string
      parsedAt:
        type: string
        format: date-time
      units:
        type: object
        description: >
          The units the PARSER DECLARED for its read, transcribed from the
          source file (e.g. the header's bracket tokens). A unit the parser
          could not read is the literal 'unstated' — never a default; absent
          entirely when the parser declares no units.
        additionalProperties: false
        required: [ time, intensity ]
        properties:
          time:
            type: string
          intensity:
            type: string
      metadata:
        type: object
        description: >
          Preamble metadata the parser transcribed verbatim from the source
          file (e.g. Instrument, Method, Injection Date) — what the file
          said, not a default.
        additionalProperties: { type: string }
      # L2-GC-TRACE-PERSIST-1 (D3): the parser's OWN ordinate series — the
      # single persisted trace truth for the render path (no re-parse at
      # render, no second copy of the sampling interval). Absent entirely
      # when the parser declares no trace (never an empty array, never
      # undefined).
      trace:
        type: object
        description: >
          The chromatogram ordinate series the parser extracted from the
          source file, in file order on a uniform sampling grid (the time of
          point i is i * samplingIntervalSeconds). What the file said, not a
          default.
        additionalProperties: false
        required: [ values, samplingIntervalSeconds ]
        properties:
          values:
            type: array
            description: "Ordinate samples in file order (the series itself)."
            items:
              type: number
          samplingIntervalSeconds:
            type: number
            description: "Uniform grid spacing between consecutive samples (seconds), as the file declared it."

  notes:
    type: string

  tags:
    type: array
    items: { type: string }
    uniqueItems: true
