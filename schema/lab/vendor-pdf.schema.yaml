$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/vendor-pdf.schema.yaml"
title: "VendorPdf"
description: >
  A first-class, lab-level record representing an ingested vendor document
  (e.g. a kit protocol PDF). It is FREE-FLOATING: it requires no parent
  study/experiment/run. It may carry an optional parent link (links.studyId)
  when ingested contextually from inside a study (kept as part of the
  ingestion record). Extraction products are referenced via
  vendorProtocolCandidateRef / promotedProtocolRef, not embedded.
type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"
# W2-8-FIX2 D2 (conditional JSON Schema — same if/then convention as
# core/datatypes/quantity.schema.yaml and provenance-rung-ref.schema.yaml):
# source.url is the provenance of the exa URL-ingest path. A local
# upload-by-content has no url — its provenance truth is the content-addressed
# file (file.sha256 + stored_path) — so the url requirement applies ONLY when
# the record does not carry a content-addressed file block. A record with
# NEITHER url NOR file.sha256 has no traceable provenance and stays invalid.
- if:
    not:
      type: object
      required: [ file ]
      properties:
        file:
          type: object
          required: [ sha256 ]
  then:
    properties:
      source:
        type: object
        required: [ url ]

required:
- kind
- recordId
- title
- source
- state

properties:
  kind:
    const: "vendor-pdf"

  recordId:
    type: string
    pattern: "^VPDF-[A-Z0-9][A-Z0-9_-]*$"

  title:
    type: string

  shortSlug:
    type: string

  state:
    type: string
    enum: [ draft, in_progress, ingested, extracted, superseded, archived ]
    description: "Lifecycle state of the vendor document."

  # Optional parent filing links captured at ingest time (Decision 5): a
  # vendor-pdf ingested from inside a study records that study here so the
  # contextual link survives. The record is still first-class and free-floating.
  links:
    type: object
    additionalProperties: false
    description: "Optional parent filing links captured at ingest time."
    properties:
      studyId: { type: string }
      experimentId: { type: string }
      runId: { type: string }

  source:
    type: object
    additionalProperties: false
    # url is NOT flat-required here: the top-level allOf conditional above
    # requires it for the URL-ingest shape and waives it for a content upload
    # whose truth is file.sha256 + stored_path (W2-8-FIX2 D2).
    required: [ engine, ingestedAt ]
    properties:
      engine:
        const: "exa"
      vendor: { type: string }
      title: { type: string }
      url: { type: string, format: uri }
      query: { type: string }
      ingestedAt: { type: string, format: date-time }
      pageCount: { type: integer, minimum: 0 }

  file:
    $ref: "./datatypes/file-ref.schema.yaml"

  extractedText:
    type: array
    description: "Per-page extracted plain text (index 0 is page 1)."
    items:
      type: object
      additionalProperties: false
      required: [ pageNumber, text ]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        text: { type: string }

  vendorProtocolCandidateRef:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Reference to the extraction sidecar (vendor-protocol-candidate)."

  promotedProtocolRef:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Reference to the universal protocol promoted from this PDF (source.type=vendor)."

  tags:
    type: array
    items: { type: string }
    uniqueItems: true
