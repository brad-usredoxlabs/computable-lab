# UI specification for Vendor Product records (L2-DOC-INTAKE-1 g1viewable).
# Without this sibling every vendor product rendered UI_SPEC_NOT_FOUND: the
# record path resolves its spec by schemaId (UIHandlers.ts:236) and had none.
# This is a VIEW of the finished intake, never an editor: the item's contract
# is propose-never-write, so every field is readonly.
#
# Documents / drafts are declared as `array` rows, NOT as `$.documents[*].x`
# field rows: the record page resolves a row's value with the dotted-only
# getValueAtPath (app/src/shared/lib/formHelpers.ts:15-25 via
# documentMapper.ts:283), so a `[*]` row renders its label with an EMPTY value.
# The read-only array rail (ArrayWidget.tsx:214-232) prints every item's
# fields, which is what makes the recorded extraction method visible.
uiVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/vendor-product.schema.yaml"

display:
  titleField: "$.name"
  icon: "material"

form:
  layout: "sections"
  sections:
  - title: "Identity"
    fields:
    - path: "$.id"
      widget: "text"
      label: "ID"
      readonly: true
    - path: "$.kind"
      widget: "text"
      label: "Kind"
      readonly: true
      hidden: true
    - path: "$.name"
      widget: "text"
      label: "Name"
      readonly: true
    - path: "$.vendor"
      widget: "text"
      label: "Vendor"
      readonly: true
    - path: "$.catalog_number"
      widget: "text"
      label: "Catalog number"
      readonly: true
    - path: "$.grade"
      widget: "text"
      label: "Grade"
      readonly: true
    - path: "$.formulation"
      widget: "text"
      label: "Formulation"
      readonly: true
    - path: "$.status"
      widget: "text"
      label: "Status"
      readonly: true
    - path: "$.product_url"
      widget: "text"
      label: "Product URL"
      readonly: true
  - title: "Documents"
    fields:
    - path: "$.documents"
      widget: "array"
      label: "Attached documents"
      help: "One entry per document: title, kind, file media type, and the extraction method recorded for it."
      readonly: true
  - title: "Composition drafts"
    fields:
    - path: "$.composition_drafts"
      widget: "array"
      label: "Composition drafts"
      help: "Draft status and the extraction method each draft came from."
      readonly: true
