$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/material.schema.yaml"
title: "Material"
description: >
  A material concept used in experiments (cells, chemicals, media, etc.). Meaning about materials is expressed via Claims/Assertions, not embedded here.

type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"

required: [ kind, id, name, domain ]

properties:
  kind:
    const: "material"

  id:
    type: string
    description: "Stable local identifier (e.g., MAT-HEPG2)."

  name:
    type: string

  domain:
    type: string
    description: "High-level material domain."
    enum: [ cell_line, chemical, media, reagent, organism, sample, other ]

  status:
    type: string
    description: "Vocabulary curation state for this material concept."
    enum: [ proposed, in_review, active, rejected, deprecated ]

  lifecycleId:
    type: string
    const: "lab-vocabulary-control"
    description: "Lifecycle governing local vocabulary curation for this material concept."

  provenance:
    type: object
    description: "Minimal provenance for compiler- or AI-proposed concept records."
    additionalProperties: false
    properties:
      source:
        type: string
        enum: [ ai_mention, compiler, human, import ]
      sourceCurie:
        type: string
      sourceLabel:
        type: string
      createdBy:
        type: string
      createdAt:
        type: string
        format: date-time
      note:
        type: string

  class:
    type: array
    description: "Ontology-backed classifications (CURIEs)."
    items:
      $ref: "./datatypes/ref.schema.yaml"
    uniqueItems: true

  activities:
    type: array
    description: >
      Biological roles / mechanisms this material participates in — what it
      DOES (e.g. "agonist-of PPARα"), as opposed to class[], which says what it
      IS. Each entry relates the material to a target ontology/record term, so
      the lab and the AI can reason about why a reagent is used.
    items:
      type: object
      required: [ relation, term ]
      additionalProperties: false
      properties:
        relation:
          type: string
          description: "How this material acts on the target term."
          enum:
            - agonist-of
            - antagonist-of
            - inhibits
            - activates
            - targets
            - modulates
            - substrate-of
            - cofactor-of
            - binds
        term:
          description: "The target (e.g. a receptor/gene/process) as an ontology or record ref."
          $ref: "./datatypes/ref.schema.yaml"
        note:
          type: string
          description: "Optional free-text or citation note for this activity."
    uniqueItems: true

  pipetteHints:
    type: object
    description: "Default liquid handling parameters for this material class."
    additionalProperties: false
    properties:
      liquidClass:
        type: string
        enum: [ aqueous, viscous, volatile, other ]
      aspirateSpeed_uL_s:
        type: number
        exclusiveMinimum: 0
      dispenseSpeed_uL_s:
        type: number
        exclusiveMinimum: 0
      blowoutSpeed_uL_s:
        type: number
        exclusiveMinimum: 0
      touchTip:
        type: boolean
      touchTipSpeed_mm_s:
        type: number
        exclusiveMinimum: 0
      blowout:
        type: boolean
      airGap_uL:
        type: number
        minimum: 0
      dispenseDelay_s:
        type: number
        minimum: 0
      withdrawSpeed_mm_s:
        type: number
        exclusiveMinimum: 0
      notes:
        type: string

  definition:
    type: string
    description: "Ontology definition of this material (aids search and disambiguation)."

  molecular_weight:
    description: "Optional molecular weight for relevant chemical-like materials."
    allOf:
    - $ref: "./datatypes/amount.schema.yaml"
    - type: object
      properties:
        unit:
          const: "g/mol"

  chemical_properties:
    description: "Optional concept-level chemistry fields for chemical materials."
    $ref: "./datatypes/chemical-properties.schema.yaml"

  synonyms:
    type: array
    description: "Alternative names or abbreviations for this material."
    items: { type: string }
    uniqueItems: true

  tags:
    type: array
    items: { type: string }
    uniqueItems: true
