$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/equipment.schema.yaml"
title: "Equipment"
description: >
  Physical equipment or major tool used by the backend for admissibility checks.

type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"

required:
- kind
- id
- name

properties:
  kind:
    const: "equipment"

  id:
    type: string
    pattern: "^EQP-[A-Z0-9][A-Z0-9_-]*$"

  name:
    type: string
    minLength: 1

  # The class this instance is an instance OF. An `EQC-` record for an evidenced
  # vendor model, or a `CL:` CURIE for a generic physical kind (`CL:water_bath`) —
  # generic kinds are registry definitions (schema/registry/equipment-kinds), and
  # `EQC-` is reserved for models the lab can evidence.
  equipmentClassRef:
    allOf:
    - $ref: "./datatypes/ref.schema.yaml"
    - oneOf:
      - type: object
        properties:
          kind: { const: record }
          type: { const: equipment-class }
      - type: object
        properties:
          kind: { const: ontology }
          id:
            type: string
            pattern: "^CL:"

  instrumentRef:
    description: "Optional link to instrument record when this equipment is also a measuring device."
    allOf:
    - $ref: "./datatypes/ref.schema.yaml"
    - type: object
      properties:
        kind: { const: record }
        type: { const: instrument }

  manufacturer:
    type: string

  model:
    type: string

  serialNumber:
    type: string

  assetTag:
    type: string

  location:
    type: string

  # QMS8-C (D3, BRAD-A1 full clean break): this kind's DOMAIN operational field
  # is RETIRED. Its vocabulary duplicated what the record's lifecycle state
  # already says, and the two were independently writable — that is the defect
  # EQP-NEW-7LS1 shows on the lane (the domain field said one thing while the
  # lifecycle state said another). The lifecycle `state` declared below is now
  # the single operational truth, and `unevaluatedProperties: false` at the top
  # of this schema REFUSES any payload that still carries the retired key.
  # Existing records were carried over by the migration runner's strip leg
  # (schema/registry/registry-kinds.registry.yaml, stripDomainStatus).

  # Concrete configuration for this instance, keyed by the linked class's
  # settingsDefinition (e.g. `{ temperature_c: 55 }` for a water bath). Structural
  # validation is deliberately open — the KEYS are the class's business, and the
  # class-keyed check lives in lint (plan 2026-09-19_130430, Task 1.5.1/1.5.4).
  # Without this property an EQP- record could not legally carry the setting its
  # class declares (unevaluatedProperties: false rejected it).
  settings:
    type: object
    additionalProperties: true

  executionBackends:
    type: array
    items: { type: string }
    uniqueItems: true

  readiness:
    type: object
    additionalProperties: false
    properties:
      calibrationRequired:
        type: boolean
      qualificationRequired:
        type: boolean

  notes:
    type: string

  lifecycleId:
    type: string
    enum: [registry-ops]
    description: "Lifecycle governing this record's state transitions (declared per kind in schema/registry/registry-kinds.registry.yaml)."

  state:
    type: string
    enum: [draft, active, archived]
    description: "Lifecycle state (operational). DISTINCT from domain status/result fields."
