version: 1
title: "Material Profile Registry"
description: >
  Declarative authoring policy for material concepts, material-spec
  formulations, and material-instance records. Profiles do not replace JSON
  schemas; they describe which schema fields UI and AI authoring surfaces show,
  which values are app-owned, and which reference controls must be grounded.

# ── Clarification policy ──────────────────────────────────────────────────────
# What an AI clarification about a material may be asked AT, and what a pick at
# that layer still owes before the add is well-formed.
#
# Why it lives here: the layers are a provenance hierarchy (concept < formulation
# < instance < aliquot) and must never be collapsed. A question about a prepared
# solution must not be answerable with a bare compound, and picking a formulation
# still leaves a VOLUME owed (a spec fixes its own concentration). Wording is
# data too — the biologist reads `question`, and code must not invent it.
#
# `field` is the canonical add_material details field for the layer (the one an
# answer is written into and the gate trusts). `requires` lists the details keys
# still owed once that layer is chosen; `[]` means the pick is well-formed as-is.
clarification:
  # DEFAULTS, used when a profile declares no override. A profile may override any
  # layer's `requires` (and `question`) under its own `clarification:` key — the
  # first real case is a cell line, which is COUNTED, not dosed.
  layers:
    material:
      label: "the compound"
      field: material_ref
      question: 'Which material is "{label}"? Pick an ontology term or create a local record.'
      requires: [concentration, volume]
    material-spec:
      label: "the prepared solution"
      field: material_spec_ref
      question: 'Which prepared solution of "{label}" should this use?'
      requires: [volume]
    material-instance:
      label: "the preparation"
      field: material_instance_ref
      question: 'Which preparation or lot of "{label}" should this run use?'
      requires: []
    aliquot:
      label: "the aliquot"
      field: aliquot_ref
      question: 'Which aliquot of "{label}" should this use?'
      requires: []
    vendor-product:
      label: "the catalog item"
      field: vendor_product_ref
      question: 'Which catalog item for "{label}" should this use?'
      requires: [volume]

profiles:
  chemical:
    label: "Chemical"
    applies_when:
      domain: [chemical, reagent]
    layers: [concept]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: id
      layer: concept
      label: "Material ID"
      widget: text
      required: true
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: chemical
      control: app-owned
    - path: class
      layer: concept
      label: "Ontology classes"
      widget: reflist
      control: ontology-ref
      ontologies: [chebi]
    - path: definition
      layer: concept
      label: "Definition"
      widget: textarea
      control: free-text
    - path: synonyms
      layer: concept
      label: "Synonyms"
      widget: array
      control: free-text
    - path: molecular_weight
      layer: concept
      label: "Molecular weight"
      widget: object
      control: free-text
    - path: chemical_properties.molecular_formula
      layer: concept
      label: "Molecular formula"
      widget: text
      control: free-text
    - path: chemical_properties.cas_number
      layer: concept
      label: "CAS number"
      widget: text
      control: free-text
    - path: status
      layer: concept
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: concept
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: concept
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, class, molecular_weight, chemical_properties.molecular_formula, chemical_properties.cas_number]

  cell_line:
    label: "Cell line"
    applies_when:
      domain: [cell_line]
    # A cell line is COUNTED, never dosed — and adherent cells may have ZERO
    # volume. Both of these are complete additions and neither is questioned:
    #   "add 10,000 HepG2 cells in 72 µL of DMEM"   → the volume is taken as given
    #   "add 10,000 HepG2 cells"                    → an adhered layer, no volume
    # So the concept layer owes a count and nothing else. NEVER ask a biologist
    # for a volume here: capture what happened; do not slow them down.
    clarification:
      material:
        requires: [count]
        question: 'How many "{label}" per well?'
    layers: [concept, formulation, instance]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: id
      layer: concept
      label: "Material ID"
      widget: text
      required: true
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: cell_line
      control: app-owned
    - path: class
      layer: concept
      label: "Cell ontology class"
      widget: reflist
      control: ontology-ref
      ontologies: [cl, clo, efo]
    - path: definition
      layer: concept
      label: "Definition"
      widget: textarea
      control: free-text
    - path: formulation_kind
      layer: formulation
      label: "Formulation kind"
      widget: select
      default: biological_preparation
      control: app-owned
    - path: material_ref
      layer: formulation
      label: "Cell material"
      widget: ref
      required: true
      control: local-material-required
      ontologies: [cl, clo, efo]
    - path: biological_state.passage_number
      layer: instance
      label: "Passage"
      widget: number
      control: free-text
    - path: biological_state.parent_culture_ref
      layer: instance
      label: "Parent culture"
      widget: ref
      control: record-ref
    - path: biological_state.medium_note
      layer: instance
      label: "Medium"
      widget: text
      control: free-text
    - path: status
      layer: concept
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: concept
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: concept
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, class, biological_state.passage_number, biological_state.medium_note]

  media_composition:
    label: "Media composition"
    applies_when:
      domain: [media]
      formulation_kind: [defined_composition, complex_composition]
    layers: [concept, formulation]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: media
      control: app-owned
    - path: class
      layer: concept
      label: "Media ontology class"
      widget: reflist
      control: ontology-ref
      ontologies: [xco, msio, obi, chebi]
    - path: formulation_kind
      layer: formulation
      label: "Formulation kind"
      widget: select
      default: complex_composition
      control: app-owned
    - path: material_ref
      layer: formulation
      label: "Media concept"
      widget: ref
      required: true
      control: local-material-required
      ontologies: [xco, msio, obi]
    - path: formulation.composition
      layer: formulation
      label: "Components"
      widget: array
      control: local-material-required
      ontologies: [chebi, xco, msio, obi]
    - path: formulation.ph
      layer: formulation
      label: "pH"
      widget: number
      control: free-text
    - path: formulation.notes
      layer: formulation
      label: "Notes"
      widget: textarea
      control: free-text
    - path: status
      layer: formulation
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: formulation
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: formulation
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, class, formulation.composition, formulation.ph]

  single_active_formulation:
    label: "Single-active formulation"
    applies_when:
      formulation_kind: [single_active]
    layers: [concept, formulation, instance]
    fields:
    - path: name
      layer: formulation
      label: "Formulation name"
      widget: text
      required: true
      control: free-text
    - path: material_ref
      layer: formulation
      label: "Active material"
      widget: ref
      required: true
      control: local-material-required
      ontologies: [chebi]
    - path: formulation.concentration
      layer: formulation
      label: "Concentration"
      widget: object
      control: free-text
    - path: formulation.solvent_ref
      layer: formulation
      label: "Solvent"
      widget: ref
      control: local-material-required
      ontologies: [chebi, obi]
    - path: formulation.grade
      layer: formulation
      label: "Grade"
      widget: text
      control: free-text
    - path: vendor_product_ref
      layer: formulation
      label: "Vendor product"
      widget: ref
      control: record-ref
    - path: lot
      layer: instance
      label: "Lot"
      widget: object
      control: free-text
    - path: status
      layer: formulation
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: formulation
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: formulation
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [material_ref, formulation.concentration, formulation.solvent_ref, vendor_product_ref]

  sample:
    label: "Sample"
    applies_when:
      domain: [sample]
    layers: [concept, instance]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: sample
      control: app-owned
    - path: class
      layer: concept
      label: "Sample ontology class"
      widget: reflist
      control: ontology-ref
      ontologies: [uberon, obi, efo]
    - path: derived_state.source_material_refs
      layer: instance
      label: "Source materials"
      widget: reflist
      control: local-material-required
      ontologies: [cl, uberon, ncbitaxon, efo]
    - path: derived_state.derivation_type
      layer: instance
      label: "Derivation type"
      widget: text
      control: free-text
    - path: derived_state.collection_date
      layer: instance
      label: "Collection date"
      widget: datetime
      control: free-text
    - path: status
      layer: concept
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: concept
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: concept
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, class, derived_state.source_material_refs, derived_state.derivation_type]

  other:
    label: "Other material"
    applies_when:
      domain: [other, organism]
    layers: [concept, formulation, instance]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: other
      control: free-text
    - path: class
      layer: concept
      label: "Ontology classes"
      widget: reflist
      control: ontology-ref
      ontologies: [obi, efo, ncbitaxon, uberon, chebi]
    - path: definition
      layer: concept
      label: "Definition"
      widget: textarea
      control: free-text
    - path: material_ref
      layer: formulation
      label: "Material"
      widget: ref
      control: local-material-required
      ontologies: [obi, efo, ncbitaxon, uberon, chebi]
    - path: status
      layer: concept
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: concept
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: concept
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, domain, class, definition]
