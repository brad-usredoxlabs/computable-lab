version: 1
title: "Material Profile Registry"
description: >
  Declarative authoring policy for material concepts, material-spec
  formulations, and material-instance records. Profiles do not replace JSON
  schemas; they describe which schema fields UI and AI authoring surfaces show,
  which values are app-owned, and which reference controls must be grounded.

# ── Clarification policy ──────────────────────────────────────────────────────
# What an AI clarification about a material may be asked AT, and what a pick at
# that layer still owes before the add is well-formed.
#
# Why it lives here: the layers are a provenance hierarchy (concept < formulation
# < instance < aliquot) and must never be collapsed. A question about a prepared
# solution must not be answerable with a bare compound, and picking a formulation
# still leaves a VOLUME owed (a spec fixes its own concentration). Wording is
# data too — the biologist reads `question`, and code must not invent it.
#
# `field` is the canonical add_material details field for the layer (the one an
# answer is written into and the gate trusts). `requires` lists the details keys
# still owed once that layer is chosen; `[]` means the pick is well-formed as-is.
clarification:
  # DEFAULTS, used when a profile declares no override. A profile may override any
  # layer's `requires` (and `question`) under its own `clarification:` key — the
  # first real case is a cell line, which is COUNTED, not dosed.
  layers:
    material:
      label: "the compound"
      field: material_ref
      question: 'Which material is "{label}"? Pick an ontology term or create a local record.'
      requires: [concentration, volume]
    material-spec:
      label: "the prepared solution"
      field: material_spec_ref
      question: 'Which prepared solution of "{label}" should this use?'
      requires: [volume]
    material-instance:
      label: "the preparation"
      field: material_instance_ref
      question: 'Which preparation or lot of "{label}" should this run use?'
      requires: []
    aliquot:
      label: "the aliquot"
      field: aliquot_ref
      question: 'Which aliquot of "{label}" should this use?'
      requires: []
    vendor-product:
      label: "the catalog item"
      field: vendor_product_ref
      question: 'Which catalog item for "{label}" should this use?'
      requires: [volume]
  # ── Candidate ranking (L2-CLARIFY-PICKER-1 P1) ────────────────────────────
  # How a clarification's material CANDIDATE rows are ordered for the picker,
  # and which of them may hold the focused (keyboard) default. This is POLICY,
  # not code: the comparator's algorithm (label-equality > contains-noun >
  # family rank) is structural, but the RANK integers, the can-be-default
  # flags, and the contains-section label are DATA declared here.
  #
  # `families` is keyed by the comparator's EXISTING search-category
  # vocabulary (MaterialSearchItem['category']) PLUS the `composition`
  # pseudo-family — a row whose label is a multi-part aggregate
  # (aggregateComponentTokens(label).length > 1, the L2-TERM-1 UC-D4 signal)
  # OVERRIDES its category family. A composition is a Composition under any
  # ontology, and can NEVER be the focused default: the scientist's Enter must
  # commit the concept the prompt named, not an aggregate (the W1 bug). The
  # flag is enforced against `can_be_default`, never label shape.
  #
  # The initial ranks replicate today's observable ordering, so the data edit
  # alone changes nothing except the composition/never-default rule; the
  # equality/contains bands do the scientific reordering. ABSENT declaration =>
  # NO ranking at all (the resolver keeps its emitted order) — there is no
  # fallback table. Wording is data too: the section label is a TEMPLATE, so
  # changing it here moves the on-screen section without a code change.
  #
  # NON-RANKED convention (advc-c1 DEFECT 2 / orch ruling): families not
  # listed here are not ranked; their rows appear after all ranked rows in
  # input order. No rank is fabricated in TS for an undeclared family — the
  # old `?? 10` sent it to the bottom and the interim `?? 0` / `?? inputIndex`
  # sent an undeclared-at-index-0 row to the top; both were silent TS policy.
  # Likewise an ABSENT `can_be_default` for a family means the family is
  # defaultable; the only non-defaultable family is one this table declares
  # `can_be_default: false` (today: `composition`).
  candidate_ranking:
    contains_section_label: 'contains "{label}" ({count})'
    families:
      saved-stock:        { rank: 0, can_be_default: true }
      vendor-reagent:     { rank: 1, can_be_default: true }
      prepared-material:  { rank: 2, can_be_default: true }
      biological-derived: { rank: 3, can_be_default: true }
      concept-only:       { rank: 4, can_be_default: true }
      composition:        { rank: 4, can_be_default: false }

profiles:
  chemical:
    label: "Chemical"
    applies_when:
      domain: [chemical, reagent]
    layers: [concept]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: id
      layer: concept
      label: "Material ID"
      widget: text
      required: true
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: chemical
      control: app-owned
    - path: class
      layer: concept
      label: "Ontology classes"
      widget: reflist
      control: ontology-ref
      ontologies: [chebi]
    - path: definition
      layer: concept
      label: "Definition"
      widget: textarea
      control: free-text
    - path: synonyms
      layer: concept
      label: "Synonyms"
      widget: array
      control: free-text
    - path: molecular_weight
      layer: concept
      label: "Molecular weight"
      widget: object
      control: free-text
    - path: chemical_properties.molecular_formula
      layer: concept
      label: "Molecular formula"
      widget: text
      control: free-text
    - path: chemical_properties.cas_number
      layer: concept
      label: "CAS number"
      widget: text
      control: free-text
    - path: status
      layer: concept
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: concept
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: concept
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, class, molecular_weight, chemical_properties.molecular_formula, chemical_properties.cas_number]

  cell_line:
    label: "Cell line"
    applies_when:
      domain: [cell_line]
    # A cell line is COUNTED, never dosed — and adherent cells may have ZERO
    # volume. Both of these are complete additions and neither is questioned:
    #   "add 10,000 HepG2 cells in 72 µL of DMEM"   → the volume is taken as given
    #   "add 10,000 HepG2 cells"                    → an adhered layer, no volume
    # So the concept layer owes a count and nothing else. NEVER ask a biologist
    # for a volume here: capture what happened; do not slow them down.
    clarification:
      material:
        requires: [count]
        question: 'How many "{label}" per well?'
    layers: [concept, formulation, instance]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: id
      layer: concept
      label: "Material ID"
      widget: text
      required: true
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: cell_line
      control: app-owned
    - path: class
      layer: concept
      label: "Cell ontology class"
      widget: reflist
      control: ontology-ref
      ontologies: [cl, clo, efo]
    - path: definition
      layer: concept
      label: "Definition"
      widget: textarea
      control: free-text
    - path: formulation_kind
      layer: formulation
      label: "Formulation kind"
      widget: select
      default: biological_preparation
      control: app-owned
    - path: material_ref
      layer: formulation
      label: "Cell material"
      widget: ref
      required: true
      control: local-material-required
      ontologies: [cl, clo, efo]
    - path: biological_state.passage_number
      layer: instance
      label: "Passage"
      widget: number
      control: free-text
    - path: biological_state.parent_culture_ref
      layer: instance
      label: "Parent culture"
      widget: ref
      control: record-ref
    - path: biological_state.medium_note
      layer: instance
      label: "Medium"
      widget: text
      control: free-text
    - path: status
      layer: concept
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: concept
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: concept
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, class, biological_state.passage_number, biological_state.medium_note]

  media_composition:
    label: "Media composition"
    applies_when:
      domain: [media]
      formulation_kind: [defined_composition, complex_composition]
    layers: [concept, formulation]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: media
      control: app-owned
    - path: class
      layer: concept
      label: "Media ontology class"
      widget: reflist
      control: ontology-ref
      ontologies: [xco, msio, obi, chebi]
    - path: formulation_kind
      layer: formulation
      label: "Formulation kind"
      widget: select
      default: complex_composition
      control: app-owned
    - path: material_ref
      layer: formulation
      label: "Media concept"
      widget: ref
      required: true
      control: local-material-required
      ontologies: [xco, msio, obi]
    - path: formulation.composition
      layer: formulation
      label: "Components"
      widget: array
      control: local-material-required
      ontologies: [chebi, xco, msio, obi]
    - path: formulation.ph
      layer: formulation
      label: "pH"
      widget: number
      control: free-text
    - path: formulation.notes
      layer: formulation
      label: "Notes"
      widget: textarea
      control: free-text
    - path: status
      layer: formulation
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: formulation
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: formulation
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, class, formulation.composition, formulation.ph]

  single_active_formulation:
    label: "Single-active formulation"
    applies_when:
      formulation_kind: [single_active]
    layers: [concept, formulation, instance]
    fields:
    - path: name
      layer: formulation
      label: "Formulation name"
      widget: text
      required: true
      control: free-text
    - path: material_ref
      layer: formulation
      label: "Active material"
      widget: ref
      required: true
      control: local-material-required
      ontologies: [chebi]
    - path: formulation.concentration
      layer: formulation
      label: "Concentration"
      widget: object
      control: free-text
    - path: formulation.solvent_ref
      layer: formulation
      label: "Solvent"
      widget: ref
      control: local-material-required
      ontologies: [chebi, obi]
    - path: formulation.grade
      layer: formulation
      label: "Grade"
      widget: text
      control: free-text
    - path: vendor_product_ref
      layer: formulation
      label: "Vendor product"
      widget: ref
      control: record-ref
    - path: lot
      layer: instance
      label: "Lot"
      widget: object
      control: free-text
    - path: status
      layer: formulation
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: formulation
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: formulation
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [material_ref, formulation.concentration, formulation.solvent_ref, vendor_product_ref]

  sample:
    label: "Sample"
    applies_when:
      domain: [sample]
    layers: [concept, instance]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: sample
      control: app-owned
    - path: class
      layer: concept
      label: "Sample ontology class"
      widget: reflist
      control: ontology-ref
      ontologies: [uberon, obi, efo]
    - path: derived_state.source_material_refs
      layer: instance
      label: "Source materials"
      widget: reflist
      control: local-material-required
      ontologies: [cl, uberon, ncbitaxon, efo]
    - path: derived_state.derivation_type
      layer: instance
      label: "Derivation type"
      widget: text
      control: free-text
    - path: derived_state.collection_date
      layer: instance
      label: "Collection date"
      widget: datetime
      control: free-text
    - path: status
      layer: concept
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: concept
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: concept
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, class, derived_state.source_material_refs, derived_state.derivation_type]

  other:
    label: "Other material"
    applies_when:
      domain: [other, organism]
    layers: [concept, formulation, instance]
    fields:
    - path: kind
      layer: concept
      label: "Kind"
      widget: hidden
      required: true
      default: material
      control: app-owned
    - path: name
      layer: concept
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: domain
      layer: concept
      label: "Domain"
      widget: select
      required: true
      default: other
      control: free-text
    - path: class
      layer: concept
      label: "Ontology classes"
      widget: reflist
      control: ontology-ref
      ontologies: [obi, efo, ncbitaxon, uberon, chebi]
    - path: definition
      layer: concept
      label: "Definition"
      widget: textarea
      control: free-text
    - path: material_ref
      layer: formulation
      label: "Material"
      widget: ref
      control: local-material-required
      ontologies: [obi, efo, ncbitaxon, uberon, chebi]
    - path: status
      layer: concept
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: concept
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: concept
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, domain, class, definition]

  vendor-product:
    label: "Vendor product"
    applies_when:
      # record-TYPE key, not a material domain: the vendor-product authoring surface
      # looks this profile up by id (registry.get('vendor-product')). No material record
      # carries this domain, so material lookups are unaffected.
      domain: [vendor-product]
    layers: [vendor-product]
    fields:
    - path: kind
      layer: vendor-product
      label: "Kind"
      widget: hidden
      required: true
      default: vendor-product
      control: app-owned
    - path: id
      layer: vendor-product
      label: "Vendor product ID"
      widget: text
      required: true
      control: app-owned
    - path: name
      layer: vendor-product
      label: "Name"
      widget: text
      required: true
      control: free-text
    - path: vendor
      layer: vendor-product
      label: "Vendor"
      widget: text
      required: true
      control: free-text
    - path: catalog_number
      layer: vendor-product
      label: "Catalog number"
      widget: text
      required: true
      control: free-text
    - path: material_ref
      layer: vendor-product
      label: "Linked material concept"
      widget: ref
      required: true
      control: local-material-required
      ontologies: [chebi, ncit, obi, efo]
    - path: package_size
      layer: vendor-product
      label: "Package size"
      widget: text
      control: free-text
    - path: formulation
      layer: vendor-product
      label: "Formulation / stock concentration as supplied"
      widget: textarea
      control: free-text
    - path: grade
      layer: vendor-product
      label: "Grade / purity"
      widget: text
      control: free-text
    - path: storage_recommendation
      layer: vendor-product
      label: "Storage recommendation"
      widget: textarea
      control: free-text
    - path: product_url
      layer: vendor-product
      label: "Product URL"
      widget: text
      control: free-text
    - path: documents
      layer: vendor-product
      label: "Documents"
      widget: array
      control: app-owned
    - path: synonyms
      layer: vendor-product
      label: "Synonyms"
      widget: array
      control: free-text
    - path: status
      layer: vendor-product
      label: "Status"
      widget: select
      default: proposed
      control: app-owned
    - path: lifecycleId
      layer: vendor-product
      label: "Lifecycle"
      widget: hidden
      default: lab-vocabulary-control
      control: app-owned
    - path: provenance
      layer: vendor-product
      label: "Provenance"
      widget: object
      control: app-owned
    quick_add: [name, vendor, catalog_number, material_ref]
