# UI specification for GC Method records — generated editor surface.
# EDITOR-1 binding: section blocks claim slots EXPLICITLY (list order = field
# order); the timed-events repeater carries NO slots, so it keeps path-prefix
# binding on its `path` (repeater convention per types.ts EditorBlock).
# Every slot in editor.slots[] is claimed exactly once — the loader errors on
# unknown / double-claimed / unclaimed slots in an explicitly-bound spec.
uiVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/gc-method.schema.yaml"

display:
  titleField: "$.name"
  subtitleField: "$.method_version"

editor:
  mode: "document"
  blocks:
    - id: "identity"
      kind: "section"
      label: "Identity"
      help: "Method identity. state advances only via lifecycle transitions."
      slots: ["id-slot", "name-slot", "method-name-slot", "method-version-slot", "state-slot"]
    - id: "acquisition"
      kind: "section"
      label: "Acquisition"
      help: "Capture only: absent sections are unknown, never defaults."
      slots: ["oven-slot", "inlet-slot", "diverter-slot", "saver-slot", "column-slot"]
    - id: "analysis"
      kind: "section"
      label: "Analysis"
      help: "Integration parameters (capture) + declared executable binding."
      slots: ["global-slot", "calibration-slot", "executable-binding-slot"]
    - id: "timed-events"
      kind: "repeater"
      label: "Timed events"
      help: "ChemStation timed-event windows. No slots declared: binds by path prefix on the array below."
      path: "$.analysis.timed_events"
    - id: "compound-assignments"
      kind: "repeater"
      label: "Compound assignments"
      help: "FAME/FFA identities this method integrates (ontology/record refs)."
      path: "$.analysis.compound_assignments"
    - id: "provenance"
      kind: "section"
      label: "Provenance"
      help: "Vendor-derived values live ONLY here (source_files.key_values)."
      slots: ["entered-by-slot", "source-files-slot"]
  slots:
    # --- identity ---
    - id: "id-slot"
      path: "$.id"
      label: "ID"
      widget: "readonly"
    - id: "name-slot"
      path: "$.name"
      label: "Name"
      widget: "text"
      required: true
    - id: "method-name-slot"
      path: "$.method_name"
      label: "Method name (as captured)"
      widget: "text"
      help: "Verbatim ChemStation method name from ACQ.TXT extraction."
    - id: "method-version-slot"
      path: "$.method_version"
      label: "Method version"
      widget: "number"
      required: true
    - id: "state-slot"
      path: "$.state"
      label: "State"
      widget: "readonly"
      help: "Read-only. Lifecycle-gated (registry-ops: draft -> active -> archived)."
    # --- acquisition (whole-section slots; capture shapes are free inside) ---
    - id: "oven-slot"
      path: "$.acquisition.oven"
      label: "Oven program (steps)"
      widget: "textarea"
      help: "Captured step list (step / hold_time_min / ramp_rate_c_per_min / target_temp_c)."
    - id: "inlet-slot"
      path: "$.acquisition.inlet"
      label: "Inlet"
      widget: "textarea"
      help: "mode / temp_c / pressure_psi / split_ratio / carrier_gas."
    - id: "diverter-slot"
      path: "$.acquisition.diverter"
      label: "Diverter (setpoint)"
      widget: "textarea"
      help: "position + description — semantics undocumented on the captured method."
    - id: "saver-slot"
      path: "$.acquisition.saver"
      label: "Saver (setpoint)"
      widget: "textarea"
      help: "position + description — semantics undocumented on the captured method."
    - id: "column-slot"
      path: "$.acquisition.column"
      label: "Column"
      widget: "textarea"
      help: "length_m / id_mm / film_thickness_um / stationary_phase / flow_mode."
    # --- analysis ---
    - id: "global-slot"
      path: "$.analysis.global"
      label: "Global integration"
      widget: "textarea"
      help: "baseline_correction / skim_ratio / valley_to_peak_ratio / peak_width_s."
    - id: "calibration-slot"
      path: "$.analysis.calibration"
      label: "Calibration"
      widget: "textarea"
      help: "istd_ref / istd_amount / dilution_factor / multiplier / calibration_levels."
    - id: "executable-binding-slot"
      path: "$.analysis.executable_binding"
      label: "Executable binding"
      widget: "textarea"
      help: "Declared data: engine_ref + declared_at. Without it, timed events are capture-only (lint-blocked from executable use)."
    # --- provenance ---
    - id: "entered-by-slot"
      path: "$.provenance_capture.entered_by"
      label: "Entered by"
      widget: "ref"
      refKind: "person"
    - id: "source-files-slot"
      path: "$.provenance_capture.source_files"
      label: "Source files"
      widget: "textarea"
      help: "file / role / key_values — imported vendor key-values ONLY; never mapped into executable fields."

list:
  columns:
  - path: "$.id"
    label: "ID"
    width: "140px"
  - path: "$.name"
    label: "Name"
  - path: "$.method_version"
    label: "Version"
    width: "90px"
  - path: "$.state"
    label: "State"
    width: "100px"
