$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/material-spec.schema.yaml"
title: "Material Spec"
description: >
  A reusable formulation/specification for a material concept (e.g. "Clofibrate
  100 mM in DMSO"). This is an abstract intended state, not a specific lot or
  physical container.

type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"

required: [ kind, id, name, material_ref ]

properties:
  kind:
    const: "material-spec"

  id:
    type: string
    description: "Stable local identifier (e.g., MSP-CLOFIBRATE-100MM-DMSO)."

  name:
    type: string

  material_ref:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Reference to the material concept this spec represents. For a single-active formulation this is the active/focal material; for a defined composition this is the composition concept itself."

  formulation_kind:
    type: string
    description: "Biological intent of the formulation/specification."
    enum: [ single_active, defined_composition, complex_composition, biological_preparation ]

  status:
    type: string
    description: "Curation state for this formulation/specification."
    enum: [ proposed, in_review, active, rejected, deprecated ]

  lifecycleId:
    type: string
    const: "lab-vocabulary-control"
    description: "Lifecycle governing local formulation/spec curation."

  provenance:
    type: object
    description: "Minimal provenance for compiler- or AI-proposed formulation records."
    additionalProperties: false
    properties:
      source:
        type: string
        enum: [ ai_mention, compiler, human, import ]
      sourceCurie:
        type: string
      sourceLabel:
        type: string
      createdBy:
        type: string
      createdAt:
        type: string
        format: date-time
      note:
        type: string

  vendor_product_ref:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Optional commercial source product used as-is or as canonical sourcing metadata."

  formulation:
    type: object
    additionalProperties: false
    properties:
      concentration:
        oneOf:
        - $ref: "./datatypes/concentration.schema.yaml"
        - $ref: "./datatypes/amount.schema.yaml"
      solvent_ref:
        $ref: "./datatypes/ref.schema.yaml"
      composition:
        type: array
        items:
          $ref: "./datatypes/composition-entry.schema.yaml"
      grade:
        type: string
      ph:
        type: number
      notes:
        type: string

  handling:
    type: object
    additionalProperties: false
    properties:
      storage_temperature_C: { type: number }
      light_sensitive: { type: boolean }
      max_freeze_thaw_cycles: { type: integer, minimum: 0 }
      stability_note: { type: string }

  tags:
    type: array
    items: { type: string }
    uniqueItems: true
