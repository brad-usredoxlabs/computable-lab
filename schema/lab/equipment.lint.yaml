# Authoring policy for Equipment records (QMS8-B, draft-gated authoring).
# Interpreted by server/src/lint/AuthoringGuard.ts at create/update time.
# gateOnPolicySetting: the gate fires only when the ACTIVE policy bundle declares
# authoringGate: deny (schema/core/policy-bundles/*.policy-bundle.yaml).
# guardWhenChanged names TOP-LEVEL payload keys only (AuthoringGuard.ts semantics:
# dotted paths never match). `notes` is deliberately excluded (annotation is not
# re-authoring the record's spec); `state`/`lifecycleId` are excluded
# because state changes are the lifecycle transition's own role check.
# (QMS8-C D3: `status` was excluded for the same reason until the domain status
# field was retired outright for this kind — the exclusion no longer has a field
# to name.)
lintVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/equipment.schema.yaml"
rules: []
authoring:
  denyCode: EQUIPMENT_AUTHORING_FORBIDDEN
  gateOnPolicySetting: authoringGate        # fires only when active bundle says deny
  require:
    anyOf:
      - systemActor: true
      - localAdmin: true
      - role: author
  guardWhenChanged:
    - name
    - equipmentClassRef
    # INSTR-COLLAPSE-1 C2: `instrumentRef` entry gone — the reciprocal
    # equipment->instrument property was retired from the schema.
    - manufacturer
    - model
    - serialNumber
    - assetTag
    - location
    - settings
    - executionBackends
    - readiness
