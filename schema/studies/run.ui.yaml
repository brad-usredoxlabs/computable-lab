# UI specification for Run records
uiVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/run.schema.yaml"
taptab:
  style: form

display:
  titleField: "$.title"
  icon: "run"

form:
  layout: "sections"
  sections:
  - title: "Identity"
    fields:
    - path: "$.recordId"
      widget: "text"
      label: "Record ID"
      readonly: true
    - path: "$.kind"
      widget: "text"
      label: "Kind"
      readonly: true
      hidden: true
  - title: "Basic Information"
    fields:
    - path: "$.title"
      widget: "text"
      label: "Title"
    - path: "$.experimentId"
      widget: "ref"
      label: "Experiment"
      # System-assigned parent link — set when the run is created and never
      # edited from the record form (mirrors recordId / kind).
      readonly: true
    - path: "$.methodEventGraphId"
      widget: "ref"
      label: "Method Event Graph"
    - path: "$.methodPlatform"
      widget: "text"
      label: "Method Platform"
    - path: "$.methodVocabId"
      widget: "text"
      label: "Method Vocabulary"
    - path: "$.status"
      widget: "select"
      label: "Status"
    - path: "$.notes"
      widget: "markdown"
      label: "Notes"
  - title: "Timing"
    collapsible: true
    fields:
    - path: "$.startedAt"
      widget: "datetime"
      label: "Started"
    - path: "$.endedAt"
      widget: "datetime"
      label: "Ended"
  - title: "Metadata"
    collapsible: true
    fields:
    - path: "$.tags"
      widget: "chips"
      label: "Tags"
      props:
        sources: ["local", "ols"]
        ontologies: ["efo", "chebi", "go"]
        field: "tags"
  - title: "FAIR"
    collapsible: true
    collapsed: true
    fields:
    # Inherited from the parent study (read-only). The value is copied at
    # creation and kept in sync via read-through in UIHandlers; set the license
    # on the study, not here. Options are listed so the read-only display can
    # render the friendly label.
    - path: "$.license"
      widget: "select"
      label: "License"
      readonly: true
      options:
        - value: "CC0-1.0"
          label: "CC0 1.0 (Public Domain Dedication)"
        - value: "CC-BY-4.0"
          label: "CC BY 4.0 (Attribution)"
        - value: "CC-BY-SA-4.0"
          label: "CC BY-SA 4.0 (Attribution-ShareAlike)"
        - value: "CC-BY-NC-4.0"
          label: "CC BY-NC 4.0 (Attribution-NonCommercial)"
        - value: "CC-BY-NC-SA-4.0"
          label: "CC BY-NC-SA 4.0 (Attribution-NonCommercial-ShareAlike)"
        - value: "CC-BY-ND-4.0"
          label: "CC BY-ND 4.0 (Attribution-NoDerivatives)"
        - value: "CC-BY-NC-ND-4.0"
          label: "CC BY-NC-ND 4.0 (Attribution-NonCommercial-NoDerivatives)"
        - value: "proprietary"
          label: "All Rights Reserved (Proprietary)"
        - value: "internal-only"
          label: "Internal / Confidential"
    - path: "$.keywords"
      widget: "chips"
      label: "Keywords"
      props:
        sources: ["local", "ols"]
        ontologies: ["efo", "chebi", "go"]
        field: "keywords"
    # Hidden in the editor — auto-filled at export time (DOIs, accessions, etc.).
    - path: "$.relatedIdentifiers"
      widget: "array"
      label: "Related Identifiers"
      hidden: true
  - title: "Provenance"
    collapsible: true
    collapsed: true
    fields:
    - path: "$.createdAt"
      widget: "text"
      label: "Created"
      readonly: true
    - path: "$.createdBy"
      widget: "text"
      label: "Created By"
      readonly: true
    - path: "$.updatedAt"
      widget: "text"
      label: "Updated"
      readonly: true

list:
  columns:
  - path: "$.recordId"
    label: "ID"
    width: "120px"
  - path: "$.title"
    label: "Title"
  - path: "$.experimentId"
    label: "Experiment"
