$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/study.schema.yaml"
title: "Study"
description: >
  A Study groups related Experiments under a shared scientific/organizational umbrella. It is NOT a container that enumerates child records. Experiments reference studyId.

type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"

required:
- kind
- recordId
- title
- shortSlug

properties:
  $schema:
    type: string
    description: "JSON Schema reference for this record."

  kind:
    const: "study"
    description: "Record discriminator."

  recordId:
    type: string
    description: "Stable local identifier (e.g., STU-000003)."

  title:
    type: string
    description: "Human-readable title for the study."

  shortSlug:
    type: string
    description: "URL-friendly short identifier for the study."

  state:
    type: string
    description: "Workflow state (draft, in_progress, accepted, superseded, archived)."

  description:
    type: string
    description: "Optional high-level description of the study."

  # Project-level license, constrained to a fixed vocabulary (Creative Commons
  # family + private options). Experiments and runs inherit this value. The
  # shared FAIRCommon.license stays a lenient string so other record kinds and
  # legacy free-text values are not broken; only the authoritative study field
  # is enum-validated here.
  license:
    type: string
    description: "Project license (SPDX-style identifier from the allowed set)."
    enum:
    - "CC0-1.0"
    - "CC-BY-4.0"
    - "CC-BY-SA-4.0"
    - "CC-BY-NC-4.0"
    - "CC-BY-NC-SA-4.0"
    - "CC-BY-ND-4.0"
    - "CC-BY-NC-ND-4.0"
    - "proprietary"
    - "internal-only"

  tags:
    type: array
    items: { type: string }
    uniqueItems: true

  # Optional, lightweight intent anchors (not required)
  # DEPRECATED: Use claimRelationships or relationship records with
  # verb=investigates/depends_on/aims_to_establish instead.
  primaryClaimIds:
    type: array
    description: >
      DEPRECATED: Use claimRelationships or relationship records with typed verbs instead. Optional curated list of claim recordIds that define the study's primary intent.
    items:
      type: string
    uniqueItems: true

  # Typed claim relationships — inline convenience for the most common
  # project→claim verbs. Authoritative relationships live as relationship
  # records (kind: "relationship") which carry provenance and are queryable.
  claimRelationships:
    type: array
    description: "Inline typed relationships to claims. Verbs: investigates, depends_on, aims_to_establish, assumes."
    items:
      type: object
      additionalProperties: false
      required: [ verb, claimId ]
      properties:
        verb:
          type: string
          enum: [ investigates, depends_on, aims_to_establish, assumes ]
        claimId:
          type: string

  attachments:
    type: array
    description: "Optional study-level attachments (charter, plan, references)."
    items:
      $ref: "./datatypes/file-ref.schema.yaml"