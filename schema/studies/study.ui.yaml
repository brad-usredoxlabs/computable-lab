# UI specification for Study records
uiVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/study.schema.yaml"

display:
  titleField: "$.title"
  subtitleField: "$.shortSlug"
  icon: "study"

form:
  layout: "sections"
  sections:
  - title: "Identity"
    fields:
    - path: "$.recordId"
      widget: "text"
      label: "Record ID"
      readonly: true
    - path: "$.kind"
      widget: "text"
      label: "Kind"
      readonly: true
      hidden: true
  - title: "Basic Information"
    fields:
    - path: "$.title"
      widget: "text"
      label: "Title"
      required: true
    - path: "$.shortSlug"
      widget: "text"
      label: "Short Slug"
      required: true
    - path: "$.state"
      widget: "select"
      label: "State"
      options:
        - value: "draft"
          label: "Draft"
        - value: "in_progress"
          label: "In Progress"
        - value: "accepted"
          label: "Accepted"
        - value: "superseded"
          label: "Superseded"
        - value: "archived"
          label: "Archived"
    - path: "$.description"
      widget: "markdown"
      label: "Description"
  - title: "Metadata"
    collapsible: true
    fields:
    - path: "$.tags"
      widget: "chips"
      label: "Tags"
      props:
        sources: ["local", "ols"]
        ontologies: ["efo", "chebi", "go"]
        field: "tags"
    - path: "$.primaryClaimIds"
      widget: "array"
      label: "Primary Claim IDs"
  - title: "FAIR"
    collapsible: true
    collapsed: true
    fields:
    # Project-level license. Set here on the study; experiments and runs
    # inherit it (read-only) — see experiment.ui.yaml / run.ui.yaml and the
    # read-through in UIHandlers.getRecordEditorProjection.
    - path: "$.license"
      widget: "select"
      label: "License"
      options:
        - value: "CC0-1.0"
          label: "CC0 1.0 (Public Domain Dedication)"
        - value: "CC-BY-4.0"
          label: "CC BY 4.0 (Attribution)"
        - value: "CC-BY-SA-4.0"
          label: "CC BY-SA 4.0 (Attribution-ShareAlike)"
        - value: "CC-BY-NC-4.0"
          label: "CC BY-NC 4.0 (Attribution-NonCommercial)"
        - value: "CC-BY-NC-SA-4.0"
          label: "CC BY-NC-SA 4.0 (Attribution-NonCommercial-ShareAlike)"
        - value: "CC-BY-ND-4.0"
          label: "CC BY-ND 4.0 (Attribution-NoDerivatives)"
        - value: "CC-BY-NC-ND-4.0"
          label: "CC BY-NC-ND 4.0 (Attribution-NonCommercial-NoDerivatives)"
        - value: "proprietary"
          label: "All Rights Reserved (Proprietary)"
        - value: "internal-only"
          label: "Internal / Confidential"
    - path: "$.keywords"
      widget: "chips"
      label: "Keywords"
      props:
        sources: ["local", "ols"]
        ontologies: ["efo", "chebi", "go"]
        field: "keywords"
    # Hidden in the editor — auto-filled at export time (DOIs, accessions, etc.).
    - path: "$.relatedIdentifiers"
      widget: "array"
      label: "Related Identifiers"
      hidden: true
  - title: "Provenance"
    collapsible: true
    collapsed: true
    fields:
    - path: "$.createdAt"
      widget: "text"
      label: "Created"
      readonly: true
    - path: "$.createdBy"
      widget: "text"
      label: "Created By"
      readonly: true
    - path: "$.updatedAt"
      widget: "text"
      label: "Updated"
      readonly: true

list:
  columns:
  - path: "$.recordId"
    label: "ID"
    width: "120px"
  - path: "$.title"
    label: "Title"
  - path: "$.state"
    label: "State"
    width: "100px"
