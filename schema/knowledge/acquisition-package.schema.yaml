$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/acquisition-package.schema.yaml"
title: "Acquisition Package"
description: >
  A pointer to an instrument .D acquisition directory that lives on an EXTERNAL
  storage device (a read-only local-mount NAS), NEVER in git. The record declares
  the file ROLES (signal_channel / sample_metadata / run_log / method_asset /
  uninterpreted) over per-file data-reference records — the DREFs remain the
  integrity anchors (their schema-required contentHash/sizeBytes live on the
  data-reference, not here) — plus the directory identity and a manifest-level
  signal-collection data-reference (signalCollectionRef). This is the
  data-plane/control-plane boundary extended to a whole .D: git holds the
  pointer + roles + per-file hashes; the device holds the bytes. The kind name
  `acquisition-package` is pinned by GC-3's instrument-sequence-entry
  acquisitionPackageRef (type: const); GC-4 lands the resolvable target.

type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"

required:
- kind
- id
- title
- storageDeviceId
- directoryKey
- files
- signalCollectionRef

properties:
  kind:
    const: "acquisition-package"

  id:
    type: string
    pattern: "^ACQP-[A-Za-z0-9][A-Za-z0-9_-]*$"
    description: "Stable local identifier (e.g., ACQP-2026-RES35077-4)."

  title:
    type: string
    description: "Human-readable name for this acquisition package."

  # ---------------------------------------------------------------------------
  # Device + directory identity. storageDeviceId is the CONFIG device id
  # (config.storageDevices[].id, e.g. gc-fid-nas) — NEVER a mount path.
  # directoryKey is a SAFE RELATIVE key of the .D DIRECTORY relative to the
  # device root (e.g. machine1/RES35077-4.D). It is a DIRECTORY key, not a
  # single-file path: no single-file data-reference ever points at it directly;
  # the single-file hash contract is honored by pinning its FILES (files[]).
  # ---------------------------------------------------------------------------
  storageDeviceId:
    type: string
    description: "Id of the storage device (config.storageDevices[].id) this package lives on — the config id, never a mount path."

  directoryKey:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._ -]*(/[A-Za-z0-9][A-Za-z0-9._ -]*)*$"
    description: >
      Safe RELATIVE key of the .D DIRECTORY relative to the device root (no
      leading /, no . or .. segments, no backslashes). A segment must start with
      an alphanumeric (so no dot-leading . or .. segment is legal) while still
      allowing dots WITHIN a name (e.g. RES35077-4.D). This is a DIRECTORY key:
      the single-file hash contract is honored by pinning the package's FILES,
      so no single-file data-reference points at this key directly.

  # ---------------------------------------------------------------------------
  # File-role declarations over per-file data-references (D1/D4). Each item
  # maps a role to a file data-reference (the integrity anchor) plus the file's
  # path relative to the package root. `uninterpreted` pins unknown files with
  # no semantics claimed (GC-1(e): preserve bytes, don't parse) — nothing is
  # ever silently skipped. Role discovery is NOT automatic: the caller supplies
  # the role map (or the service's exported default map, D10).
  # ---------------------------------------------------------------------------
  files:
    type: array
    minItems: 1
    description: >
      One item per pinned file in the .D: its role, the per-file data-reference
      (the integrity anchor), and its path relative to the package root.
      minItems 1 — an empty package is structurally illegal (lint R1 flags it).
    items:
      type: object
      unevaluatedProperties: false
      required: [ relativePath, dataReferenceRef, role ]
      properties:
        relativePath:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._ -]*(/[A-Za-z0-9][A-Za-z0-9._ -]*)*$"
          description: "Path of the file relative to the package root (the device key minus the directoryKey prefix); safe relative, no . or .. segments."
        dataReferenceRef:
          allOf:
          - $ref: "./datatypes/ref.schema.yaml"
          - type: object
            properties:
              kind: { const: record }
              type: { const: data-reference }
          description: "The per-file data-reference record that is the integrity anchor for this file (its contentHash/sizeBytes). Shape-pinned to type: data-reference."
        role:
          type: string
          enum: [ signal_channel, sample_metadata, run_log, method_asset, uninterpreted ]
          description: >
            The file's role in the .D. signal_channel = an .CH signal file
            (0..n are legal; a registrable package needs >= 1, enforced in the
            service, D9); method_asset = a method-dir member (ACQ.M/DA.M,
            singular per D10); uninterpreted = pinned with no semantics claimed
            (GC-1(e)).
      # The ref host's optional revisionRef/label keys are allowed by the
      # datatype; unevaluatedProperties:false here covers the three declared
      # properties (relativePath/dataReferenceRef/role) on the item.

  # ---------------------------------------------------------------------------
  # The manifest-level signal-collection data-reference (D5). At registration
  # the service mints ONE extra data-reference (dataKind: signal-collection)
  # whose contentHash is the sha256 of a CANONICAL per-file manifest string
  # (files sorted by relativePath, each contributing
  # `${relativePath}\n${file.contentHash}\n${file.sizeBytes}\n`) — a Merkle-style
  # pin of the whole .D computed WITHOUT zipping/copying anything. THIS is the
  # ref. It is NOT a hash of the directory listing (createReadStream on a
  # directory would EISDIR — which is exactly why the per-file hashes carry the
  # single-file integrity contract).
  # ---------------------------------------------------------------------------
  signalCollectionRef:
    allOf:
    - $ref: "./datatypes/ref.schema.yaml"
    - type: object
      properties:
        kind: { const: record }
        type: { const: data-reference }
    description: >
      The manifest-level signal-collection data-reference (dataKind
      signal-collection) that pins the whole package. Its contentHash is the
      sha256 of the canonical per-file manifest string (files sorted by
      relativePath), not a hash of the directory.

  # Optional links (D3): resolvable once the package is attached to a run
  # context; optional so a package can be registered standalone.
  sourceRunRef:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Optional record ref to the instrument-sequence-entry (run) this package was acquired for."
  sampleRef:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Optional record ref to the sample (plain record ref — no CHEBI minting; compound/sample identity lives on gc-method / instrument-sequence-entry)."

  registeredAt:
    type: string
    format: date-time
    description: "ISO timestamp of when this package was registered."

  # Registry-kind lifecycle (registry-ops, same treatment as gc-method /
  # instrument-sequence — GC-3 orchestrator resolution 1). The vocabulary is
  # the registry-ops lifecycle's own.
  lifecycleId:
    type: string
    enum: [ registry-ops ]
    description: "Lifecycle governing this record's state transitions (declared per kind in schema/registry/registry-kinds.registry.yaml)."

  state:
    type: string
    enum: [ draft, active, archived ]
    description: "Lifecycle state (operational). DISTINCT from domain status/result fields."

  # ---------------------------------------------------------------------------
  # FAME-1 — the acquisition status, classified at registration from the
  # RUN.LOG member (strict UTF-16) + the declared package-member signals.
  # This is DOMAIN status (how the acquisition ended), deliberately named
  # acquisitionStatus and DISTINCT from the lifecycle `state` above (bait #3:
  # `state` is lifecycle; never reuse it). All four words are FIXED by the
  # item; completed/aborted already exist as enum values on OTHER kinds
  # (instrument-log / run) — the SAME words, not new vocab. The
  # interpretation (which log lines mean which status) lives ONLY in
  # config/gc-acquisition-status/log-patterns.yaml (DATA); the code only
  # decodes + matches + records. ABSENT is legal (a package registered before
  # FAME-1, or whose run_log member could not be read — the floor is honest
  # unknown, recorded as DATA via acquisitionStatusEvidence, never a coded
  # completed default).
  # ---------------------------------------------------------------------------
  acquisitionStatus:
    type: string
    enum: [ completed, aborted, stopped-by-user, unknown ]
    description: >
      How the acquisition ended, classified at registration from the RUN.LOG
      member (strict UTF-16) using the declared rule file. completed = the log
      carries an explicit method-completed line; aborted = an abort /
      method-aborted / instrument-error-stopped line; stopped-by-user = the
      operator stopped the sequence; unknown = no run_log member, an
      unreadable/undecodable log, or zero rule hits (the DECLARED floor —
      never completed). Absent on packages registered before FAME-1.

  # FAME-1 (D3): the DECLARED run-sheet qualification for acquisitionStatus —
  # the rule file's `statusQualification` lookup stamped at registration
  # (DATA, not code). The run-sheet chrome renders THIS flag to decide whether
  # the status word is visibly qualified (a non-collapsing warning line) or a
  # quiet word — it NEVER branches on the status literal in TSX. true for the
  # non-completed statuses (aborted / stopped-by-user / unknown), false for
  # completed (declared in log-patterns.yaml). Absent on packages registered
  # before FAME-1 (or the degenerate rule-file-missing arm, which cannot read
  # the declared qualification).
  acquisitionStatusQualified:
    type: boolean
    description: >
      Whether this acquisitionStatus renders VISIBLY QUALIFIED on the run
      sheet (the declared statusQualification from
      config/gc-acquisition-status/log-patterns.yaml). DATA: the run-sheet
      chrome renders this, never a hardcoded status-literal branch.

  # The evidence that produced acquisitionStatus — the interpretation source
  # and every matched line, preserved VERBATIM (the d_reader lossless
  # doctrine: matched lines are never rewritten nor dropped). This is the
  # surface a human reads INSTEAD of a byte-serving route (OQ-1): the
  # verbatim matched lines + the /record/<RUN.LOG DREF> anchor let a reviewer
  # see WHY without a raw-blob route.
  acquisitionStatusEvidence:
    type: object
    unevaluatedProperties: false
    required: [ ruleset, sourceMember, decode ]
    properties:
      # FAME-1 (D5): the ruleset is ABSENCE-SHAPED in the degenerate
      # rule-file-missing arm — when the rule file itself is unread there is
      # no declared interpretation source to name, so the arm reports an
      # EMPTY ruleset (no id / version / sourceFile restated from the YAML)
      # rather than a coded copy of the file's identity. The readable-file
      # arms carry the full id / version / sourceFile. All three are therefore
      # OPTIONAL (the lint belt R5/R6 is the honesty check, not the schema).
      ruleset:
        type: object
        unevaluatedProperties: false
        properties:
          id:
            type: string
            minLength: 1
            description: "The rule-set id declared in log-patterns.yaml (the interpretation source). ABSENT in the degenerate rule-file-missing arm."
          version:
            type: [ string, number ]
            description: "The rule-set version declared in log-patterns.yaml. ABSENT in the degenerate rule-file-missing arm."
          sourceFile:
            type: string
            minLength: 1
            description: "The rule file the rules came from (config/gc-acquisition-status/log-patterns.yaml). ABSENT in the degenerate rule-file-missing arm."
      sourceMember:
        type: object
        unevaluatedProperties: false
        required: [ relativePath ]
        properties:
          relativePath:
            type: string
            pattern: "^(|([A-Za-z0-9][A-Za-z0-9._ -]*)(/[A-Za-z0-9][A-Za-z0-9._ -]*)*)$"
            description: >-
              Which package member was read (the run_log member, e.g. RUN.LOG),
              relative to the package root. EMPTY when no run_log member existed
              in the package (the honest floor arm: run-log-member-absent) —
              the decode facts on that arm still name the encoding 'none'.
      decode:
        type: object
        unevaluatedProperties: false
        required: [ encoding, bomPresent ]
        properties:
          encoding:
            type: string
            minLength: 1
            description: "The strict-UTF-16 decode that produced the text (e.g. utf-16le), recorded even on decode failure (facts preserved, bait #7)."
          bomPresent:
            type: boolean
            description: "Whether the member carried the FF FE BOM (true -> the utf-16 family consumes it; false -> explicit utf-16-le)."
      matched:
        type: array
        description: "Every RUN.LOG line a declared rule matched — preserved VERBATIM, never dropped (d_reader lossless doctrine)."
        items:
          type: object
          unevaluatedProperties: false
          required: [ line, ruleId, lineIndex ]
          properties:
            line:
              type: string
              description: "The matched line VERBATIM (the exact decoded line, no trimming/rewriting)."
            ruleId:
              type: string
              pattern: "^[a-z][a-z0-9-]*$"
              description: "The declared rule id that matched (the rule file's vocabulary; pattern-enforced here and re-checked by the lint belt)."
            lineIndex:
              type: integer
              minimum: 0
              description: "The 0-based index of the line within the decoded text."
      noEvidenceReason:
        type: string
        minLength: 1
        description: "Named ONLY when matched is empty: why no line matched (e.g. no run_log member / log not decodable / zero rule hits). The honest no-evidence arm."
