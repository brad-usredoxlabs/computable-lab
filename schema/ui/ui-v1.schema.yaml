# UI Specification Schema v1.0
# Defines the structure for UI hints in computable-lab

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/ui/ui-v1.schema.yaml"
title: "UI Specification v1"
description: "Schema for *.ui.yaml files - portable rendering hints"
type: "object"

required:
- uiVersion
- schemaId

properties:
  # Version specification
  uiVersion:
    type: "integer"
    enum: [ 1 ]
    description: "UI specification version"

  # Associated schema
  schemaId:
    type: "string"
    format: "uri"
    description: "Schema this UI spec applies to"

  # Display settings for the record type
  display:
    type: "object"
    description: "Display settings for record summaries"
    properties:
      titleField:
        type: "string"
        description: "JSONPath to field used as display title"
      subtitleField:
        type: "string"
        description: "JSONPath to field used as subtitle"
      icon:
        type: "string"
        description: "Icon identifier for this record type"
      color:
        type: "string"
        description: "Color theme for this record type"

  # Form configuration
  form:
    type: "object"
    description: "Form rendering configuration"
    properties:
      layout:
        type: "string"
        enum: [ "vertical", "horizontal", "sections", "tabs" ]
        default: "vertical"
        description: "Overall form layout"

      sections:
        type: "array"
        description: "Form sections"
        items:
          $ref: "#/definitions/section"

  # List view configuration
  list:
    type: "object"
    description: "List view configuration"
    properties:
      columns:
        type: "array"
        description: "Columns to display in list view"
        items:
          $ref: "#/definitions/column"

      defaultSort:
        type: "object"
        properties:
          field:
            type: "string"
          direction:
            type: "string"
            enum: [ "asc", "desc" ]

  # Detail view configuration
  detail:
    type: "object"
    description: "Detail view configuration"
    properties:
      sections:
        type: "array"
        description: "Sections to display in detail view"
        items:
          $ref: "#/definitions/section"

  # Document-style editor configuration (primary TapTab surface)
  editor:
    type: "object"
    description: >-
      Document-style editor contract. Blocks are the ordered document
      structure; slots are the editable fields. Binding is declarative:
      a block that declares `slots` claims exactly those slot ids, in list
      order (loader-validated: no unknown refs, no double claims, no
      unclaimed slots in an explicitly-bound spec). Blocks without `slots`
      bind by path prefix (slot.path starts with block.path).
    required:
    - mode
    - blocks
    - slots
    additionalProperties: false
    properties:
      mode:
        type: "string"
        const: "document"
        description: "Editor mode — 'document' for document-style layout"
      blocks:
        type: "array"
        description: "Ordered blocks in the document"
        items:
          $ref: "#/definitions/editorBlock"
      slots:
        type: "array"
        description: "Editable slots that blocks claim"
        items:
          $ref: "#/definitions/editorSlot"

definitions:
  # Section definition
  section:
    type: "object"
    required:
    - fields
    properties:
      title:
        type: "string"
        description: "Section title"
      description:
        type: "string"
        description: "Section description"
      collapsible:
        type: "boolean"
        default: false
        description: "Whether section can be collapsed"
      collapsed:
        type: "boolean"
        default: false
        description: "Whether section starts collapsed"
      fields:
        type: "array"
        description: "Fields in this section"
        items:
          $ref: "#/definitions/field"

  # Field definition
  field:
    type: "object"
    required:
    - path
    properties:
      path:
        type: "string"
        description: "JSONPath to the field in the record"
      label:
        type: "string"
        description: "Display label (defaults to field name)"
      widget:
        type: "string"
        enum:
        - "text"
        - "textarea"
        - "number"
        - "select"
        - "multiselect"
        - "checkbox"
        - "date"
        - "datetime"
        - "ref"
        - "array"
        - "object"
        - "markdown"
        - "code"
        - "hidden"
        - "combobox"
        default: "text"
        description: "Widget type for rendering"
      required:
        type: "boolean"
        default: false
        description: "Whether field is required (visual hint only)"
      readonly:
        type: "boolean"
        default: false
        description: "Whether field is read-only"
      hidden:
        type: "boolean"
        default: false
        description: "Whether field is hidden"
      placeholder:
        type: "string"
        description: "Placeholder text"
      helpText:
        type: "string"
        description: "Help text shown below field"
      width:
        type: "string"
        enum: [ "full", "half", "third", "quarter" ]
        default: "full"
        description: "Field width in form layout"

      # Widget-specific options
      props:
        type: "object"
        description: "Semantic field behavior used by TapTab and suggestion widgets."
        additionalProperties: true
        properties:
          sources:
            type: "array"
            items:
              type: "string"
              enum: ["local", "ols", "vendor-search", "local-records"]
          ontologies:
            type: "array"
            items:
              type: "string"
          field:
            type: "string"
            enum: ["keywords", "tags"]
          ownedByApp:
            type: "boolean"
          valueShape:
            type: "string"
            enum: ["text", "ref", "record-ref", "ontology-ref", "material-ref"]
          ontologyBinding:
            type: "string"
            enum: ["allow-ontology", "local-material-required", "local-record-required"]
          lifecycleDefault:
            type: "string"

      options:
        type: "object"
        description: "Widget-specific options"
        properties:
          # For select/multiselect
          choices:
            type: "array"
            items:
              type: "object"
              properties:
                value:
                  description: "Option value"
                label:
                  type: "string"
                  description: "Display label"

          # For ref widget
          refSchema:
            type: "string"
            format: "uri"
            description: "Schema of referenced record type"

          # For array widget
          itemWidget:
            type: "string"
            description: "Widget for array items"
          minItems:
            type: "integer"
            description: "Minimum number of items"
          maxItems:
            type: "integer"
            description: "Maximum number of items"

          # For textarea/markdown
          rows:
            type: "integer"
            default: 3
            description: "Number of visible rows"

          # For code widget
          language:
            type: "string"
            description: "Code language for syntax highlighting"

  # Column definition for list views
  column:
    type: "object"
    required:
    - path
    properties:
      path:
        type: "string"
        description: "JSONPath to the field"
      label:
        type: "string"
        description: "Column header"
      width:
        type: "string"
        description: "Column width (e.g., '100px', '20%')"
      sortable:
        type: "boolean"
        default: true
        description: "Whether column is sortable"
      format:
        type: "string"
        enum: [ "text", "date", "number", "boolean", "ref" ]
        default: "text"
        description: "Display format"

  # Editor block definition (document-style editor)
  editorBlock:
    type: "object"
    required:
    - id
    - kind
    properties:
      id:
        type: "string"
        description: "Stable block identifier"
      kind:
        type: "string"
        enum: [ "section", "paragraph", "repeater", "table" ]
        description: "Block kind"
      label:
        type: "string"
        description: "Display label"
      help:
        type: "string"
        description: "Help text / description"
      collapsible:
        type: "boolean"
        default: false
        description: "Whether the block is collapsible"
      collapsed:
        type: "boolean"
        default: false
        description: "Whether the block starts collapsed"
      path:
        type: "string"
        description: >-
          For repeater/table: the path to the array field. Blocks without
          `slots` bind slots whose path starts with this prefix.
      columns:
        type: "array"
        description: "For table: column definitions"
        items:
          type: "object"
          required:
          - path
          - label
          properties:
            path:
              type: "string"
              description: "Path to the field"
            label:
              type: "string"
              description: "Column header label"
            width:
              type: ["string", "number"]
              description: "Column width"
            widget:
              type: "string"
              description: "Widget type for editing"
      slots:
        type: "array"
        description: >-
          Explicit slot-id claims (section/paragraph style). The block is
          projected with exactly these slot ids, IN THIS LIST ORDER; claimed
          ids must exist in `editor.slots`, may not be claimed by another
          block, and in a spec with >=1 explicit binding every slot must be
          claimed (explicitly or via prefix fallback) — enforced by
          UISpecLoader.validateSpec.
        items:
          type: "string"
      visible:
        type: "object"
        description: "Visibility condition"
        properties:
          when:
            type: "string"
            description: "Path to the controlling field"
          operator:
            type: "string"
            enum: [ "equals", "notEquals", "in", "notIn", "exists", "notExists" ]
          value:
            description: "Value to compare against (for equals/notEquals/in/notIn)"

  # Editor slot definition (document-style editor)
  editorSlot:
    type: "object"
    required:
    - id
    - path
    - label
    - widget
    properties:
      id:
        type: "string"
        description: "Stable slot identifier (referenced by block.slots)"
      path:
        type: "string"
        description: "JSONPath to the field in the payload"
      label:
        type: "string"
        description: "Display label"
      widget:
        type: "string"
        description: >-
          Widget type to render. The canonical widget set lives in
          UISpecLoader.VALID_WIDGET_TYPES (loader-enforced membership); the
          schema intentionally keeps this an open string to avoid drift.
      help:
        type: "string"
        description: "Help text / description"
      required:
        type: "boolean"
        default: false
        description: "Whether the slot is required"
      suggestionProviders:
        type: "array"
        description: "Suggestion providers available for this slot"
        items:
          type: "string"
          enum: [ "local-records", "local-vocab", "ontology", "vendor-search", "compiler" ]
      visible:
        type: "object"
        description: "Visibility condition"
        properties:
          when:
            type: "string"
            description: "Path to the controlling field"
          operator:
            type: "string"
            enum: [ "equals", "notEquals", "in", "notIn", "exists", "notExists" ]
          value:
            description: "Value to compare against (for equals/notEquals/in/notIn)"
      options:
        type: "array"
        description: "Options for select/radio/multiselect"
        items:
          type: "object"
          required:
          - value
          - label
          properties:
            value:
              type: ["string", "number", "boolean"]
              description: "Value to store"
            label:
              type: "string"
              description: "Display label"
            description:
              type: "string"
              description: "Optional description"
            disabled:
              type: "boolean"
              description: "Whether the option is disabled"
      refKind:
        type: "string"
        description: "For ref widgets: the target record kind"
      items:
        type: "object"
        description: >-
          For array widgets: item field-hint configuration (path/widget plus
          the standard FieldHint shape).
      fields:
        type: "array"
        description: "For object widgets: nested field hints"
        items:
          type: "object"
      props:
        type: "object"
        description: "Additional widget-specific props (sources, ontologies, field, etc.)"
        additionalProperties: true

additionalProperties: false

# Example
examples:
- title: "Basic UI Spec"
  value:
    uiVersion: 1
    schemaId: "https://computable-lab.com/schema/studies/study.schema.yaml"
    display:
      titleField: "$.title"
      subtitleField: "$.shortSlug"
      icon: "study"
    form:
      layout: "sections"
      sections:
      - title: "Basic Information"
        fields:
        - path: "$.recordId"
          widget: "text"
          readonly: true
        - path: "$.title"
          widget: "text"
          required: true
        - path: "$.description"
          widget: "markdown"
