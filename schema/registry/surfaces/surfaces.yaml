version: 1
title: "Work-Surface Registry"
description: >
  Declarative registration of every navigable work surface in computable-lab.
  Surfaces are DECLARED, not hardcoded: each registration describes the path,
  the object types the surface scopes to, which sub-object kinds are selectable
  for an AI action, and the surface's AI role. plan/design/execute are MODES of
  ONE run surface (one tab per run — locked decision #3) sharing surface id
  `run-plan|run-design|run-execute`.

  # A surface is DEEP-LINKABLE iff it declares `params`: each `:token` in `path`
  # bound to the active objectType that fills it. Surfaces without `params`
  # (find, analysis, knowledge) are AI-CONTEXT surfaces reached through their
  # collection routes — they are not routable on their own. `path` is a route
  # pattern relative to the app router (app/src/App.tsx), and the run surfaces
  # share ONE route: plan/design/execute/results are MODES of one run tab.

surfaces:
  - id: find
    label: "Find / Search"
    path: "/find"
    objectTypes: [project, run, well, collection]
    selectableKinds: [well, cell, event, material]
    aiRole: "search selection → AI context"
  - id: run-plan
    label: "Run · Plan"
    path: "/runs/:runId"
    params:
      runId: run
    objectTypes: [run]
    selectableKinds: [event, well, material, protocol-step]
    aiRole: "protocol localization & planning"
  - id: run-design
    label: "Run · Design"
    path: "/runs/:runId"
    params:
      runId: run
    objectTypes: [run]
    selectableKinds: [event, well, material]
    aiRole: "event-graph editing"
  - id: run-execute
    label: "Run · Execute"
    path: "/runs/:runId"
    params:
      runId: run
    objectTypes: [run]
    selectableKinds: [event, well, material]
    aiRole: "batch execution"
  - id: results
    label: "Results"
    path: "/runs/:runId"
    params:
      runId: run
    objectTypes: [run]
    selectableKinds: [well, measurement, event]
    aiRole: "readouts & results"
  - id: analysis
    label: "Analysis"
    path: "/analysis"
    objectTypes: [project, run, collection]
    selectableKinds: [well, cell, event, material]
    aiRole: "interrogative goals answered in place"
  - id: knowledge
    label: "Knowledge"
    path: "/knowledge"
    objectTypes: [claim, protocol, material, document]
    selectableKinds: [document, protocol, material]
    aiRole: "literature & knowledge base"
  - id: project
    label: "Project"
    path: "/project/:studyId"
    params:
      studyId: project
    objectTypes: [project]
    selectableKinds: []
    aiRole: "project home"
  - id: ingestion
    label: "Ingestion · Vendor PDFs"
    path: "/ingestion"
    objectTypes: [document]
    selectableKinds: [material, labware]
    aiRole: "source documents and extraction jobs"
  - id: protocol-review
    label: "Protocol review"
    path: "/ingestion/vendor-pdf/:recordId"
    params:
      recordId: document
    objectTypes: [document]
    selectableKinds: [material, labware, protocol-step]
    aiRole: "extract a protocol from a source document"
