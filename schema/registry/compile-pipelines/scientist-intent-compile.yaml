pipelineId: scientist-intent-compile
entrypoint: scientist-intent-compile
description: >
  Compile a portable scientist-intent wire document into TerminalArtifacts
  (canonical events + gaps + deck + resources) by reusing the deterministic
  downstream of the chatbot pipeline. The `ai_precompile` output slot is seeded
  synthetically by the runner (from normalizeScientistIntent), then every
  downstream pass — protocol-intent state planning, validation, lowering,
  geometric-pattern expansion, biology-verb expansion, labware resolution,
  role resolution, volume computation, resources, deck layout, validation, and
  instrument run-file emission — runs unchanged against it.
passes:
  - id: ai_precompile
    family: parse
    description: Synthetic seeding slot populated by runScientistIntentCompile with normalizeScientistIntent output (protocolIntent + candidateEvents).

  # SPINE-4: the one noun-resolution door. Runs on the PARSED document +
  # normalized symbols (never expanded events), ahead of every noun-consuming
  # stage. Any argument still unresolved bars the compile: this pass fails,
  # and the runner's cascade barrier skips every consumer and graph stage
  # below them without invoking run().
  - id: resolve_nouns
    family: disambiguate
    depends_on: [ai_precompile]
    description: Resolve every declared noun argument through the SPINE-3 engine; authoritative bindings + structured clarifications; unresolved arguments bar compilation.

  - id: protocol_intent_state_plan
    family: expand
    depends_on: [ai_precompile]
    description: Fold protocolIntent into deterministic execution state.

  - id: validate_protocol_intent
    family: validate
    depends_on: [ai_precompile]
    description: Validate ProtocolIntent resources/operations/patterns ref integrity.

  - id: lower_protocol_intent
    family: expand
    depends_on: [protocol_intent_state_plan, validate_protocol_intent, resolve_nouns]
    description: Lower ProtocolIntent resources and simple operations into primitive events + candidate labware + directives.

  - id: expand_protocol_intent_patterns
    family: expand
    depends_on: [protocol_intent_state_plan, validate_protocol_intent, resolve_nouns]
    description: Expand geometric macros (serial_dilution, media_swap, repeat_rows) into primitive transfer/mix events.

  - id: expand_biology_verbs
    family: expand
    depends_on: [ai_precompile, resolve_nouns]
    description: Lower candidateEvents biology verbs (seed, incubate, read, wash, harvest, spin, ...) through the verb expander registry.

  - id: apply_directives
    family: expand
    depends_on: [lower_protocol_intent]
    description: Turn lower_protocol_intent.directives entries into DirectiveNode[] with generated directiveIds.

  - id: resolve_labware
    family: disambiguate
    depends_on: [lower_protocol_intent, resolve_nouns]
    description: Resolve symbolic labware hints to existing labware-instance records; emit additions for unmatched.

  - id: resolve_references
    family: disambiguate
    depends_on: [ai_precompile, resolve_nouns]
    description: Resolve named protocol/assay/pattern/compound-class references from registries.

  - id: resolve_roles
    family: expand
    depends_on: [expand_protocol_intent_patterns, expand_biology_verbs, lower_protocol_intent, resolve_nouns]
    description: Map role coordinates to concrete well addresses under current orientation.

  # WELLSET-RESOLVER-1 (architect ruling SUITEA-P7-mix-wellset-scope-l2t0635):
  # the server-side CONTENTS-DERIVED wellset resolver. Runs POST-expansion (the
  # resolve_roles precedent: address materialization on the event list). Reads
  # a declared kind:wellset token from the vocabulary (DATA membership — no
  # verb-name branch), resolves it to a concrete well set from the run's
  # contents ledger (the prior lab state PLUS the current document's own
  # events = the pending-draft layer), and writes the set + the labware binding
  # onto the matching post-expansion event, republishing the list to the
  # resolve_roles slot so lab_state and the assembly see the concrete wells.
  # Ambiguous contents (two or more labware carry materials) bars with ONE
  # clarification on the existing unresolved-fact envelope (never-guess).
  # FIX RUN 1 (advc D3): the declared deps COVER the slots the pass READS —
  # resolve_roles (the post-expansion event list it resolves + republishes),
  # resolve_nouns + resolve_labware (the identity slots the pending-draft
  # layer folds onto), ai_precompile via transitivity through the expansion
  # stages it already chained; and the consumers that READ the republished
  # resolve_roles slot (compute_volumes, lab_state, emit_instrument_run_files)
  # declare the resolve_wellsets edge so no Kahn tie-break/YAML-order
  # coincidence can ever hand them the un-resolved event list.
  - id: resolve_wellsets
    family: expand
    depends_on: [resolve_roles, resolve_nouns, resolve_labware]
    description: Resolve declared contents-derived wellset tokens to a concrete well set from the run's contents ledger (prior lab state + current-document pending events, folded onto the resolved identity space); never-guess clarification on an ambiguous two-plate set.

  - id: compute_volumes
    family: expand
    depends_on: [resolve_roles, resolve_wellsets]
    description: Resolve just_enough / percent / placeholder volumes to uL.

  - id: compute_resources
    family: emit
    depends_on: [compute_volumes]
    description: Emit resource manifest (tip racks, reservoir loads, consumables).

  - id: plan_deck_layout
    family: emit
    depends_on: [compute_resources]
    description: Full deck layout plan with pinned slots, auto-filled remainder, conflicts.

  # WELLSET-RESOLVER-1 FIX RUN 1 (advc D3): lab_state and
  # emit_instrument_run_files READ the resolve_roles slot's event list — they
  # declare the resolve_wellsets edge so the republished (concrete-wells) list
  # is GUARANTEED, not a Kahn tie-break coincidence.
  - id: lab_state
    family: emit
    depends_on: [resolve_roles, resolve_wellsets]
    description: Fold events over prior lab state and emit labStateDelta.

  - id: emit_instrument_run_files
    family: emit
    depends_on: [resolve_roles, resolve_wellsets]
    description: Generate InstrumentRunFile artifacts for read-event instrument groups.

  - id: validate
    family: validate
    depends_on: [plan_deck_layout]
    description: Aggregate findings from all registered validation checks.