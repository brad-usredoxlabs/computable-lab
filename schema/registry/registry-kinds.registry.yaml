# Registry-kind lifecycle coverage — which plain kinds get the minimal operational
# lifecycle and what creates are stamped with. Consumed by KindLifecycleRegistry.ts
# at create time and by the QMS7-4 migration runner. Governed kinds are NOT listed:
# their lifecycleId stays declared per-schema (const in *.schema.yaml).
registryVersion: 1
lifecycleId: registry-ops
defaultState: draft
kinds:
  - kind: person
  - kind: equipment
  - kind: equipment-class
  - kind: training-record
  - kind: competency-authorization
  - kind: instrument
  - kind: calibration-record

# Data-driven archive guard (QMS7-4, ruling B): a NEW ref assignment to a
# covered record in a terminal lifecycle state is refused at create, and on
# update when the ref newly CHANGES to one. Historical kinds are exempt —
# they are evidence, not operational assignments. Archived records stay
# readable and historically referenceable (usability-off, not erasure).
archiveGuard:
  exemptKinds: [audit-event, signature, record-revision]

# QMS7-4 OQ2 (ruled): the migration runner's domain-status -> lifecycle-state
# mapping is DATA. A covered record whose domain status is named here lands
# the mapped state; anything else (status-less or unmapped status) lands the
# declared default. The runner never guesses per-kind in TS.
migration:
  stateByDomainStatus:
    active: active
  default: draft

# QMS8-C (A1-3): lifecycle-scoped migration instructions. The `migration:`
# block above can only speak for kinds this file LISTS; lifecycle-GOVERNED kinds
# (material / material-spec / term declare their lifecycleId per-schema and are
# deliberately NOT listed in `kinds:`) need their own declared instruction.
# Keyed by LIFECYCLE — this file names no kind here, and the runner holds no
# kind literal. `stampStateFromDomainStatus: true` means: for a record that
# declares this lifecycle, carries a domain status and carries NO lifecycle
# state, stamp state := status. The stamp is legal because the schema's status
# enum and the lifecycle's declared states are the SAME vocabulary (see
# schema/lab/material.schema.yaml); an unmapped status is reported, never
# guessed. This is the sibling leg that closes the fail-open window created by
# retiring the middleware's `state ?? status` read (BRAD-A1: the fallback is
# gone, so a governed record without a state has nothing for the gate to read).
lifecycleMigrations:
- lifecycleId: lab-vocabulary-control
  stampStateFromDomainStatus: true
