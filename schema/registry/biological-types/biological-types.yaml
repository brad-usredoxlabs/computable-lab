version: 1
title: "Biological Types & Culture Systems Registry"
description: >
  Declarative measure table for biological materials (phase B). Given a coarse
  material.domain (cell_line | organism → "biological" vs chemical/volume-first),
  and the resolved specific organism/type term, this registry decides WHICH
  invariant the form records (cells/well, worms/well, CFU/mL, OD600, ...) and
  what fields to ask. An unknown biological type falls back to `default`
  (generic count + final volume). Data, not code — the loader (and only the
  loader) interprets it; no hardcoded TS rules.

default:
  label: "Biological material (generic)"
  measures:
    primary: count
    units: [count-per-well]
    concentrationBasis: count_per_volume
  verification:
    method: manual
    readModality: microscopy
  fields:
    - key: count
      label: "Count per well"
      required: true
    - key: volume
      label: "Final volume (µL)"
      required: true
    - key: counterDensity
      label: "Source density (per µL)"
      required: false

types:
  cell-line:
    label: "Cell Line"
    domains: [cell_line]
    termKinds: [organism]
    match:
      labels: [HepaRG, "HepaRG cell", "HepaRG cell line"]
      curies: [CLO:0020273]
    measures:
      primary: count
      units: [cells-per-well]
      concentrationBasis: count_per_volume
    verification:
      method: hoechst_nuclei
      readModality: microscopy
    fields:
      - key: count
        label: "Cells per well"
        required: true
      - key: volume
        label: "Final volume (µL)"
        required: true
      - key: counterDensity
        label: "Counter density (cells/µL)"
        required: false

  c-elegans:
    label: "C. elegans"
    domains: [organism]
    termKinds: [organism]
    match:
      labels: ["C. elegans", "Caenorhabditis elegans", "C elegans"]
      curies: [NCBITaxon:6239]
    measures:
      primary: count
      units: [worms-per-well]
      concentrationBasis: count_per_volume
    verification:
      method: manual
      readModality: microscopy
    fields:
      - key: count
        label: "Worms per well (L4)"
        required: true
      - key: volume
        label: "Final volume (µL)"
        required: true
      - key: counterDensity
        label: "Worm density (worms/µL)"
        required: false

  yeast:
    label: "Yeast (S. cerevisiae)"
    domains: [organism]
    termKinds: [organism]
    match:
      labels: ["yeast", "Saccharomyces cerevisiae", "S. cerevisiae", "baker's yeast"]
      curies: [NCBITaxon:4932]
    measures:
      primary: count
      alternative: [od600, cfu]
      units: [cells-per-ml, od600, cfu-per-ml]
      concentrationBasis: count_per_volume
    verification:
      method: od600
      readModality: absorbance
    fields:
      - key: count
        label: "Cells/mL"
        required: false
      - key: od600
        label: "OD600"
        required: false
      - key: cfu
        label: "CFU/mL"
        required: false
      - key: volume
        label: "Volume (µL)"
        required: true

  e-coli:
    label: "E. coli"
    domains: [organism]
    termKinds: [organism]
    match:
      labels: ["E. coli", "Escherichia coli", "E coli"]
      curies: [NCBITaxon:562]
    measures:
      primary: cfu
      alternative: [od600, count]
      units: [cfu-per-ml, od600, cells-per-ml]
      concentrationBasis: count_per_volume
    verification:
      method: cfu
      readModality: absorbance
    fields:
      - key: cfu
        label: "CFU/mL"
        required: false
      - key: od600
        label: "OD600"
        required: false
      - key: count
        label: "Cells/mL"
        required: false
      - key: volume
        label: "Volume (µL)"
        required: true

  mouse:
    label: "Mouse"
    domains: [organism]
    termKinds: [organism]
    match:
      labels: ["Mus musculus", "mouse", "house mouse", "C57BL/6J", "BALB/c", "NOD"]
      curies: [NCBITaxon:10090]
    measures:
      primary: count
      units: [organisms-per-well]
      concentrationBasis: count_per_volume
    verification:
      method: manual
      readModality: microscopy
    fields:
      - key: count
        label: "Organisms / cells per well"
        required: true
      - key: volume
        label: "Final volume (µL)"
        required: true
      - key: counterDensity
        label: "Source density (per µL)"
        required: false

  organoid:
    label: "Organoid"
    domains: [organism]
    termKinds: [organism]
    match:
      labels: ["organoid", "intestinal organoid", "cerebral organoid"]
    measures:
      primary: count
      units: [organoids-per-well]
      concentrationBasis: count_per_volume
    verification:
      method: manual
      readModality: microscopy
    fields:
      - key: count
        label: "Organoids per well"
        required: true
      - key: volume
        label: "Final volume (µL)"
        required: true
      - key: counterDensity
        label: "Source density (per µL)"
        required: false

# ---------------------------------------------------------------------------
# Identity vocabulary — the lab's organism / strain / culture-condition terms.
# Here as DATA so the identity spine seeding AND the add-material form's
# condition multiselect both read the SAME declared vocabulary (no TS arrays).
# Each entry materializes as a canonical `term` record (kind organism|condition)
# with a deterministic TERM-<slug>-<hash> id (localTermIdForLabel).
# ---------------------------------------------------------------------------
organisms:
  - label: "Caenorhabditis elegans"
    aliases: ["C. elegans", "C elegans"]
    curie: NCBITaxon:6239
  - label: "Mus musculus"
    aliases: ["mouse", "house mouse"]
    curie: NCBITaxon:10090
  - label: "Saccharomyces cerevisiae"
    aliases: ["yeast", "S. cerevisiae", "baker's yeast"]
    curie: NCBITaxon:4932
  - label: "Escherichia coli"
    aliases: ["E. coli", "E coli"]
    curie: NCBITaxon:562
  # Cell lines are organisms too (domain: cell_line), so the biological gate
  # and the cell-line measure rule both match.
  - label: "HepaRG"
    aliases: ["HepaRG cell", "HepaRG cells"]
    curie: CLO:0020273
    domain: cell_line

strains:
  - label: "C. elegans N2"
    strain: "N2"
    species: "Caenorhabditis elegans"
    aliases: ["N2", "wild-type N2"]
  - label: "C57BL/6J"
    strain: "C57BL/6J"
    species: "Mus musculus"
    aliases: ["C57BL/6J mouse", "B6"]
  - label: "BALB/c"
    strain: "BALB/c"
    species: "Mus musculus"
    aliases: ["BALB/c mouse"]
  - label: "NOD"
    strain: "NOD"
    species: "Mus musculus"
    aliases: ["NOD mouse", "NOD/ShiLtJ"]
  - label: "E. coli K-12"
    strain: "K-12"
    species: "Escherichia coli"
    aliases: ["K-12", "E. coli K12"]
  - label: "E. coli BL21"
    strain: "BL21"
    species: "Escherichia coli"
    aliases: ["BL21", "BL21(DE3)"]

conditions:
  - label: "anoxic"
    aliases: ["anoxia", "anaerobic"]
  - label: "hypoxic"
    aliases: ["hypoxia", "low-oxygen"]
  - label: "hyperoxic"
    aliases: ["hyperoxia", "high-oxygen"]
  - label: "tissue-culture-in-a-tube"
    aliases: ["tube culture", "TC in a tube"]
  - label: "organ-on-a-chip"
    aliases: ["OoC", "organ chip", "microfluidic tissue culture"]
  - label: "2D-plate"
    aliases: ["2D culture", "monolayer plate", "standard culture"]
  - label: "spheroid"
    aliases: ["3D spheroid", "spheroid culture"]
  - label: "low-saline"
    aliases: ["hypotonic", "low salt"]
  - label: "high-saline"
    aliases: ["hypertonic", "high salt"]
  - label: "low-temp"
    aliases: ["cold", "refrigerated culture"]
  - label: "high-temp"
    aliases: ["heat stress", "elevated temperature"]
  - label: "high-microplastics"
    aliases: ["microplastic exposure", "microplastics stressor"]