# UI specification for LocalProtocol records
#
# Layout mirrors a real lab protocol document: the plate-setting sections
# (Labwares / Equipment / Materials — the biologist-facing "bindings") come
# FIRST, above the inherited steps, so a user reading a step can pop back up
# to what the assay needs. Each setup section uses the slash-menu combobox
# (local-first → ontology → create-new): /l, /e, /m.
uiVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/local-protocol.schema.yaml"

display:
  titleField: "$.title"
  icon: "protocol"

taptab:
  style: "prose"

form:
  layout: "sections"
  sections:
  - title: "Labwares"
    fields:
    - path: "$.labwares"
      widget: "local-protocol-labwares"
      label: "Labwares / consumables this assay needs"
  - title: "Equipment"
    fields:
    - path: "$.equipment"
      widget: "local-protocol-equipment"
      label: "Equipment / instruments this assay needs"
  - title: "Materials"
    fields:
    - path: "$.materials"
      widget: "local-protocol-materials"
      label: "Materials / reagents this assay needs"
  - title: "Steps"
    fields:
    - path: "$.inherits_from.id"
      widget: "local-protocol-steps"
      label: "Inherited protocol steps"
  - title: "Identity"
    fields:
    - path: "$.title"
      widget: "text"
      label: "Title"
      required: true
    - path: "$.recordId"
      widget: "text"
      label: "Record ID"
      readonly: true
    - path: "$.kind"
      widget: "text"
      label: "Kind"
      readonly: true
      hidden: true
    - path: "$.inherits_from"
      widget: "text"
      label: "Inherits from (global protocol ref)"
      readonly: true
    - path: "$.status"
      widget: "select"
      label: "Status"
    - path: "$.overview"
      widget: "textarea"
      label: "Overview"
    - path: "$.purpose"
      widget: "textarea"
      label: "Purpose"
    - path: "$.notes"
      widget: "textarea"
      label: "Notes"
  # W2-4-PROVENANCE-LADDER (additive): LOCAL_REALIZATION badge hints (rung
  # vocabulary: schema/registry/provenance-ladder/rung-vocabulary.yaml). The
  # localization choices and substitution rationales ARE the lab's lineage —
  # badges are rendered from rung-vocabulary data by the W2-8 surface; W2-4
  # ships hints only. W2-7 WRITES these fields; W2-4 constrains their lineage
  # (prov-local-* rules).
  - title: "Localization (LOCAL_REALIZATION)"
    fields:
    - path: "$.branch_resolution"
      widget: "array"
      label: "Branch resolutions"
      readonly: true
    - path: "$.branch_resolution[*].choices"
      widget: "object"
      label: "LOCAL_REALIZATION — lab's answer"
      readonly: true
      helpText: "the localization choices that produced this resolution (prov-local-choices-recorded)"
    - path: "$.overrides.substitutions"
      widget: "array"
      label: "Material substitutions"
      readonly: true
    - path: "$.overrides.substitutions[*].rationale"
      widget: "textarea"
      label: "LOCAL_REALIZATION — why"
      readonly: true
      helpText: "the WHY of a lab substitution is its lineage (prov-local-substitution-rationale)"

list:
  columns:
  - path: "$.recordId"
    label: "ID"
    width: "120px"
  - path: "$.title"
    label: "Title"
  - path: "$.status"
    label: "Status"
    width: "80px"
