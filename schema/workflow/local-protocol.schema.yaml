$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/local-protocol.schema.yaml"
title: "LocalProtocol"
description: >
  Lab-layer realization of a global protocol. Makes lab-specific decisions
  (equipment bindings, parameter refinements, material substitutions, timing
  and tip policies) into a persistent, versionable, citable record.
  See compiler-specs/50-protocol-lifecycle.md §5.

type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"

required:
- kind
- recordId
- title
- inherits_from
- status

properties:
  protocolLayer:
    type: string
    const: "lab"

  kind:
    const: "local-protocol"

  recordId:
    type: string
    pattern: "^LPR-[A-Za-z0-9_-]+$"
    description: "Stable local identifier (e.g., LPR-ros-hepg2-spectramax-v1)."

  title:
    type: string

  overview:
    type: string
    description: "Optional human-readable overview of this lab-specific protocol realization."

  purpose:
    type: string
    description: "Optional statement of the experiment or lab purpose for this local protocol."

  # ── Plate-setting sections (biologist-facing "what this assay needs") ──
  # Concrete lab-layer setup, declared ABOVE the steps. Each row binds a
  # biologist-facing role to a concrete record or ontology term. `ref` is
  # optional so the AI can draft rows that the user then completes with the
  # local-first → ontology → create-new combobox.
  labwares:
    type: array
    description: "Labwares / consumables this assay needs (plate-setting section)."
    items:
      $ref: "#/$defs/SetupRow"
    uniqueItems: true

  equipment:
    type: array
    description: "Equipment / instruments this assay needs (plate-setting section)."
    items:
      $ref: "#/$defs/SetupRow"
    uniqueItems: true

  materials:
    type: array
    description: "Materials / reagents this assay needs (plate-setting section)."
    items:
      $ref: "#/$defs/SetupRow"
    uniqueItems: true

  inherits_from:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Required: the global protocol this realizes."

  variantRef:
    type: string
    description: >
      Optional: which conditional branch (a protocol `variants[].variantId`) of the
      inherited universal protocol this local protocol realizes (e.g. the
      'mammalian-cell-culture' branch). Preserves the matrix choice as first-class,
      alongside the substitutions that swap in this lab's reagents.

  # Resolved branch axes from condition-first localization (Decided). Each entry
  # records how one universal branch axis was resolved to the branch(es) whose
  # starting steps this local protocol realizes. Structured, multi-axis home;
  # `variantRef` (single string) stays as back-compat for single-axis protocols.
  branch_resolution:
    type: array
    description: "Resolved branch axes from localization (which branch of each universal branch_axes axis this LPR realizes)."
    items:
      type: object
      additionalProperties: false
      required: [ axisId, matched ]
      properties:
        axisId:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          description: "Matches a protocol branch_axes[].axisId."
        matched:
          type: boolean
          description: "Whether a branch condition matched the localization choices."
        branchIds:
          type: array
          items: { type: string }
          description: "Chosen branch ids (branch_axes[].conditions[].id / variants[].variantId) whose steps are included."
        choices:
          type: object
          additionalProperties: true
          description: "The localization choices that produced this resolution (provenance)."

  lab_state_refs:
    type: array
    description: "Environmental lab-state assumptions this local-protocol depends on (50 §10)."
    items:
      $ref: "./datatypes/ref.schema.yaml"
    uniqueItems: true

  links:
    type: object
    description: "Optional project filing links. A project-scoped local protocol is found by links.studyId, not by embedding it in a study record."
    additionalProperties: false
    properties:
      studyId:
        type: string
      experimentId:
        type: string
      runId:
        type: string

  overrides:
    type: object
    additionalProperties: false
    description: "Structured, additive overrides relative to the inherited global protocol."
    properties:
      bindings:
        type: array
        items:
          type: object
          additionalProperties: true
        description: "Concrete stocks/equipment that satisfy each abstract global role."
      parameters:
        type: array
        items:
          type: object
          additionalProperties: true
        description: "Parameter values resolved at the lab layer."
      substitutions:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [role, material_ref]
          properties:
            role:
              type: string
            material_ref:
              $ref: "./datatypes/ref.schema.yaml"
            rationale:
              type: string
      timing_policies:
        type: array
        items:
          type: object
          additionalProperties: true
      tip_policies:
        type: array
        items:
          type: object
          additionalProperties: true

  supersedes:
    $ref: "./datatypes/ref.schema.yaml"
    description: "Prior local-protocol this one replaces (append-only)."

  status:
    type: string
    enum: [draft, active, superseded, retracted]

  notes:
    type: string

  tags:
    type: array
    items: { type: string }
    uniqueItems: true

$defs:
  SetupRow:
    type: object
    additionalProperties: false
    required: [role]
    properties:
      role:
        type: string
        minLength: 1
        description: "Biologist-facing role name, e.g. 'Sample plate', 'Plate reader', 'Treatment medium'."
      description:
        type: string
        description: "Optional human note (concentration, lot, why this one)."
      ref:
        $ref: "./datatypes/ref.schema.yaml"
        description: "Concrete binding: a workspace record ref or an ontology ref. Absent = pending pick."
