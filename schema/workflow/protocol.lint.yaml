# Lint rules for Protocol records
lintVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/protocol.schema.yaml"

rules:
  # R1 — step→role closure: every role reference carried by a step must
  # resolve to a declared role of the matching category. Covers every
  # step-kind role-reference location in protocol.schema.yaml:
  #   steps[*].target.labwareRole  (StepAddMaterial/StepMix/StepWash/
  #                                 StepIncubate/StepRead, StepTransfer.target)
  #   steps[*].source.labwareRole  (StepTransfer.source, StepHarvest)
  #   steps[*].instrumentRole      (StepRead)
  # (MethodRequirement.instrumentRole is a $defs never referenced from
  # steps[] — no step path covers it and none is needed.)
  # Each category branch is `any[ not(nonEmpty refs), allIn(refs, declared) ]`:
  # no reference of that kind -> vacuous pass; references present -> every one
  # must resolve, and a missing/unresolvable declared collection fails loudly
  # (a step referencing roles with no roles block is an error).
  - id: step-role-closure
    title: "Every step role reference resolves to a declared role"
    description: >-
      Step labwareRole references (target and source) must name a declared
      roles.labwareRoles[*].roleId; step instrumentRole references must name
      a declared roles.instrumentRoles[*].roleId. Empty projections pass
      vacuously; an unresolvable collection fails loudly, so a protocol whose
      steps reference roles with no declared roles block is an error.
    severity: error
    scope: record
    assert:
      op: all
      predicates:
        - op: any
          predicates:
            - op: not
              not:
                op: nonEmpty
                path: steps[*].target.labwareRole
            - op: allIn
              path: steps[*].target.labwareRole
              collectionPath: roles.labwareRoles
              itemField: roleId
        - op: any
          predicates:
            - op: not
              not:
                op: nonEmpty
                path: steps[*].source.labwareRole
            - op: allIn
              path: steps[*].source.labwareRole
              collectionPath: roles.labwareRoles
              itemField: roleId
        - op: any
          predicates:
            - op: not
              not:
                op: nonEmpty
                path: steps[*].instrumentRole
            - op: allIn
              path: steps[*].instrumentRole
              collectionPath: roles.instrumentRoles
              itemField: roleId
    message:
      template: "Protocol '{{recordId}}': step role references must resolve to declared roles. step ids: {{steps[*].stepId}}; refs checked at steps[*].target.labwareRole={{steps[*].target.labwareRole}} and steps[*].source.labwareRole={{steps[*].source.labwareRole}} (must be declared in roles.labwareRoles[*].roleId={{roles.labwareRoles[*].roleId}}) and steps[*].instrumentRole={{steps[*].instrumentRole}} (must be declared in roles.instrumentRoles[*].roleId={{roles.instrumentRoles[*].roleId}})."

  # R2 — identity-bearing labware role: a LabwareRole without description OR
  # without expectedLabwareKinds is not yet identity-bearing (D2: identity-
  # bearing declared roles are what let the rail show a run's bound instance).
  # Warning severity so legacy records stay writable. `when` skips the rule
  # entirely when there is no non-empty labwareRoles collection, so a
  # protocol with no roles block emits no noise (everyItem would otherwise
  # fail loudly on the unresolvable collectionPath).
  - id: labware-role-identity-bearing
    title: "Declared labware roles should be identity-bearing"
    description: >-
      Every entry of roles.labwareRoles should carry both a description and
      a non-empty expectedLabwareKinds hint. Warning only: legacy records
      remain writable while the gap is surfaced.
    severity: warning
    scope: record
    when:
      op: nonEmpty
      path: roles.labwareRoles
    assert:
      op: everyItem
      collectionPath: roles.labwareRoles
      assert:
        op: all
        predicates:
          - op: nonEmpty
            path: description
          - op: nonEmpty
            path: expectedLabwareKinds
    message:
      template: "Protocol '{{recordId}}': labware role(s) at roles.labwareRoles are not identity-bearing (need description + expectedLabwareKinds); roleIds: {{roles.labwareRoles[*].roleId}}."

  # R3 — cross-category roleId uniqueness: the same roleId declared as BOTH a
  # labwareRole and an instrumentRole is the PRT-wlj0qm defect class. Warning
  # so legacy records stay writable. `when` requires both categories to be
  # present and non-empty (noneIn would otherwise fail loudly on a missing
  # collectionPath — noise for single-category protocols).
  - id: role-id-category-unique
    title: "A roleId must be unique across role categories"
    description: >-
      No roleId value may appear in both roles.labwareRoles and
      roles.instrumentRoles; a shared id makes the category of a step
      reference ambiguous (PRT-wlj0qm defect class).
    severity: warning
    scope: record
    when:
      op: all
      predicates:
        - op: nonEmpty
          path: roles.labwareRoles
        - op: nonEmpty
          path: roles.instrumentRoles
    assert:
      op: noneIn
      path: roles.labwareRoles[*].roleId
      collectionPath: roles.instrumentRoles
      itemField: roleId
    message:
      template: "Protocol '{{recordId}}': a roleId appears in BOTH categories — roles.labwareRoles roleIds {{roles.labwareRoles[*].roleId}} overlap roles.instrumentRoles roleIds {{roles.instrumentRoles[*].roleId}}."

  # R-4 (W2-3) — legacy bounds: newly authored literal protocols cannot qualify.
  # The frozen pre-upgrade inventory lives HERE, as lint YAML data (the six
  # kind:protocol records under records/seed/protocols/ — and ONLY those: the two
  # protocol-SPEC registry docs under schema/registry/protocols/ are zod-validated
  # registry docs, never records, so no record-scope lint can ever bound them; the
  # registry surface is declared frozen for wave 2 in the W2-3 report, OQ2(a)).
  # `when` scopes the rule to records that DECLARE themselves universal-layer
  # protocols (protocolLayer: universal — what the authoring pipeline emits,
  # ProtocolExtractionService) and are NOT on the frozen inventory. Meaning: every
  # step of a newly authored universal protocol must carry `intent` — a new
  # all-literal protocol is refused (RecordStore blocks the write), and a MIXED
  # protocol (one intent step + one literal step) is refused too (OQ1 strict form,
  # orchestrator-accepted).
  - id: legacy-literal-bounded
    title: "Newly authored protocols must be intent-bearing"
    description: >-
      Any protocol that declares protocolLayer: universal and is NOT one of the
      six frozen pre-upgrade seed records must have EVERY step carry an `intent`
      payload. Literal-only or mixed new protocols are refused: intent-only is the
      authored future. The allowlist is the frozen pre-upgrade inventory as DATA.
    severity: error
    scope: record
    when:
      op: all
      predicates:
        - op: equals
          path: protocolLayer
          value: universal
        - op: not
          not:
            op: in
            path: recordId
            values:
              - prt-seed-biological-transfer
              - prt-seed-buffer-prep-50ml
              - prt-seed-incubate-plate
              - prt-seed-pbs-wash
              - prt-seed-serial-dilution-96
              - prt-seed-standard-curve-tubes
    assert:
      op: everyItem
      collectionPath: steps
      assert:
        op: nonEmpty
        path: intent
    message:
      template: "Protocol '{{recordId}}': newly authored universal protocols must be intent-bearing — every step needs an `intent` payload (legacy literal steps are frozen to the pre-upgrade inventory). step ids without intent: {{steps[*].stepId}}."

  # R-5 (W2-3) — the frozen inventory must not drift toward semantic content
  # without the W2-5 promotion lifecycle. Warning severity: seed bootstraps keep
  # working while the drift is surfaced.
  - id: legacy-inventory-no-intent-drift
    title: "Frozen legacy inventory records must stay literal"
    description: >-
      A record on the frozen pre-upgrade inventory that gains an `intent` step is
      being edited toward semantic content outside the promotion lifecycle. Warning
      so the seeds stay writable; the drift is named.
    severity: warning
    scope: record
    when:
      op: in
      path: recordId
      values:
        - prt-seed-biological-transfer
        - prt-seed-buffer-prep-50ml
        - prt-seed-incubate-plate
        - prt-seed-pbs-wash
        - prt-seed-serial-dilution-96
        - prt-seed-standard-curve-tubes
    assert:
      op: everyItem
      collectionPath: steps
      assert:
        op: not
        not:
          op: nonEmpty
          path: intent
    message:
      template: "Protocol '{{recordId}}': frozen legacy inventory record carries intent step(s) — semantic promotion belongs to the W2-5 lifecycle, not an in-place edit. step ids: {{steps[*].stepId}}."

  # R-6 (W2-3) — intent provenance visibility. An intent step without provenance
  # refs is a VISIBLE review issue, never a silent vendor quotation (the W2-6
  # extraction-honesty rule pre-stated as a warning; severity matches the
  # PROTO-AI-4 legacy-tolerance discipline).
  - id: intent-step-provenance-visible
    title: "Intent steps should carry provenance refs"
    description: >-
      When a protocol carries intent steps, EVERY intent step should carry a
      non-empty `intent.provenance` array pointing at the SAID
      (vendor-protocol-candidate record + anchors). Absence is a warning that
      names the step, so unprovenanced intent never reads as vendor truth.
    severity: warning
    scope: record
    when:
      op: nonEmpty
      path: steps[*].intent
    assert:
      op: everyItem
      collectionPath: steps
      assert:
        op: any
        predicates:
          - op: not
            not:
              op: nonEmpty
              path: intent
          - op: nonEmpty
            path: intent.provenance
    message:
      template: "Protocol '{{recordId}}': intent step(s) lack provenance refs — intent without evidence pointers must not read as vendor truth. step ids: {{steps[*].stepId}}."

  # R-7 (W2-3) — belt-and-braces over the schema's required: [semanticVerb].
  # Cheap DSL that catches half-authored drafts if a future relaxed arm slips.
  - id: intent-verb-ref-declared
    title: "Intent steps must carry the semanticVerb ref"
    description: >-
      Every intent step must carry a non-empty `intent.semanticVerb` (the
      verb-definition ref — the crosswalk's "Semantic operation"). The schema
      already requires it; this rule keeps it loud at the lint layer too.
    severity: error
    scope: record
    when:
      op: nonEmpty
      path: steps[*].intent
    assert:
      op: everyItem
      collectionPath: steps
      assert:
        op: any
        predicates:
          - op: not
            not:
              op: nonEmpty
              path: intent
          - op: nonEmpty
            path: intent.semanticVerb
    message:
      template: "Protocol '{{recordId}}': intent step(s) without an intent.semanticVerb ref — the semantic verb is a verb-definition record ref, never absent and never a bare string. step ids: {{steps[*].stepId}}."

# Remaining intended rules (deliberately NOT activated — out of PROTO-AI-4
# scope; track activation separately. The DSL now carries the generic
# quantifiers several of them need — allIn/everyItem/noneIn, see
# schema/lint/lint-v1.schema.yaml — but each still needs its own fixture
# set before activation):
#
#   artifact-step-binding
#     For every producedArtifacts[i].artifactId, at least one step must
#     reference it (currently only StepHarvest.producesArtifactId, but the
#     rule should admit any future step kind that can emit artifacts).
#     Severity: error.
#
#   artifact-role-closure
#     Every producedArtifacts[i].derivedFromRoles[j] must appear in
#     roles.materialRoles[*].roleId or roles.labwareRoles[*].roleId.
#     Severity: error.
#
#   harvest-artifact-declared
#     Any StepHarvest.producesArtifactId must match a declared
#     producedArtifacts[*].artifactId. Severity: error.
#
#   material-artifact-has-derivation-type
#     When producedArtifacts[i].kind == 'material', derivationType SHOULD be
#     set so runs know which material-derivation flavor to emit.
#     Severity: warning.
#
#   phase-id-unique
#     Within a single protocol, all phases[].id values must be unique.
#     Severity: error.
#
#   phase-ordinals-contiguous
#     When phases has N items, the set of phases[*].ordinal values must
#     equal {1, 2, ..., N} exactly. No gaps, no duplicates.
#     Severity: error.
#
#   step-phase-id-resolves
#     If steps[].phaseId is present, it must equal one of the protocol's
#     declared phases[*].id values. Severity: error.
#
#   phase-template-ref-format
#     If phases[].templateRef is present, it must match the pattern
#     ^PHASE-[A-Z0-9-]+$. (Cross-record existence of the referenced
#     phase-template is a separate concern.) Severity: error.
#
# Do not hard-code these checks in TypeScript; extend the generic DSL
# (schema/lint/lint-v1.schema.yaml + PredicateEvaluator) instead.
