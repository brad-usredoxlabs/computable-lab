$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/sidecar/gemini-active-read-request.schema.yaml"
title: Gemini Active Read Request
type: object
required:
  - adapterId
  - parameters
properties:
  adapterId:
    const: molecular_devices_gemini
  instrumentRef:
    # INSTR-COLLAPSE-1 C2: sidecar active-read contract field NAME retained
    # (gemini bridge shape, memo §5 blob-path posture); the ref TARGET is
    # pinned to equipment — the retired instrument kind is not a ref target.
    allOf:
    - $ref: "../datatypes/ref.schema.yaml"
    - type: object
      properties:
        kind: { const: record }
        type: { const: equipment }
  outputPath:
    type: string
    minLength: 1
  parameters:
    type: object
    additionalProperties: true
additionalProperties: false

