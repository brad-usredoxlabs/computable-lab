# UI specification for Protocol records
uiVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/protocol.schema.yaml"

display:
  titleField: "$.title"
  icon: "protocol"

taptab:
  style: "prose"

form:
  layout: "sections"
  sections:
  - title: "Protocol"
    fields:
    - path: "$.kind"
      widget: "text"
      label: "Kind"
      readonly: true
      hidden: true
    - path: "$.title"
      widget: "text"
      label: "Title"
      required: true
    - path: "$.version"
      widget: "text"
      label: "Version"
    - path: "$.createdBy"
      widget: "readonly"
      label: "Author"
      readonly: true
    - path: "$.purpose"
      widget: "protocol-prose-authoring"
      label: "Purpose"
    - path: "$.roles.materialRoles"
      widget: "protocol-material-roles"
      label: "Materials"
    - path: "$.roles.labwareRoles"
      widget: "protocol-labware-roles"
      label: "Consumables / Labware"
    - path: "$.roles.instrumentRoles"
      widget: "protocol-equipment-roles"
      label: "Equipment"
    - path: "$.steps"
      widget: "protocol-step-roles"
      label: "Steps"
    - path: "$.notes"
      widget: "protocol-prose-authoring"
      label: "Notes"

list:
  columns:
  - path: "$.recordId"
    label: "ID"
    width: "120px"
  - path: "$.title"
    label: "Title"
  - path: "$.version"
    label: "Version"
    width: "80px"
