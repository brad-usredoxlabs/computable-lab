# UI specification for Protocol records
uiVersion: 1
schemaId: "https://computable-lab.com/schema/computable-lab/protocol.schema.yaml"

display:
  titleField: "$.title"
  icon: "protocol"

taptab:
  style: "prose"

form:
  layout: "sections"
  sections:
  - title: "Identity"
    fields:
    - path: "$.recordId"
      widget: "text"
      label: "Record ID"
      readonly: true
    - path: "$.kind"
      widget: "text"
      label: "Kind"
      readonly: true
      hidden: true
  - title: "Basic Information"
    fields:
    - path: "$.title"
      widget: "text"
      label: "Title"
      required: true
    - path: "$.version"
      widget: "text"
      label: "Version"
    - path: "$.createdBy"
      widget: "readonly"
      label: "Author"
      readonly: true
    - path: "$.purpose"
      widget: "textarea"
      label: "Purpose"
    - path: "$.description"
      widget: "protocol-prose-authoring"
      label: "Protocol"
      help: "Human-authored prose remains valid without accepted AI structure."
    - path: "$.notes"
      widget: "textarea"
      label: "Notes"
  - title: "AI Suggestions"
    collapsible: true
    fields:
    - path: "$.authoring"
      widget: "protocol-ai-suggestions"
      label: "Structure Suggestions"
  - title: "Phases"
    collapsible: true
    fields:
    - path: "$.phases"
      widget: "array"
      label: "Phases"
  - title: "Protocol Structure"
    fields:
    - path: "$.roles.materialRoles"
      widget: "protocol-material-roles"
      label: "Materials"
    - path: "$.roles.labwareRoles"
      widget: "protocol-labware-roles"
      label: "Consumables / Labware"
    - path: "$.roles.instrumentRoles"
      widget: "protocol-equipment-roles"
      label: "Equipment"
    - path: "$.steps"
      widget: "protocol-step-roles"
      label: "Steps"
  - title: "Document Control"
    fields:
    - path: "$.reviewerRef"
      widget: "ref"
      label: "Reviewer"
      refKind: "person"
      help: "Person assigned to review this document."
    - path: "$.approverRef"
      widget: "ref"
      label: "Approver"
      refKind: "person"
      help: "Person with authority to approve this document."

list:
  columns:
  - path: "$.recordId"
    label: "ID"
    width: "120px"
  - path: "$.title"
    label: "Title"
  - path: "$.version"
    label: "Version"
    width: "80px"
