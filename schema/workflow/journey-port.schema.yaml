# L2-JOURNEY-PORTS-1 (unit u1vocab) — the journey port vocabulary.
#
# A journey step's input is a NAMED PORT, and a port is a reference of one of six
# kinds. Two families must never conflate: a CommittedRecordReference names a
# durable record plus the governed-write receipt that committed it; a
# StagedDraftReference names a draft that is NOT a record yet (no receipt, no
# record id). That distinction is what lets the compiler refuse "the check passed
# on a surface, not on a committed record".
#
# This file is VOCABULARY, not a record kind: it is referenced by $ref from the
# journey/capability documents (later legs). There is no lint host and no ui spec
# here yet — lint needs a record host (schemaId + a stored record contract).
#
# Every port is CLOSED (additionalProperties: false) and REQUIRES a version: a
# reference without a version is a promise without a subject. MaterialReference's
# provenance_layer enum is the shipped material-profile registry's layer keys
# (schema/lab/material-profile.registry.yaml, clarification.layers) and is pinned
# to them by test — it must never grow a second authority.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/journey-port.schema.yaml"
title: "Journey Port Reference"
description: >
  Declared reference types for journey step inputs. The document root is a
  vocabulary container, not a payload shape; callers validate against
  #/$defs/<PortName>. Each port is closed over its own fields and requires a
  version.

type: object
additionalProperties: false

$defs:
  SequenceSetReference:
    type: object
    additionalProperties: false
    required: [version, sequence_set_id]
    properties:
      version:
        type: string
        minLength: 1
        description: "Version of the referenced sequence set that this step pins."
      sequence_set_id:
        type: string
        minLength: 1
        description: "Id of the sequence set record this port resolves."

  AlignmentReference:
    type: object
    additionalProperties: false
    required: [version, alignment_id]
    properties:
      version:
        type: string
        minLength: 1
        description: "Version of the referenced alignment that this step pins."
      alignment_id:
        type: string
        minLength: 1
        description: "Id of the alignment record this port resolves."

  MaterialReference:
    type: object
    additionalProperties: false
    required: [version, material_id, provenance_layer]
    properties:
      version:
        type: string
        minLength: 1
        description: "Version of the referenced material record that this step pins."
      material_id:
        type: string
        minLength: 1
        description: "Id of the material record this port resolves."
      provenance_layer:
        type: string
        enum: [material, material-spec, material-instance, aliquot, vendor-product]
        description: >
          Provenance layer of the referenced material, using the shipped
          material-profile registry's clarification.layers keys. Layers must
          never be collapsed: a prepared solution is not a bare compound, and
          an aliquot is not the preparation it was taken from.

  LabwareDefinitionReference:
    type: object
    additionalProperties: false
    required: [version, labware_definition_id]
    properties:
      version:
        type: string
        minLength: 1
        description: "Version of the referenced labware definition that this step pins."
      labware_definition_id:
        type: string
        minLength: 1
        description: >
          Id of a labware DEFINITION (a type: plate model, tip box model).
          A physical container is a separate reference, never smuggled in here.

  CommittedRecordReference:
    type: object
    additionalProperties: false
    required: [version, record_id, record_type, receipt_id]
    properties:
      version:
        type: string
        minLength: 1
        description: "Version of the committed record that this step pins."
      record_id:
        type: string
        minLength: 1
        description: "Id of the durable record this port resolves."
      record_type:
        type: string
        minLength: 1
        description: "Record kind of the durable record (e.g. a registered record kind)."
      receipt_id:
        type: string
        minLength: 1
        description: >
          Id of the governed-write receipt that committed the record. Required:
          a committed reference without a receipt is exactly the surface the
          journey check must refuse.

  StagedDraftReference:
    type: object
    additionalProperties: false
    required: [version, draft_id]
    properties:
      version:
        type: string
        minLength: 1
        description: "Version of the staged draft that this step pins."
      draft_id:
        type: string
        minLength: 1
        description: >
          Id of a staged draft. A draft is not a committed record: this port
          declares no receipt_id and no record_id, and the closed shape refuses
          both, so staged output can never masquerade as committed.
