# L2-JOURNEY-EVIDENCE-1 (unit evbundle) — the journey evidence bundle.
#
# ONE closed manifest per journey revision: what was asked (request), what the
# AI added (intent_revisions), which compiler versions compiled it, which
# external data versions were used (retained_versions), the compiled manifests
# and execution envelopes, the retained observations, who approved what
# (human_approvals, the human-task completion receipts), which effects
# occurred (effect_receipts), the checkpoint events, and the determinism mode.
# Every preserved document is retained WITH its document text, not just its
# digest: ref_id + declared sha256 + the document itself, so an auditor
# working only from the bundle can re-hash each entry against its declared
# digest. The manifest and envelope members mirror the shipped TS shapes
# (journeyCompiler.ts:39, journeyEnvelope.ts:30) verbatim — this schema
# records them, never widens them. The bundle is a RETAINED EVIDENCE RECORD,
# not a compliance claim: nothing in it certifies that the journey was run
# correctly, only that its inputs, decisions and effects are recoverable.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/journey-evidence-bundle.schema.yaml"
title: "Journey Evidence Bundle"
type: object
additionalProperties: false
required: [journey_id, revision, request, intent_revisions, compiler_versions, retained_versions, compiled_manifests, observations, human_approvals, execution_envelopes, effect_receipts, checkpoint_events, determinism]
properties:
  journey_id: { type: string, minLength: 1 }
  revision: { type: integer, minimum: 1 }
  request:
    type: object
    additionalProperties: false
    description: "The original user message, captured verbatim and never rewritten (mirrors journey-document.schema.yaml:36)."
    required: [message_id, verbatim_text]
    properties:
      message_id: { type: string, minLength: 1 }
      verbatim_text: { type: string, minLength: 1 }
  intent_revisions:
    type: array
    minItems: 1
    description: "The journey intent document revisions the AI added, retained in full."
    items: { $ref: "#/$defs/PreservedDocument" }
  compiler_versions:
    type: array
    minItems: 1
    description: "Which compiler(s) produced the retained manifests, by name and version."
    items:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
  retained_versions:
    type: array
    description: "The external data versions the run used: what each external record was pinned to."
    items:
      type: object
      additionalProperties: false
      required: [ref, version]
      properties:
        ref: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
  compiled_manifests:
    type: array
    description: "The stage-1 compiled manifests, verbatim from journeyCompiler.ts — never widened here."
    items: { $ref: "#/$defs/CompiledJourneyManifest" }
  observations:
    type: array
    description: "Retained observations; evidence explains biological context, never plate position."
    items: { $ref: "#/$defs/PreservedDocument" }
  human_approvals:
    type: array
    description: "The human-task completion receipts retained per approved task; ref_id is the task (step) id the receipt completes."
    items: { $ref: "#/$defs/PreservedDocument" }
  execution_envelopes:
    type: array
    description: "The ready execution envelopes with their recorded policy authorization, verbatim from journeyEnvelope.ts."
    items: { $ref: "#/$defs/CompiledJourneyEnvelope" }
  effect_receipts:
    type: array
    description: "The effect receipts the run declares: every effect that occurred must have its receipt retained here."
    items: { $ref: "#/$defs/PreservedDocument" }
  checkpoint_events:
    type: array
    description: "The retained checkpoint events (return-contract checkpoints the journey passed)."
    items: { $ref: "#/$defs/PreservedDocument" }
  determinism:
    type: object
    additionalProperties: false
    required: [mode]
    properties:
      mode:
        type: string
        enum: [replay_from_evidence, reproduce, rerun_against_todays_data]
        description: "Recorded, not inferred: exactly which of the three data modes the bundle supports."
$defs:
  # A preserved document: the entry's ref, its declared digest (lowercase hex of
  # the document string's bytes), and the document ITSELF — retained, not just
  # the digest, so verification is a re-hash of the exact text carried.
  PreservedDocument:
    type: object
    additionalProperties: false
    required: [ref_id, sha256, document]
    properties:
      ref_id: { type: string, minLength: 1 }
      sha256: { type: string, minLength: 64, pattern: "^[0-9a-f]{64}$" }
      document: { type: string, minLength: 1 }
  # Mirror of CompiledJourneyManifest (journeyCompiler.ts:39) — same members,
  # same optionality (invalidations absent, never undefined).
  CompiledJourneyManifest:
    type: object
    additionalProperties: false
    required: [journey_id, revision, steps, not_ready]
    properties:
      journey_id: { type: string, minLength: 1 }
      revision: { type: integer, minimum: 1 }
      steps:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, capability_ref, capability_version, interaction_mode, status, reasons, blocked_by]
          properties:
            id: { type: string, minLength: 1 }
            capability_ref: { type: string, minLength: 1 }
            capability_version: { type: string, minLength: 1 }
            interaction_mode: { type: string, enum: [automatic, human_in_the_loop] }
            status: { type: string, enum: [READY, NOT_READY] }
            reasons: { type: array, items: { type: string, enum: [awaiting_producer_output, awaiting_human_completion, stale_input] } }
            blocked_by: { type: array, items: { type: string, minLength: 1 } }
      not_ready: { type: array, items: { type: string, minLength: 1 } }
      invalidations:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [step_id, rule, message]
          properties:
            step_id: { type: string, minLength: 1 }
            rule: { type: string, minLength: 1 }
            message: { type: string }
  # Mirror of CompiledJourneyEnvelope (journeyEnvelope.ts:30) — authorization
  # optional exactly as the TS type declares it.
  CompiledJourneyEnvelope:
    type: object
    additionalProperties: false
    required: [journey_id, revision, step_id, capability_ref, capability_version, bindings]
    properties:
      journey_id: { type: string, minLength: 1 }
      revision: { type: integer, minimum: 1 }
      step_id: { type: string, minLength: 1 }
      capability_ref: { type: string, minLength: 1 }
      capability_version: { type: string, minLength: 1 }
      bindings:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [port_index, declared_version, resolved_version]
          properties:
            port_index: { type: integer, minimum: 0 }
            declared_version: { type: string, minLength: 1 }
            resolved_version: { type: string, minLength: 1 }
      authorization:
        type: object
        additionalProperties: false
        required: [action, target, disposition, authority, setting_key, origin_profile_id, rationale]
        properties:
          action: { type: string, minLength: 1 }
          target: { type: string, minLength: 1 }
          disposition: { type: string, enum: [allowed, needs-confirmation, blocked] }
          authority: { type: string, enum: [none, run-operator, supervisor, project-owner, lab-manager, qa-reviewer, organization-admin] }
          setting_key: { type: string, minLength: 1 }
          origin_profile_id: { type: string, minLength: 1 }
          rationale: { type: string }
