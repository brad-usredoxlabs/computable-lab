$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/protocol.schema.yaml"
title: "Protocol"
description: >
  A Protocol is a reusable, declarative recipe intended to produce PlateEvents when executed in a Run. It is NOT execution truth: no concrete labware instances, no actual timestamps, and no embedded data files. Runs instantiate protocols by binding labware/material roles and providing parameter values, then emitting canonical PlateEvents.

type: object
unevaluatedProperties: false
allOf:
- $ref: "./common.schema.yaml#/$defs/FAIRCommon"

required:
- kind
- recordId
- title
- steps

properties:
  protocolLayer:
    type: string
    const: "universal"
    description: "Explicit protocol-layer marker for backend compilation."

  kind:
    const: "protocol"
    description: "Record discriminator."

  recordId:
    type: string
    description: "Stable local identifier (e.g., PRT-000123)."

  title:
    type: string

  shortSlug:
    type: string
    description: "Human-friendly slug for filenames/URLs."

  description:
    type: string

  overview:
    type: string
    description: "Optional human-readable overview of when and how this protocol is used."

  purpose:
    type: string
    description: "Optional statement of the scientific or operational purpose for this protocol."

  notes:
    type: string
    description: "Optional authoring notes, caveats, or project-specific guidance."

  humanStepsText:
    type: string
    description: "Full long-form human-readable protocol (e.g. the /extraction/human-steps output) incl. clarifying notes; kept alongside the concise machine `steps`."

  authoring:
    type: object
    additionalProperties: false
    description: "Optional TapTab authoring sidecar state linked to Protocol IDE-style AI workspaces. Advisory AI state lives here; the protocol remains canonical."
    properties:
      sessionRef:
        allOf:
        - $ref: "./datatypes/ref.schema.yaml"
        - type: object
          properties:
            kind: { const: record }
            type: { const: protocol-ide-session }
      linkedAt:
        type: string
        format: date-time
      lastSuggestedAt:
        type: string
        format: date-time
      lastSuggestionCount:
        type: integer
        minimum: 0

  version:
    type: string
    description: "Optional semantic version for human use (e.g., '1.2.0')."

  state:
    type: string
    description: "Workflow state (draft, in_review, approved, effective, superseded, archived, accepted, deprecated)."
    enum: [draft, in_review, approved, effective, superseded, archived, accepted, deprecated]

  source:
    type: object
    additionalProperties: false
    description: "Provenance of this protocol — where the recipe originated."
    required: [type]
    properties:
      type:
        type: string
        enum: [vendor, literature, internal, derived]
        description: "vendor = vendor kit PDF; literature = publication; internal = lab-authored; derived = promoted from an event-graph."
      ref:
        $ref: "./datatypes/ref.schema.yaml"
        description: "Optional pointer to the source record (publication-ref, document-ref, or event-graph-ref)."

  evolvedFrom:
    type: array
    description: "History of protocol evolution — tracks how this protocol was derived from previous versions or sources."
    items:
      type: object
      additionalProperties: false
      required: [ sourceType, sourceRef, reason, evolvedAt ]
      properties:
        sourceType:
          type: string
          enum: [ run, event-graph, protocol ]
          description: "Type of source this protocol was evolved from."
        sourceRef:
          $ref: "./datatypes/ref.schema.yaml"
          description: "Reference to the source record (run, event-graph, or protocol)."
        reason:
          type: string
          description: "Reason for this evolution (e.g., 'adapted from execution', 'corrected deviation', 'localized from template')."
        evolvedAt:
          type: string
          format: date-time
          description: "ISO8601 timestamp when this evolution occurred."

  links:
    type: object
    description: "Optional project filing links. Study/project ownership is queryable by index; protocols are not embedded in study records."
    additionalProperties: false
    properties:
      studyId:
        type: string
      experimentId:
        type: string
      runId:
        type: string

  tags:
    type: array
    items: { type: string }
    uniqueItems: true

  layoutTemplateRefs:
    type: array
    description: "Optional reusable plate/reservoir layout templates this protocol can bind."
    items:
      $ref: "./datatypes/ref.schema.yaml"
    uniqueItems: true

  libraryBundleRefs:
    type: array
    description: "Optional library bundles (vendor/custom) this protocol is designed to consume."
    items:
      $ref: "./datatypes/ref.schema.yaml"
    uniqueItems: true

  # Declarative, reusable parameter definitions. Values are supplied at execution time by a Run.
  parameters:
    type: array
    description: "Parameter definitions for this protocol."
    items:
      $ref: "#/$defs/ParameterDef"
    uniqueItems: true

  # Roles are abstract placeholders that Runs bind to concrete labware instances/material revisions.
  roles:
    type: object
    description: "Optional abstract roles used by steps (labware, materials, instruments, etc.)."
    additionalProperties: false
    properties:
      labwareRoles:
        type: array
        items: { $ref: "#/$defs/LabwareRole" }
        uniqueItems: true
      materialRoles:
        type: array
        items: { $ref: "#/$defs/MaterialRole" }
        uniqueItems: true
      instrumentRoles:
        type: array
        items: { $ref: "#/$defs/InstrumentRole" }
        uniqueItems: true
      layoutTemplateRoles:
        type: array
        items: { $ref: "#/$defs/LayoutTemplateRole" }
        uniqueItems: true
      libraryRoles:
        type: array
        items: { $ref: "#/$defs/LibraryRole" }
        uniqueItems: true
      contextRoles:
        type: array
        items: { $ref: "#/$defs/ContextRole" }
        uniqueItems: true

  # Declarative contract for artifacts this protocol produces when executed.
  # Runs must satisfy this contract by emitting matching material-derivation
  # (or measurement/dataset) records referencing this protocol.
  producedArtifacts:
    type: array
    description: >
      Declarative contract for artifacts this protocol produces. Every entry
      must be bound to at least one step (e.g., a harvest step's
      producesArtifactId) and, at run time, materialized as a concrete record
      whose provenance points back at this protocol.
    items:
      $ref: "#/$defs/ProducedArtifact"
    uniqueItems: true

  # Declarative contract for SOURCE contexts this protocol CONSUMES (protocol
  # chaining, Plan 2). A downstream protocol (e.g. rtPCR) declares it needs a
  # source plate/context; a run realizes the chain by binding a promoted
  # plate-context (from an upstream protocol) to that role, and consumption is
  # an explicit gate (the downstream's first action is a transfer off the
  # bound source). Additive; absent = the protocol starts from scratch.
  inputContexts:
    type: array
    description: >
      Optional declarative contract: source context(s) this protocol consumes
      when chained after an upstream protocol. Each entry names a source ROLE
      a run must bind to a promoted context (CTX/snapshot) that was produced
      by an upstream protocol.
    items:
      $ref: "#/$defs/InputContext"
    uniqueItems: true

  executionProfiles:
    type: array
    description: "Optional reusable execution strategies (single-channel vs multi-channel, lane sequencing)."
    items:
      $ref: "#/$defs/ExecutionProfile"
    uniqueItems: true

  lifecycleId:
    type: string
    const: "document-control"
    description: "Lifecycle governing this record's state transitions."

  reviewerRef:
    allOf:
    - $ref: "./datatypes/ref.schema.yaml"
    - type: object
      properties:
        kind: { const: record }
        type: { const: person }
    description: "Person assigned to review this protocol."

  approverRef:
    allOf:
    - $ref: "./datatypes/ref.schema.yaml"
    - type: object
      properties:
        kind: { const: record }
        type: { const: person }
    description: "Person with authority to approve this protocol for use."

  componentInstanceRefs:
    type: array
    description: "Optional graph-component-instance refs linked to this protocol."
    items:
      type: object
      additionalProperties: false
      required: [ kind, id, type ]
      properties:
        kind: { const: "record" }
        id: { type: string }
        type: { const: "graph-component-instance" }
    uniqueItems: true

  # Declarative phase grouping for protocol steps.
  phases:
    type: array
    description: "Optional phase grouping for protocol steps."
    items:
      $ref: "#/$defs/Phase"
    uniqueItems: true

  # Preserved vendor/literature conditional branches (e.g. "if bacterial DNA /
  # if mammalian cell culture"). The extractor may emit these instead of (or in
  # addition to) fissioning into separate protocols, so a protocol can express
  # its shared parent + branch axis explicitly. A local protocol picks a branch
  # via `variantRef`. Optional and additive.
  variants:
    type: array
    description: "Optional starting-material condition branches preserved from the source."
    items:
      $ref: "#/$defs/ProtocolVariant"
    uniqueItems: true

  # Declarative branch axes (if/then/else over choices of sample type / labware
  # format). Each axis is resolved FIRST during localization; the resolved
  # branch(es) determine the local protocol's starting step set. Conditions
  # reuse the PredicateEvaluator vocabulary (datatypes/condition.schema.yaml).
  branch_axes:
    type: array
    description: "Optional declarative if/then/else branch templates for localization. Axes may be derived from a protocol-decision-tree's axes[] per the declared data flow in schema/registry/branch-axis-mapping/pdt-axis-to-branch-axis.yaml (question -> label; conditions pass through the shared BranchCondition datatype; choiceKey/origin/evidence stay on the PDT record)."
    items:
      $ref: "./datatypes/condition.schema.yaml#/$defs/BranchAxis"
    uniqueItems: true

  steps:
    type: array
    minItems: 1
    description: >
      Ordered protocol steps. Steps are declarative and may be compiled into expected PlateEvents, but are not themselves canonical events.
    items:
      $ref: "#/$defs/ProtocolStep"

$defs:
  # -------------------------
  # Phase definitions
  # -------------------------
  Phase:
    type: object
    additionalProperties: false
    required: [ id, label, ordinal ]
    properties:
      id:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Unique phase identifier within this protocol."
      label:
        type: string
        minLength: 1
        description: "Human-readable phase label."
      description:
        type: string
        description: "Optional phase description."
      ordinal:
        type: integer
        minimum: 1
        description: "Display order (1-based, must be contiguous starting at 1)."
      templateRef:
        type: string
        pattern: "^PHASE-[A-Z0-9-]+$"
        description: "Optional reference to a phase-template record."

  # -------------------------
  # Execution metadata
  # -------------------------
  ExecutionMeta:
    type: object
    additionalProperties: false
    description: "Runtime execution tracking for a protocol step. Populated by the execution layer."
    properties:
      startedAt:
        type: string
        format: date-time
        description: "ISO8601 timestamp when this step began execution."
      completedAt:
        type: string
        format: date-time
        description: "ISO8601 timestamp when this step finished execution."
      executedBy:
        type: string
        description: "Identifier of the person or system that executed this step."
      deviations:
        type: array
        description: "Optional list of deviations recorded during execution of this step."
        items:
          type: object
          additionalProperties: false
          required: [ deviationId, description ]
          properties:
            deviationId:
              type: string
              description: "Unique identifier for this deviation."
            description:
              type: string
              description: "Human-readable description of what deviated and why."
            severity:
              type: string
              enum: [ info, warning, critical ]
              description: "Severity level of the deviation."
            occurredAt:
              type: string
              format: date-time
              description: "When the deviation occurred."
            resolved:
              type: boolean
              description: "Whether the deviation was resolved."

  # -------------------------
  # Parameter definitions
  # -------------------------
  ParameterDef:
    type: object
    additionalProperties: false
    required: [ name, type ]
    properties:
      name:
        type: string
        pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
      type:
        type: string
        enum: [ string, number, integer, boolean, object, array ]
      description:
        type: string
      default:
        description: "Optional default value."
      unit:
        type: string
        description: "Optional unit hint (e.g., 'uL', 'min', 'C')."
      enum:
        type: array
        description: "Optional enumerated allowed values."
        items: {}
      required:
        type: boolean
        description: "If true, Run must supply a value."
      constraints:
        type: object
        description: "Optional numeric constraints for number/integer."
        additionalProperties: false
        properties:
          minimum: { type: number }
          maximum: { type: number }
          exclusiveMinimum: { type: number }
          exclusiveMaximum: { type: number }

  # -------------------------
  # Roles
  # -------------------------
  LabwareRole:
    type: object
    additionalProperties: false
    required: [ roleId ]
    properties:
      roleId:
        type: string
        description: "Symbolic role identifier used in steps (e.g., 'plate', 'reservoir')."
      description:
        type: string
      expectedLabwareKinds:
        type: array
        description: "Optional hint of compatible labware designs (recordIds)."
        items: { type: string }
        uniqueItems: true

  MaterialRole:
    type: object
    additionalProperties: false
    required: [ roleId ]
    properties:
      roleId:
        type: string
        description: "Symbolic material role used in steps (e.g., 'dye', 'treatment')."
      description:
        type: string
      allowedMaterialIds:
        type: array
        description: "Optional hint: allowable material concepts."
        items: { type: string }
        uniqueItems: true

  InstrumentRole:
    type: object
    additionalProperties: false
    required: [ roleId ]
    properties:
      roleId:
        type: string
        description: "Symbolic instrument role used in steps (e.g., 'plate_reader')."
      description:
        type: string
      allowedInstrumentIds:
        type: array
        items: { type: string }
        uniqueItems: true

  LayoutTemplateRole:
    type: object
    additionalProperties: false
    required: [ roleId ]
    properties:
      roleId:
        type: string
      description:
        type: string
      allowedTemplateIds:
        type: array
        items: { type: string }
        uniqueItems: true

  LibraryRole:
    type: object
    additionalProperties: false
    required: [ roleId ]
    properties:
      roleId:
        type: string
      description:
        type: string
      allowedLibraryIds:
        type: array
        items: { type: string }
        uniqueItems: true

  ContextRole:
    type: object
    additionalProperties: false
    required: [ roleId ]
    properties:
      roleId:
        type: string
      description:
        type: string
      expectedContextTags:
        type: array
        items: { type: string }
        uniqueItems: true

  # -------------------------
  # Produced artifacts
  # -------------------------
  # Declarative input contract: a source context role this protocol consumes
  # when chained after an upstream protocol. A run binds a promoted context
  # (CTX / context-snapshot) to this role; consumption is an explicit gate.
  InputContext:
    type: object
    additionalProperties: false
    required: [ role ]
    properties:
      role:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Source role a run binds to a promoted context (e.g. 'source-rna-plate')."
      description:
        type: string
        description: "What source this role expects (e.g. 'purified RNA plate from the extraction protocol')."
      sourceKind:
        type: string
        enum: [ plate-context, context-snapshot, material-context ]
        description: "What kind of source context this role accepts. Absent = any promoted context."
      consumesByDefault:
        type: boolean
        default: true
        description: "Whether the run should emit an explicit transfer-off-the-source event as the first action (the consumption gate)."

  ProducedArtifact:
    type: object
    additionalProperties: false
    required: [ artifactId, kind ]
    properties:
      artifactId:
        type: string
        pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
        description: "Symbolic output name referenced by steps (e.g., 'purified_dna')."
      description:
        type: string
      kind:
        type: string
        enum: [ material, measurement, dataset ]
        description: "What sort of artifact this protocol yields."
      derivationType:
        type: string
        enum: [ preparation, culture, conditioning, collection, harvest, split, other ]
        description: >
          Hint for the material-derivation record a run should emit when this
          artifact is produced. Only meaningful when kind = material.
      materialSpecRef:
        allOf:
        - $ref: "./datatypes/ref.schema.yaml"
        - type: object
          properties:
            kind: { const: record }
            type: { const: material-spec }
        description: "Optional: pins the output to a material-spec."
      derivedFromRoles:
        type: array
        description: >
          Role identifiers (from roles.materialRoles or roles.labwareRoles)
          this artifact is derived from. Used by lint to enforce closure.
        items: { type: string }
        uniqueItems: true
      cardinality:
        type: object
        additionalProperties: false
        description: "Expected quantity characteristics."
        properties:
          perRun:     { type: integer, minimum: 0 }
          perWell:    { type: boolean }
          perHarvest: { type: boolean }
      expectedVolume_uL:
        $ref: "#/$defs/Expr"

  ExecutionProfile:
    type: object
    additionalProperties: false
    required: [ profileId, pipetteMode, laneStrategy ]
    properties:
      profileId:
        type: string
      label:
        type: string
      pipetteMode:
        type: string
        enum: [ single_channel, multi_channel_parallel ]
      laneStrategy:
        type: string
        enum: [ sequential_lanes, parallel_lanes ]
      laneGroupIds:
        type: array
        items: { type: string }
        uniqueItems: true
      notes:
        type: string

  # -------------------------
  # Well selection (abstract)
  # -------------------------
  WellSelector:
    description: >
      Abstract selection of wells. This must be resolvable by the execution layer given a bound labware instance and its labware design. Avoid hardcoding plate geometry here.
    oneOf:
    - type: object
      additionalProperties: false
      required: [ kind ]
      properties:
        kind: { const: "all" }
    - type: object
      additionalProperties: false
      required: [ kind, wells ]
      properties:
        kind: { const: "explicit" }
        wells:
          type: array
          minItems: 1
          items: { type: string }
    - type: object
      additionalProperties: false
      required: [ kind, range ]
      properties:
        kind: { const: "range" }
        range:
          type: object
          additionalProperties: false
          required: [ start, end ]
          properties:
            start: { type: string }
            end: { type: string }
    - type: object
      additionalProperties: false
      required: [ kind, region ]
      properties:
        kind: { const: "region" }
        region:
          type: string
          description: "Named region defined elsewhere (e.g., layout template)."

  # -------------------------
  # Expression (parameterizable values)
  # -------------------------
  Expr:
    description: >
      A value that can be literal or parameter reference. Keep this simple so agents don't hardcode.
    oneOf:
    - type: number
    - type: boolean
    - type: string
    - type: object
      additionalProperties: false
      required: [ param ]
      properties:
        param:
          type: string
          description: "Reference to a parameter by name (e.g., {param: incubation_min})."

  SemanticVerbRef:
    type: object
    description: "Semantic verb reference independent of any execution backend."
    additionalProperties: false
    properties:
      ref:
        allOf:
        - $ref: "./datatypes/ref.schema.yaml"
        - type: object
          properties:
            kind: { const: record }
            type: { const: verb-definition }
      canonical:
        type: string
      backendHints:
        type: array
        items: { type: string }
        uniqueItems: true

  MethodRequirement:
    type: object
    description: "Optional method-level constraints resolved during compilation."
    additionalProperties: false
    properties:
      methodId:
        type: string
      instrumentRole:
        type: string
      requiredOperatorQualification:
        type: string
      notes:
        type: string

  ExecutionPreference:
    type: object
    description: "Non-binding execution preferences resolved by the protocol compiler."
    additionalProperties: false
    properties:
      manualAllowed:
        type: boolean
      preferredBackendIds:
        type: array
        items: { type: string }
        uniqueItems: true

  # -------------------------
  # Step union
  # -------------------------
  ProtocolVariant:
    type: object
    additionalProperties: false
    required: [ variantId, label ]
    description: >
      A preserved conditional starting-material branch (e.g. "if bacterial DNA" /
      "if mammalian cell culture"). Lets a protocol keep its branch axis instead of
      silently fissioning into separate protocols; a local protocol realizes one
      branch via `variantRef`. Optional and additive.
    properties:
      variantId:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Stable branch identifier (e.g. 'mammalian-cell-culture')."
      label:
        type: string
        minLength: 1
        description: "Human-readable branch label (e.g. 'Mammalian cell culture')."
      starting_material:
        type: string
        description: "Starting-material description (e.g. 'DNA from mammalian cell culture')."
      kind_hint:
        type: string
        description: "Machine-readable tagging for the starting-material kind (e.g. 'mammalian-cells')."
      stepIds:
        type: array
        items: { type: string }
        uniqueItems: true
        description: "Optional stepIds in this protocol's steps[] that this branch activates."
      notes:
        type: string

  ProtocolStep:
    type: object
    required: [ stepId, label, ordinal, kind ]
    properties:
      stepId:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Local step identifier unique within this protocol (lowercase alphanumeric with hyphens)."
      label:
        type: string
        minLength: 1
        description: "Human-readable label for this step."
      description:
        type: string
        description: "Optional detailed description of what this step does and why."
      ordinal:
        type: integer
        minimum: 1
        description: "Display/execution order within the protocol (1-based, contiguous)."
      notes:
        type: string
        description: "Optional freeform operator notes or caveats for this step."
      kind:
        type: string
        enum: [ add_material, transfer, mix, wash, incubate, read, harvest, other ]
      semanticVerb:
        $ref: "#/$defs/SemanticVerbRef"
      methodRequirement:
        $ref: "#/$defs/MethodRequirement"
      executionPreference:
        $ref: "#/$defs/ExecutionPreference"

      # Optional intended offset (planning aid only; not execution truth)
      plannedOffset:
        type: string
        description: "Optional planned ISO-8601 duration from run start (e.g., 'PT15M')."

      # Optional reference to a declared phase
      phaseId:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Optional reference to a declared phase id."

      # Explicit compartment hint propagated onto the compiled event(s)
      phase:
        type: string
        description: "Explicit compartment hint for well-state propagation: whether the material(s) produced/affected by this step are in free solution ('soluble') or immobilized on a solid phase ('adsorbed'). Absent defaults to 'soluble'. The well-state tracker never infers this from context."
        enum: [ soluble, adsorbed ]

      # Reference to this step's concrete REALIZATION (its sub-event-graph).
      # The concept → realization model: a step ("wash the cells") points at the
      # specific event series that actualizes it. Target may be a reusable
      # graph-component-instance OR a committed event-graph realization.
      subGraphRef:
        allOf:
        - $ref: "./datatypes/ref.schema.yaml"
        - type: object
          properties:
            kind: { const: record }
        description: "Optional pointer to the record that realizes this step's sub-event-graph (graph-component-instance or committed event-graph)."
        oneOf:
        - type: object
          properties:
            type: { const: graph-component-instance }
        - type: object
          properties:
            type: { const: event-graph }
        - type: object
          properties:
            type: { const: protocol }
        - type: object
          properties:
            type: { const: local-protocol }

      # Step-level settings referencing the Setting schema.
      settings:
        type: array
        description: "Optional step-level editable parameters (settings) that an operator can adjust at execution time."
        items:
          $ref: "./setting.schema.yaml"
        uniqueItems: true

      # Execution tracking metadata populated at runtime.
      executionMeta:
        $ref: "#/$defs/ExecutionMeta"

      # W2-3 — the INTENT-step discriminator slot. Presence of `intent` marks this
      # step as a semantic INTENT step: semantic verb + symbolic role/capability
      # material needs + typed Quantity/constraint bindings (W2-2 datatypes) +
      # provenance refs. An intent step can NEVER carry literal vendor execution
      # params: every literal payload def below now carries `not: {required: [intent]}`
      # and the closed IntentStep arm closes the envelope, so a step carrying BOTH
      # `intent` and a literal/unknown key matches zero oneOf branches -> schema REJECT.
      intent:
        $ref: "#/$defs/IntentStepPayload"

      # Whether this step is optional (can be skipped without invalidating the protocol).
      isOptional:
        type: boolean
        default: false
        description: "When true, this step may be skipped during execution without marking the run as deviated."

    allOf:
    # Arm 1 — the step union. The eight LITERAL payload arms (vendor execution
    # params) plus the ninth INTENT arm (W2-3). Because every literal payload def
    # carries `not: {required: [intent]}` and IntentStep closes its envelope with
    # additionalProperties:false, a step carrying `intent` AND any literal/unknown
    # execution key matches ZERO branches -> schema REJECT. `intent` presence IS
    # the discriminator; there is no stepShape enum.
    - oneOf:
      - $ref: "#/$defs/StepAddMaterial"
      - $ref: "#/$defs/StepTransfer"
      - $ref: "#/$defs/StepMix"
      - $ref: "#/$defs/StepWash"
      - $ref: "#/$defs/StepIncubate"
      - $ref: "#/$defs/StepRead"
      - $ref: "#/$defs/StepHarvest"
      - $ref: "#/$defs/StepOther"
      - $ref: "#/$defs/IntentStep"
    # Arm 2 (W2-3) — the actionable-error arm. Not load-bearing for rejection (arm 1
    # already rejects); it names the forbidden literal key on an intent step so the
    # validation error is diagnosable rather than an opaque oneOf failure. Declarative
    # envelope keys (settings, subGraphRef, executionMeta, executionPreference,
    # methodRequirement, phase, phaseId, plannedOffset, isOptional) stay ALLOWED.
    - if:
        required: [ intent ]
      then:
        not:
          anyOf:
          - { required: [ volume_uL ] }
          - { required: [ working_concentration ] }
          - { required: [ target ] }
          - { required: [ source ] }
          - { required: [ wells ] }
          - { required: [ material ] }
          - { required: [ cycles ] }
          - { required: [ washVolume_uL ] }
          - { required: [ duration_min ] }
          - { required: [ temperature_C ] }
          - { required: [ modality ] }
          - { required: [ channels ] }
          - { required: [ instrumentRole ] }
          - { required: [ mappingHint ] }
          - { required: [ producesArtifactId ] }
          - { required: [ ratio ] }

  # -------------------------
  # Step payloads (minimal, declarative)
  # -------------------------
  # W2-3 — the INTENT arm. A step whose payload is `intent` is a semantic intent
  # step: it declares WHAT it means (semantic verb, symbolic material needs,
  # typed Quantity/constraint bindings, provenance refs) and can never state HOW a
  # vendor instrument does it. The envelope keys are shared with the base step by
  # JSON-pointer $ref (DRY — no duplicated envelope definitions).
  IntentStep:
    type: object
    required: [ intent ]
    additionalProperties: false
    description: >-
      The INTENT arm of the step union: the declarative step envelope plus an
      IntentStepPayload, and NOTHING else. Literal vendor execution params
      (volume_uL, target, source, wells, material, cycles, washVolume_uL,
      duration_min, temperature_C, modality, channels, instrumentRole,
      mappingHint, producesArtifactId, ratio, working_concentration) are excluded
      by construction: this arm closes the envelope, and every literal payload def
      refuses `intent`. D1 concession — intent steps cannot carry literal vendor
      execution params; realization answers belong to local-protocol (W2-7/D9).
    properties:
      stepId: { $ref: "#/$defs/ProtocolStep/properties/stepId" }
      label: { $ref: "#/$defs/ProtocolStep/properties/label" }
      description: { $ref: "#/$defs/ProtocolStep/properties/description" }
      ordinal: { $ref: "#/$defs/ProtocolStep/properties/ordinal" }
      notes: { $ref: "#/$defs/ProtocolStep/properties/notes" }
      kind: { $ref: "#/$defs/ProtocolStep/properties/kind" }
      semanticVerb: { $ref: "#/$defs/ProtocolStep/properties/semanticVerb" }
      methodRequirement: { $ref: "#/$defs/ProtocolStep/properties/methodRequirement" }
      executionPreference: { $ref: "#/$defs/ProtocolStep/properties/executionPreference" }
      plannedOffset: { $ref: "#/$defs/ProtocolStep/properties/plannedOffset" }
      phaseId: { $ref: "#/$defs/ProtocolStep/properties/phaseId" }
      phase: { $ref: "#/$defs/ProtocolStep/properties/phase" }
      subGraphRef: { $ref: "#/$defs/ProtocolStep/properties/subGraphRef" }
      settings: { $ref: "#/$defs/ProtocolStep/properties/settings" }
      executionMeta: { $ref: "#/$defs/ProtocolStep/properties/executionMeta" }
      isOptional: { $ref: "#/$defs/ProtocolStep/properties/isOptional" }
      intent:
        $ref: "#/$defs/IntentStepPayload"

  IntentStepPayload:
    type: object
    additionalProperties: false
    required: [ semanticVerb ]
    description: >-
      The semantic content of an intent step. `semanticVerb` REUSES the existing
      SemanticVerbRef (a verb-definition record ref — the crosswalk's "Semantic
      operation"); never a bare string, never a second verb enum. `materialNeeds`
      carries SYMBOLIC role refs plus the capability this need presumes (the
      bead-beater arm, via the existing equipment-capability machinery).
      `constraints` mounts W2-2's constraint-object datatype (the typed
      Quantity/QuantityRatio binding point W2-2 §2.3 reserved for W2-3 — the
      datatype is $ref'd, never re-implemented here: no copied minimum/qualifier
      bounds). `provenance` points AT the SAID (the vendor-protocol-candidate
      record + document anchors); absence is lint-visible
      (intent-step-provenance-visible), never a silent vendor quotation. Symbolic
      refs only — never inline payloads, never concrete instances.
    properties:
      semanticVerb:
        $ref: "#/$defs/SemanticVerbRef"
      materialNeeds:
        type: array
        description: >-
          What this step needs, symbolically: a role reference plus the optional
          equipment capability the need presumes and the optional typed constraint
          bound to it.
        items:
          type: object
          additionalProperties: false
          required: [ need ]
          properties:
            need:
              type: string
              description: "Symbolic role reference (a roleId of this protocol's declared roles; closure is a lint concern, see protocol.lint.yaml R1 + the recorded intent-role gap)."
            capabilityRequirement:
              allOf:
              - $ref: "./datatypes/ref.schema.yaml"
              - oneOf:
                - type: object
                  properties:
                    kind: { const: record }
                    type: { const: equipment-capability }
                - type: object
                  properties:
                    kind: { const: ontology }
                    id:
                      type: string
                      pattern: "^CL:"
              description: >-
                The equipment capability this need presumes (CL:bead_beater arm).
                Mirrors constraint.schema.yaml's capabilityRequirement shape — the
                EXISTING equipment-capability machinery, no new prefix.
            quantityConstraint:
              $ref: "https://computable-lab.com/schema/computable-lab/registry/constraint.schema.yaml"
              description: >-
                The typed Quantity/constraint binding for this need (W2-2's
                constraint-object datatype, mounted by $ref-by-$id).
      constraints:
        type: array
        description: >-
          Constraints this step declares, each an instance of W2-2's
          constraint-object datatype (class id from the constraint vocabulary
          data, typed bound, symbolic subject, bindingKind seam, overridePolicy).
        items:
          $ref: "https://computable-lab.com/schema/computable-lab/registry/constraint.schema.yaml"
      provenance:
        type: array
        description: >-
          Evidence pointers for this intent: the SAID (vendor-protocol-candidate
          record) plus document anchors. Provenance as DATA attached to the
          record; derivation is never quoted as vendor truth.
        items:
          $ref: "#/$defs/StepProvenanceRef"
      intentNotes:
        type: string
        description: "Optional prose: why this step means what it means."

  StepProvenanceRef:
    type: object
    additionalProperties: false
    required: [ kind, type, id, pageStart ]
    description: >-
      MINIMAL step-level provenance ref: a record ref constrained to
      vendor-protocol-candidate plus the candidate-side anchor fields
      (mirrors vendor-protocol-candidate.schema.yaml $defs/Provenance shape
      without duplicating that datatype). Rung-agnostic by design — the
      provenance RUNGS are a separate admission (W2-4); this ref only says
      WHERE the evidence lives.
    allOf:
    - $ref: "./datatypes/ref.schema.yaml"
    - type: object
      properties:
        kind: { const: record }
        type: { const: vendor-protocol-candidate }
    properties:
      kind: { const: record }
      type: { const: vendor-protocol-candidate }
      id:
        type: string
        description: "The vendor-protocol-candidate (SAID) record id."
      label: { type: string }
      pageStart:
        type: integer
        minimum: 1
      pageEnd:
        type: integer
        minimum: 1
      sectionId: { type: string }
      spanStart:
        type: integer
        minimum: 0
      spanEnd:
        type: integer
        minimum: 0

  StepAddMaterial:
    type: object
    
    required: [ kind, target, wells, material ]
    # W2-3: a literal payload def can never coexist with `intent` — a step
    # carrying both fails this arm AND the closed IntentStep arm -> zero oneOf matches.
    not: { required: [ intent ] }
    # A dispensing step must express HOW MUCH: either a legacy absolute volume
    # OR a working concentration (the north star) that the compiler resolves to
    # stock/diluent volumes. Both allowed; neither optional-only.
    oneOf:
    - required: [ volume_uL ]
    - required: [ working_concentration ]
    properties:
      kind: { const: "add_material" }
      target:
        type: object
        additionalProperties: false
        required: [ labwareRole ]
        properties:
          labwareRole: { type: string }
      wells:
        $ref: "#/$defs/WellSelector"
      material:
        type: object
        additionalProperties: false
        required: [ materialRole ]
        properties:
          materialRole:
            type: string
          materialId:
            type: string
            description: "Optional: pin to a specific material concept instead of a role."
      # NORTH STAR — the final assay-well concentration of the active material
      # (e.g. fenofibrate 10 nM, whatever the stock). Reuses the existing
      # concentration datatype; see working-concentration-quantity.md.
      working_concentration:
        $ref: "./datatypes/concentration.schema.yaml"
      # ADVISORY authoring proxy — the dilution this step achieves (e.g. 1:2.5).
      # Never the invariant; the resolver uses working_concentration, not this.
      ratio:
        $ref: "./datatypes/reference-ratio.schema.yaml"
      volume_uL:
        $ref: "#/$defs/Expr"

  StepTransfer:
    type: object
    
    required: [ kind, source, target, volume_uL ]
    # W2-3: a literal payload def can never coexist with `intent` — a step
    # carrying both fails this arm AND the closed IntentStep arm -> zero oneOf matches.
    not: { required: [ intent ] }
    properties:
      kind: { const: "transfer" }
      source:
        type: object
        additionalProperties: false
        required: [ labwareRole, wells ]
        properties:
          labwareRole: { type: string }
          wells: { $ref: "#/$defs/WellSelector" }
      target:
        type: object
        additionalProperties: false
        required: [ labwareRole, wells ]
        properties:
          labwareRole: { type: string }
          wells: { $ref: "#/$defs/WellSelector" }
      # Optional target concentration of the transferred material in the
      # destination well (for transfers that dilute into a carrier).
      working_concentration:
        $ref: "./datatypes/concentration.schema.yaml"
      ratio:
        $ref: "./datatypes/reference-ratio.schema.yaml"
      volume_uL:
        $ref: "#/$defs/Expr"
      mappingHint:
        type: object
        description: "Optional authoring hint (not canonical) to generate concrete mappings."
        additionalProperties: true

  StepMix:
    type: object
    
    required: [ kind, target, wells ]
    # W2-3: a literal payload def can never coexist with `intent` — a step
    # carrying both fails this arm AND the closed IntentStep arm -> zero oneOf matches.
    not: { required: [ intent ] }
    properties:
      kind: { const: "mix" }
      target:
        type: object
        additionalProperties: false
        required: [ labwareRole ]
        properties:
          labwareRole: { type: string }
      wells: { $ref: "#/$defs/WellSelector" }
      cycles: { $ref: "#/$defs/Expr" }
      volume_uL: { $ref: "#/$defs/Expr" }

  StepWash:
    type: object
    
    required: [ kind, target, wells, cycles ]
    # W2-3: a literal payload def can never coexist with `intent` — a step
    # carrying both fails this arm AND the closed IntentStep arm -> zero oneOf matches.
    not: { required: [ intent ] }
    properties:
      kind: { const: "wash" }
      target:
        type: object
        additionalProperties: false
        required: [ labwareRole ]
        properties:
          labwareRole: { type: string }
      wells: { $ref: "#/$defs/WellSelector" }
      cycles: { $ref: "#/$defs/Expr" }
      washVolume_uL: { $ref: "#/$defs/Expr" }

  StepIncubate:
    type: object
    
    required: [ kind, target, duration_min ]
    # W2-3: a literal payload def can never coexist with `intent` — a step
    # carrying both fails this arm AND the closed IntentStep arm -> zero oneOf matches.
    not: { required: [ intent ] }
    properties:
      kind: { const: "incubate" }
      target:
        type: object
        additionalProperties: false
        required: [ labwareRole ]
        properties:
          labwareRole: { type: string }
      wells:
        description: "Optional subset; omit for whole labware."
        $ref: "#/$defs/WellSelector"
      duration_min: { $ref: "#/$defs/Expr" }
      temperature_C: { $ref: "#/$defs/Expr" }

  StepRead:
    type: object
    
    required: [ kind, target, modality ]
    # W2-3: a literal payload def can never coexist with `intent` — a step
    # carrying both fails this arm AND the closed IntentStep arm -> zero oneOf matches.
    not: { required: [ intent ] }
    properties:
      kind: { const: "read" }
      target:
        type: object
        additionalProperties: false
        required: [ labwareRole ]
        properties:
          labwareRole: { type: string }
      wells:
        description: "Optional subset; omit for whole labware."
        $ref: "#/$defs/WellSelector"
      modality:
        type: string
        enum: [ fluorescence, absorbance, luminescence, microscopy, ms, qpcr, other ]
      channels:
        type: array
        items: { type: string }
      instrumentRole:
        type: string
        description: "Optional role name (e.g., 'plate_reader')."
      settings:
        type: object
        description: "Optional declarative read settings (not device-specific code)."
        additionalProperties: true

  StepHarvest:
    type: object
    
    required: [ kind, source, wells ]
    # W2-3: a literal payload def can never coexist with `intent` — a step
    # carrying both fails this arm AND the closed IntentStep arm -> zero oneOf matches.
    not: { required: [ intent ] }
    properties:
      kind: { const: "harvest" }
      source:
        type: object
        additionalProperties: false
        required: [ labwareRole ]
        properties:
          labwareRole: { type: string }
      wells: { $ref: "#/$defs/WellSelector" }
      volume_uL: { $ref: "#/$defs/Expr" }
      producesArtifactId:
        type: string
        description: >
          Optional reference to a Protocol.producedArtifacts[].artifactId. When
          set, runs emit a material-derivation (or equivalent) record for this
          artifact on harvest.

  StepOther:
    type: object
    
    required: [ kind, description ]
    # W2-3: a literal payload def can never coexist with `intent` — a step
    # carrying both fails this arm AND the closed IntentStep arm -> zero oneOf matches.
    not: { required: [ intent ] }
    properties:
      kind: { const: "other" }
      description:
        type: string
