$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/scientist-intent.schema.yaml"
title: "ScientistIntent"
description: >
  Portable high-level scientist protocol intent. The small-LLM output contract:
  a closed-vocabulary list of high-level biology verbs/patterns with
  natural-language or numeric parameters and SYMBOLIC resource labels. Never
  contains resolved record IDs, deck slots, or low-level event primitives —
  those are owned by the deterministic compiler downstream.
type: object
additionalProperties: false
required:
- intentId
- actions

# Shared definitions: the closed 31-verb vocabulary is declared ONCE here and
# referenced by actions[].action AND unresolved[].actionLocation.action.
# The verb enum is the fabrication gate at the contract layer (SPINE-1): a
# fabricated action value anywhere in the document — including inside a
# clarification's argument-location — is rejected by Ajv.
$defs:
  actionVerb:
    type: string
    enum:
    # Simple biology verbs (simpleVerbs.ts expanders)
    - seed
    - incubate
    - mix
    - resuspend
    - dilute
    - shake
    - count
    - read
    - add_material
    - create_container
    - transfer
    - stain
    - fix
    - permeabilize
    - block
    - quench
    - label
    - transfect
    # Compound verbs
    - aliquot
    - wash
    - elute
    - harvest
    - passage
    - freeze
    - thaw
    # Centrifugation
    - spin
    - pellet
    # Geometric pattern macros (intent-layer unrolls geometry)
    - serial_dilution
    - media_swap_duplicate_columns
    - source_wells_to_duplicate_target_columns
    - repeat_rows
    - bead_beat

properties:
  intentId:
    type: string
    minLength: 1

  sourcePrompt:
    type: string

  actions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      unevaluatedProperties: false
      required:
      - action
      properties:
        action:
          $ref: '#/$defs/actionVerb'

        # ---- symbolic noun labels (NEVER resolved IDs) ----
        source:
          type: string
          minLength: 1
        sourceHint:
          type: string
        # SPINE-7: the wells fields carry EITHER an explicit address array OR a
        # single symbolic well-label (scalar form). The label form is what the
        # SPINE-3 engine's existing scalar arm binds (resolutionEngine doc-door
        # reads a trimmed string); the parse layer canonicalizes it. The array
        # branch is declared FIRST so every currently-valid array document
        # validates byte-identically.
        sourceWells:
          oneOf:
          - type: array
            items:
              type: string
          - type: string
            minLength: 1
        target:
          type: string
          minLength: 1
        targetHint:
          type: string
        targetWells:
          oneOf:
          - type: array
            items:
              type: string
          - type: string
            minLength: 1
        labware:
          type: string
          minLength: 1
        labwareHint:
          type: string

        # ---- expected-domain slots (SPINE-1 declaration ONLY) ----
        # Free-text domain tags naming WHICH KIND of thing an argument is
        # expected to be. Nothing consumes them yet: SPINE-2's vocabulary YAML
        # declares per-verb per-argument domains and SPINE-3's resolution engine
        # evaluates them. No knowledge-layer ontology-term validation fires here
        # (validating tags before their vocabulary exists would be a second
        # policy home, which the lint DSL header forbids).
        expectedSourceDomain:
          type: string
          minLength: 1
        expectedTargetDomain:
          type: string
          minLength: 1
        expectedLabwareDomain:
          type: string
          minLength: 1

        # ---- quantities / parameters ----
        source_name:
          type: string
        factor:
          type: number
        points:
          type: integer
          minimum: 2
        replicates:
          type: integer
          minimum: 1
        ratio:
          type: string
        volume: {}
        volumeUl:
          type: number
        cycles:
          type: integer
          minimum: 0
        duration:
          type: string
        temperatureC:
          type: number
        rpm:
          type: number
        material:
          type: string
        mode:
          type: string
        wavelength:
          type: string
        instrument:
          type: string
        assayId:
          type: string
        readout:
          type: string
        # SHORTHAND-COMP-4 Stage B: the DECLARED mixture-component slot. Each
        # entry names ONE component as a symbolic material noun; the
        # resolve_nouns pass binds every component and bars atomically (422) on
        # an unresolvable one. Concrete-instance objects are rejected BY
        # CONSTRUCTION: `material` is type string and additionalProperties:false
        # forbids kind/id/curie/recordId anywhere in an entry. During the
        # transition the open params.composition slot remains valid too — both
        # forms validate.
        composition:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            unevaluatedProperties: false
            required: [material, role]
            properties:
              material:
                type: string
                minLength: 1
                description: "Symbolic material noun (the scientist's words) — NEVER a concrete-instance object/ref."
              role:
                type: string
                enum: [solute, solvent, buffer_component, additive, activity_source, cells, other]
              fraction:
                type: string
              concentration:
                type: object
                additionalProperties: false
                required: [value, unit]
                properties:
                  value: { type: number }
                  unit: { type: string, minLength: 1 }
              count:
                type: number
              counterDensity:
                type: object
                additionalProperties: false
                required: [value, unit]
                properties:
                  value: { type: number }
                  unit: { type: string, minLength: 1 }
        params:
          type: object
          additionalProperties: true

  unresolved:
    type: array
    items:
      type: object
      additionalProperties: false
      unevaluatedProperties: false
      required:
      - label
      - reason
      properties:
        label:
          type: string
        reason:
          type: string
        # ---- argument-location identity (SPINE-1 contract extension) ----
        # WHERE in the document the clarification bites: which action (by index
        # and/or canonical verb) and which argument of it. All members optional;
        # `action` re-uses the SAME 31-verb enum ($defs/actionVerb) so a
        # fabricated canonical verb inside a clarification is rejected — the verb
        # enum is the fabrication gate at the contract layer.
        # Backward compat: absent today; parseScientistIntent.normalizeDocument
        # PRESERVES it on the parsed document (parse-level contract). The
        # normalizeScientistIntent unresolvedRefs boundary stays {kind,label,
        # reason} — candidates+actionLocation are dropped there (SPINE-1 Q1
        # ruling; SPINE-3's engine widens it).
        actionLocation:
          type: object
          additionalProperties: false
          unevaluatedProperties: false
          properties:
            actionIndex:
              type: integer
              minimum: 0
            action:
              $ref: '#/$defs/actionVerb'
            argument:
              type: string
              minLength: 1
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            unevaluatedProperties: false
            required:
            - label
            properties:
              label:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1