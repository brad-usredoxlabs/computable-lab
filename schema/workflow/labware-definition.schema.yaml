$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/labware-definition.schema.yaml"
title: "Labware Definition"
description: >
  Minimal robot-planning-focused labware definition. Can be imported from
  platform-native definitions (e.g., Opentrons) while preserving only fields
  needed for mapping, compatibility checks, and volume warnings.

type: object
additionalProperties: false
required:
  - kind
  - id
  - display_name
  # L2-ONTOLOGY-ANCHOR-SOURCES-1 (ldefsave-u1, DEFECT A): the create door
  # author-supplies only {name, author id, anchor, vendor}. recordId is SPINE
  # identity — knowledge kinds carry the AUTHOR's `id` (GC-16 D-A, never
  # client-minted) and the server derives recordId from it (extractRecordId
  # id-fallback). `type` is a const redundant with `kind`. `topology`/
  # `capacity` are optional import/authoring facts. All four STAY declared
  # and value-constrained below, so a complete import/seed still validates.

properties:
  kind:
    const: "labware-definition"
  recordId:
    type: string
  type:
    const: "labware_definition"
  id:
    type: string
    description: "Stable internal identifier."
  display_name:
    type: string
  # The create path injects these provenance keys into every payload before Ajv
  # validation (RecordHandlers.createRecord); declaring them keeps the strict
  # root from rejecting a server-built record. Not required — server-supplied.
  createdAt:
    type: string
  updatedAt:
    type: string
  createdBy:
    type: string
  vendor:
    type: string
  ontology_ref:
    type: object
    additionalProperties: false
    required: [ kind, id ]
    description: >-
      Optional ontology anchor (LWO CURIE) linking this labware definition to the
      Labware Ontology. Presence is required by the create flow, not by the schema.
      An unanchored record must record the absence explicitly rather than carry a
      lookalike term from another vocabulary.
    properties:
      kind:
        const: ontology
      id:
        type: string
        pattern: "^[A-Z][A-Za-z0-9]*:[0-9A-Za-z_.-]+$"
        description: "CURIE of the anchored LWO term (e.g., LWO:0000100)."
      # L2-ONTOLOGY-ANCHOR-SOURCES-1 (ldefsave-u1, DEFECT B): the ref widget
      # commits the CANONICAL ref object {kind, id, namespace, label, uri?}
      # (refSelectionValue.ts). Declaring the optional keys keeps the strict
      # additionalProperties:false from 422-ing them as Unknown properties.
      # `uri` is present only when the term carries an IRI.
      namespace:
        type: string
        description: "Ontology namespace (the CURIE prefix, e.g. LWO)."
      label:
        type: string
        description: "Human label of the anchored term as resolved by the ref widget."
      uri:
        type: string
        pattern: "^[a-zA-Z][a-zA-Z0-9+.-]*:[^\\s]*$"
        description: "IRI of the anchored term, present only when the source carries one."
  platform_aliases:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [ platform, alias ]
      properties:
        platform:
          type: string
          enum: [ opentrons_ot2, opentrons_flex, integra_assist_plus, generic ]
        alias:
          type: string
    uniqueItems: true
  read_only:
    type: boolean
    description: "Imported/vendor definitions should be marked true."
  offerable:
    type: boolean
    description: "True when this catalogue entry's id is a store recordId, i.e. the lab actually stocks it. Absent means NOT offerable: selecting it must open the create path prefilled, never present it as bindable stock."
  source:
    type: object
    additionalProperties: false
    properties:
      kind:
        type: string
        enum: [ imported, curated, user ]
      url:
        type: string
      hash:
        type: string
      version:
        type: string

  topology:
    type: object
    additionalProperties: false
    required: [ addressing ]
    properties:
      addressing:
        type: string
        enum: [ grid, linear, single ]
      rows:
        type: integer
        minimum: 1
      columns:
        type: integer
        minimum: 1
      linear_count:
        type: integer
        minimum: 1
      row_pitch_mm:
        type: number
        exclusiveMinimum: 0
      col_pitch_mm:
        type: number
        exclusiveMinimum: 0
      well_pitch_mm:
        type: number
        exclusiveMinimum: 0
      orientation_default:
        type: string
        enum: [ landscape, portrait ]
      orientation_allowed:
        type: array
        items:
          type: string
          enum: [ landscape, portrait ]
        uniqueItems: true

  capacity:
    type: object
    additionalProperties: false
    required: [ max_well_volume_uL ]
    properties:
      max_well_volume_uL:
        type: number
        exclusiveMinimum: 0
      min_working_volume_uL:
        type: number
        minimum: 0

  # Physical facts equipment acceptance keys on (equipment-capability
  # `constraints.accepts`). Height is what separates a standard plate from a
  # deepwell plate in a clamshell; the design family is what makes a plate the
  # RIGHT 384-well plate for a QuantStudio 5 — a well count alone cannot say that.
  height_class:
    type: string
    enum: [ standard, deepwell, tall ]
    description: >-
      How tall the vessel sits. A clamshell heater-shaker takes standard or
      deepwell SBS plates; a tall vessel fouls its lid.

  design_family:
    type: string
    description: >-
      CURIE of the vendor plate design, when the vessel's drawing matters
      (e.g. CL:thermo_384_pcr_design). Optional: most labware matches on footprint,
      height and well count alone.

  physical_geometry:
    type: object
    additionalProperties: false
    description: >-
      Optional physical geometry extracted from vendor or platform-native
      definitions. These fields are used for rendering, platform conversion,
      collision/clearance checks, and review. Omit unknown values rather than
      inventing them.
    properties:
      overall_dimensions_mm:
        type: object
        additionalProperties: false
        properties:
          length:
            type: number
            exclusiveMinimum: 0
          width:
            type: number
            exclusiveMinimum: 0
          height:
            type: number
            exclusiveMinimum: 0
      main_material:
        type: string
      main_color:
        type: string
      bottom_material:
        type: string
      bottom_color:
        type: string
      bottom_thickness_mm:
        type: number
        exclusiveMinimum: 0
      bottom_shape:
        type: string
      well_shape:
        type: string
      well_diameter_mm:
        type: number
        exclusiveMinimum: 0
      well_depth_mm:
        type: number
        exclusiveMinimum: 0
      well_length_mm:
        type: number
        exclusiveMinimum: 0
      well_width_mm:
        type: number
        exclusiveMinimum: 0
      deck_height_mm:
        type: number
        exclusiveMinimum: 0

  aspiration_hints:
    type: object
    additionalProperties: false
    properties:
      single_well_multichannel_source:
        type: boolean
        description: >
          If true, multichannel aspiration can intentionally use one source well/trough.
      per_channel_source_expected:
        type: boolean
      notes:
        type: string

  compatibility_tags:
    type: array
    items: { type: string }
    uniqueItems: true

  notes:
    type: string

  legacy_labware_types:
    type: array
    items:
      type: string
    description: "Legacy LabwareType enum values this definition satisfies."

  render_hints:
    type: object
    additionalProperties: true
    description: "Rendering hints for the labware definition."
