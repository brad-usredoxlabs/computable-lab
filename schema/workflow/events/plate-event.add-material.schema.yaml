$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/workflow/events/plate-event.add-material.schema.yaml"
title: "PlateEventAddMaterialDetails"
type: object
additionalProperties: false
required: [ wells ]

properties:
  labwareId:
    type: string
    description: "Target labware id in editor-native event graphs."

  labwareInstanceId:
    $ref: "../../datatypes/ref.schema.yaml"
    description: "Target labware instance ref in normalized/runtime payloads."

  wells:
    type: array
    minItems: 1
    items: { type: string }
    description: "Target wells."

  material_ref:
    $ref: "../../datatypes/ref.schema.yaml"
    description: "Material concept ref."

  material_spec_ref:
    $ref: "../../datatypes/ref.schema.yaml"
    description: "Reusable formulation/material-spec ref."

  aliquot_ref:
    $ref: "../../datatypes/ref.schema.yaml"
    description: "Explicit material instance ref."

  material_instance_ref:
    $ref: "../../datatypes/ref.schema.yaml"
    description: "Explicit general material instance ref."

  vendor_product_ref:
    $ref: "../../datatypes/ref.schema.yaml"
    description: "Commercial sourced product ref."

  materialId:
    $ref: "../../datatypes/ref.schema.yaml"
    description: "Deprecated legacy material ref field."

  formulation_kind:
    type: string
    description: "Biological intent of the formulation/specification used by this event."
    enum: [ single_active, defined_composition, complex_composition, biological_preparation ]

  material_source_requirement:
    type: object
    additionalProperties: false
    description: "Draft-time source requirement or enrichment facts. This records unresolved source/provenance needs without minting a concrete tube, aliquot, or material instance."
    required: [ status ]
    properties:
      status:
        type: string
        enum: [ unresolved, provided, linked ]
      material_ref:
        $ref: "../../datatypes/ref.schema.yaml"
      material_spec_ref:
        $ref: "../../datatypes/ref.schema.yaml"
      vendor_product_ref:
        $ref: "../../datatypes/ref.schema.yaml"
      source_ref:
        $ref: "../../datatypes/ref.schema.yaml"
      reason:
        type: string
      source_details:
        type: object
        additionalProperties: false
        properties:
          manufacturer: { type: string }
          vendor: { type: string }
          catalog_number: { type: string }
          lot_number: { type: string }
          expiration_date: { type: string, format: date }
          solvent_ref:
            $ref: "../../datatypes/ref.schema.yaml"
          concentration:
            oneOf:
            - $ref: "../../datatypes/concentration.schema.yaml"
            - $ref: "../../datatypes/amount.schema.yaml"
          ncbi_taxon_ref:
            $ref: "../../datatypes/ref.schema.yaml"
          uberon_tissue_ref:
            $ref: "../../datatypes/ref.schema.yaml"

  volume:
    type: object
    additionalProperties: false
    required: [ value, unit ]
    properties:
      value: { type: number, minimum: 0 }
      unit: { type: string }

  volume_uL:
    type: number
    minimum: 0
    description: "Deprecated legacy volume field."

  role:
    type: string
    description: "Optional semantic role for this material in the target context, e.g. cells, treatment, vehicle, additive, or control."

  concentration:
    oneOf:
    - $ref: "../../datatypes/concentration.schema.yaml"
    - $ref: "../../datatypes/amount.schema.yaml"
    description: "Optional concentration."

  composition_snapshot:
    type: array
    items:
      $ref: "../../datatypes/composition-entry.schema.yaml"
    description: "Optional component-level composition snapshot used for well-state replay."

  count:
    type: number
    exclusiveMinimum: 0
    description: "Optional count-based addition, e.g. cells."

  biological_type:
    $ref: "../../datatypes/ref.schema.yaml"
    description: "Resolved biological-type term ref (organism/cell-line type or strain). Determines which measure the add-material form asks for (cells/well vs worms/well vs CFU/mL vs OD600)."

  strain_ref:
    $ref: "../../datatypes/ref.schema.yaml"
    description: "Optional organism strain term ref (species→strain spine). Material instances record the strain."

  count_estimate:
    type: object
    additionalProperties: false
    description: "Honesty layer over a seed count: how the number was arrived at (mechanism) and that it is an estimate, not a verified fact. A later read event verifies/supports/refutes it."
    properties:
      measuredBy:
        type: string
        enum: [cell_counter, hemocytometer, od600, total_protein, hoechst_nuclei, manual]
        description: "Mechanism that produced the estimate."
      isEstimate:
        type: boolean
        default: true
        description: "A biological seed count is a best guess, not a hard fact."
      tolerancePct:
        type: number
        exclusiveMinimum: 0
        description: "Optional ± tolerance on the estimate (percent)."

  condition_refs:
    type: array
    items:
      $ref: "../../datatypes/ref.schema.yaml"
    description: "Culture-system/condition term refs (term.kind: condition) defining the material's culture context (anoxic, organ-on-a-chip, low-saline, ...). Orthogonal to biological type. Persisted to the material instance/derivation for provenance."

  counter_density:
    $ref: "../../datatypes/concentration.schema.yaml"
    description: "Optional source/counter density (count_per_volume, e.g. cells/uL) used to derive suspension volume = count / density and top-up = final − suspension."

  note:
    type: string

  instance_lot:
    type: object
    additionalProperties: false
    properties:
      vendor: { type: string }
      catalog_number: { type: string }
      lot_number: { type: string }

  notes:
    type: string
    description: "Deprecated legacy notes field."

  family:
    type: string
    enum: [material-movement, state-transformation, lifecycle, measurement, composition]
    description: "Event family per compiler-specs/20-event-graph-ir.md §3."
    default: material-movement

  preconditions:
    type: array
    description: "Reserved: predicate-DSL objects checked at plan-compile time (compiler-specs/20-event-graph-ir.md §6). Not validated in v1."
    items:
      type: object
      additionalProperties: true

  carryover_policy:
    type: string
    enum: [ignored, residual_fraction, per_tip_model]
    default: ignored
    description: "Reserved for v2 (compiler-specs/20-event-graph-ir.md §5.3). v1 treats all transfers as ignored."

anyOf:
  - required: [ material_ref ]
  - required: [ material_spec_ref ]
  - required: [ aliquot_ref ]
  - required: [ material_instance_ref ]
  - required: [ vendor_product_ref ]
  - required: [ materialId ]
