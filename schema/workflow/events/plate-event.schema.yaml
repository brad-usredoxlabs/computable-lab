$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://computable-lab.com/schema/computable-lab/datatypes/plate-event.schema.yaml"
title: "PlateEvent"
type: object
description: >
  Canonical semantic event that affects plate state or observes plate state. Plate state/layout is derived by replaying the time-ordered sequence of PlateEvents.

additionalProperties: false

required:
- eventId
- event_type
- details

properties:
  eventId:
    type: string
    description: "Stable event identifier (unique within the run/timeline)."

  event_type:
    type: string
    description: "Event verb."
    enum:
    - add_material
    - transfer
    - mix
    - wash
    - dilute
    - incubate
    - read
    - harvest
    - multi_dispense
    - macro_program
    - place_tube
    - move_tube
    - remove_tube
    - other
    - magnetize
    - magnetize_incubate
    - elute
    - resuspend
    - remove_supernatant
    - decant
    - discard

  at:
    type: string
    format: date-time
    description: "Actual execution timestamp, if known."

  t_offset:
    type: string
    description: "Optional planned time offset from run start (ISO-8601 duration, e.g. 'PT5M')."

  # --- MATRES-ATTEST §2e: retrospective occurrence time (Q8 triple) -------
  # `at:` and `t_offset` above are KEPT UNTOUCHED (byte-stable: every existing
  # compiler / well-state replay reads them, and the anyOf at the foot of this
  # file). The new triple only ANNOTATES attested occurrences; it does not
  # replace `at:` (the deliverable-(e) question "should occurredAt REPLACE at:"
  # was answered NO — byte-stability of every existing graph fixture outranks
  # elegance). Present-tense chains default known=today at DRAFT time (the
  # drafting layer, CHAIN/RECV, does the defaulting — validation never does).
  # Plate events are editor content inside an event-graph, not records: the
  # append-only wall does not apply to them; the immutability that matters
  # (Q4 "never rewrite history") lives on the `attestation` RECORD. Mutating a
  # graph event after an attestation pinned it means the pin
  # (attestation.against.graphRevision) no longer matches — the accept-time
  # re-check surfaces that as a conflict (Q3d reference-copy semantics).
  # [DEFAULT-PENDING-RATIFICATION: Q8]
  occurredAtStatus:
    type: string
    enum: [ known, approximate, unknown ]
    description: >
      Same terminal-honest triple as the attestation envelope (Q5/Q8):
      'unknown' is a complete answer. Validation never defaults or infers it.

  occurredAt:
    type: string
    format: date-time
    description: >
      When the asserted occurrence happened (retrospective annotation). Legal
      only with occurredAtStatus known|approximate — the pairing is a BUSINESS
      rule and lives as declared data in plate-event.lint.yaml (never a
      TypeScript branch); the schema stays purely additive so every existing
      graph fixture validates byte-identically.

  notes:
    type: string

  phase:
    type: string
    description: "Explicit compartment hint for well-state propagation: whether the material(s) affected by this event are in the free solution ('soluble') or immobilized on a solid phase ('adsorbed'). Absent defaults to 'soluble'. The well-state tracker NEVER infers this from context."
    enum: [ soluble, adsorbed ]

  details:
    description: "Event-type-specific payload."
    oneOf:
    - $ref: "./plate-event.add-material.schema.yaml"
    - $ref: "./plate-event.transfer.schema.yaml"
    - $ref: "./plate-event.mix.schema.yaml"
    - $ref: "./plate-event.wash.schema.yaml"
    - $ref: "./plate-event.incubate.schema.yaml"
    - $ref: "./plate-event.read.schema.yaml"
    - $ref: "./plate-event.harvest.schema.yaml"
    - $ref: "./plate-event.macro-program.schema.yaml"
    - $ref: "./plate-event.other.schema.yaml"

anyOf:
- required: [ "at" ]
- required: [ "t_offset" ]
