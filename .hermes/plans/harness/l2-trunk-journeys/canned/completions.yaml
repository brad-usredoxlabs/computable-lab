# Canned completions — DATA, not driver logic (ruling Q-B).
#
# The fake server (fake-inference.py) does ONLY the (journey, turn) lookup and
# the SSE/JSON framing. Every completion's CONTENT — the scientist-intent
# shorthand YAML, the protocol_edit ops, the intentId — lives HERE.
#
# Keying: the server reads the last user message of the /chat/completions body.
#   * journey = the entry whose `prompt_contains` substring appears in the user
#     content (the journey ask, declared in journeys/J*.yaml steps).
#   * turn    = 2 iff the content carries the product's "[Answered clarifications]"
#     marker (appendClarificationAnswersToPrompt, AgentOrchestrator.ts:261-275),
#     else 1.
# The model writes ONLY shorthand / protocol_edit ops — it never writes events
# (the deterministic compiler owns event-graph expansion). A fixed intentId on
# BOTH turns is what makes the J2 answer-turn intentId stability deterministic.

model: l2trunkj-fake

journeys:
  # J1 — deck surface, "mix all wells that have material". The live-proven
  # shorthand (rendered the green intent card 20261101T034018Z) verbatim:
  # one mix action over the symbolic wellset token.
  J1:
    prompt_contains: "mix all wells"
    turn1:
      intent: event_shorthand
      shorthand: |
        intentId: mix-all-wells-with-material
        actions:
          - action: mix
            wells: all-wells-containing-materials

  # J2 — clarification round trip. Turn 1 carries the 50/50/10 (110%)
  # composition that the DETERMINISTIC compiler turns into the
  # composition-fraction-sum reading card (whole-mixture-supplement reading —
  # pinned by compositionFractions.test.ts:32-78); the model only writes the
  # shorthand. The deck seed has NO placed plate, so the turn-1 shorthand
  # creates the 96-well plate first (mirrors the live-proven green sample
  # 20261101T034018Z). Turn 2 is the RESOLVED reading (45/45/10, sums to 100)
  # so a non-fold model call still compiles to a clean answer with the SAME
  # intentId and no re-ask. intentId is IDENTICAL on both turns: that is the
  # stability the D3 assertion pins, now made deterministic instead of a
  # sampler lottery.
  J2:
    prompt_contains: "Trypsin-EDTA"
    turn1:
      intent: event_shorthand
      shorthand: |
        intentId: add-trypsin-dmem-fbs
        sourcePrompt: "Add 100uL of 50/50 Trypsin-EDTA/DMEM with 10% FBS to wells A2:H6"
        actions:
          - action: create_container
            labware: "96-well plate"
          - action: add_material
            labware: "96-well plate"
            volumeUl: 100
            targetWells: [A2:H6]
            composition:
              - { material: "Trypsin-EDTA", role: other, fraction: "50%" }
              - { material: "DMEM", role: buffer_component, fraction: "50%" }
              - { material: "FBS", role: additive, fraction: "10%" }
    turn2:
      intent: event_shorthand
      shorthand: |
        intentId: add-trypsin-dmem-fbs
        sourcePrompt: "Add 100uL of 50/50 Trypsin-EDTA/DMEM with 10% FBS to wells A2:H6"
        actions:
          - action: add_material
            labware: "96-well plate"
            volumeUl: 100
            targetWells: [A2:H6]
            composition:
              - { material: "Trypsin-EDTA", role: other, fraction: "45%" }
              - { material: "DMEM", role: buffer_component, fraction: "45%" }
              - { material: "FBS", role: additive, fraction: "10%" }

  # J3 — protocol-edit via chat. step-lyse exists on the scratch copy
  # (XDR-JOURNEYS-3, a copy of XDR-w28-gate0001). The op sets the step's label
  # to the asserted string so the expectedSha round trip lands the write.
  J3:
    prompt_contains: "step-lyse"
    turn1:
      intent: protocol_edit
      ops:
        - op: step_update
          stepId: step-lyse
          label: "Lyse the sample (journeys J3)"
