kind: claim
id: CLM-acac-causes-nadh-os
title: Acetoacetate causes NADH oxidative stress
statement: >
  Exogenous acetoacetate drives the mitochondrial NADH pool down via
  β-hydroxybutyrate dehydrogenase (AcAc + NADH → BHB + NAD+),
  producing NADH oxidative stress.
