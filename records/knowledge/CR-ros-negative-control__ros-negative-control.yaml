$schema: https://computable-lab.com/schema/computable-lab/context-role.schema.yaml
kind: context-role
id: CR-ros-negative-control
title: ROS negative control
name: ROS negative control
description: >
  A context whose contents do not drive ROS production (often an
  uncoupler that dissipates mitochondrial proton gradient and reduces
  ROS). Used to bound the ROS readout channel's low end.
applicable_domains:
  - ros-assay
prerequisites:
  - any:
    - has_material:
        ref:
          kind: ontology
          id: CHEBI:75441
          namespace: CHEBI
          label: FCCP
expected_outcome:
  direction: decreased
  measure: ros_level
  relative_to: ros_positive_control
