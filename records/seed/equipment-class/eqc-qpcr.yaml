$schema: https://computable-lab.com/schema/computable-lab/equipment-class.schema.yaml
kind: equipment-class
id: EQC-QPCR
name: qPCR Machine
settingsDefinition:
  - key: anneal_temperature_c
    label: Anneal temperature
    valueType: number
    unit: "°C"
  - key: cycling_program
    label: Cycling program
    valueType: profile
    profileDefinition:
      initial:
        temperature_c: 95
        duration_sec: 180
      cycles:
        count: 40
        steps:
          - temperature_c: 95
            duration_sec: 5
          - temperature_c: 60
            duration_sec: 30
notes: >-
  qPCR takes a 96-well PCR plate in its bay — acceptance is capability data
  (ECP-QPCR: seat `bay`, one 96-well plate), so a tube or a 384-well plate is
  rejected. Its run is a multi-step
  cycling program (declared in profileDefinition): an initial hold, then N cycles
  each with a denature + anneal/extend step.