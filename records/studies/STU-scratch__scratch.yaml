# Scratch study — the workspace landing place for legacy /event-editor
# routes that point at graphs with no resolvable parent study. Phase 10's
# redirect helper falls through to this study when the lookup chain
# (event-graph → run → experiment → study) doesn't yield a study, and the
# no-params /event-editor entrypoint also routes here.
#
# This is intentionally a real record so the workspace shell, Browse tab,
# and topbar tab strip all work the same way they do for any study —
# nothing in the workspace code path special-cases STU-scratch.
$schema: "https://computable-lab.com/schema/computable-lab/study.schema.yaml"

kind: study
recordId: STU-scratch
title: Scratch
shortSlug: scratch

state: draft

description: >
  Workspace scratch pad. Holds in-flight drafts and any artifacts ingested
  before they're filed under a real study. Safe to add experiments / runs
  here for quick exploration; promote them by editing the studyId on the
  record when they belong to a longer-lived study.

tags:
- scratch
- workspace-default
