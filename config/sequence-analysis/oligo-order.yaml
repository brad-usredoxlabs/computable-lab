# Vendor spelling and page layout belong in data. Unknown modifications remain visible for review.
#
# Every line of the extracted text is tested against each declared format, in order.
#   namePattern     — sets the current oligo label and resets the open row
#   sequencePattern — creates a row from capture group 1, labelled with the current label
# A document may mix formats (e.g. a certificate of analysis after an order summary);
# the first matching pattern in the list wins for each line.
formats:
  # Certificate-of-analysis / labeled fields: "Primer Name: X" then "Sequence (5'to 3): ...".
  # The name may share its line with a trailing column ("Primer Length: 24").
  - id: labeled-fields
    namePattern: '^(?:Oligo\s+Name|Name|Primer\s+Name|Probe\s+Name)\s*[:\t]\s*(.+?)(?:\s+Primer\s+Length\b.*)?$'
    sequencePattern: '^(?:Sequence|Oligo\s+Sequence)\s*(?:\([^)]*\))?\s*[:\t]\s*(.+)$'
  # Invitrogen order-summary table: a "N <cat#> - DNA <name> for <researcher> ... bases N"
  # line followed by a "<lot#> <well> BASES" line.
  - id: invitrogen-order-summary
    namePattern: '^\s*\d+\s+\d{6,}\s*-\s*DNA\s+(.+?)\s+for\b'
    sequencePattern: '^\s*\d{6}\s+\S+\s+([ACGTRYSWKMBDHVN\s]+?)\s*$'
  # Biosystems/IDT-style modified-oligo table: the name and a dye-wrapped sequence share
  # one line ("30 Pass Oformi_1784_ABY |ABY-CAC CGT ... GTC A-QSY 28 ...").
  - id: dye-wrapped-row
    namePattern: '^\s*\S+\s+Pass\s+([A-Za-z0-9_.\-]+)'
    sequencePattern: '^\s*\S+\s+Pass\s+\S+\s+\|?([A-Za-z0-9\- ]+?)\s+\d+\s+\d+'
# Chemistry/orientation noise stripped from a captured sequence before alphabet validation.
sequenceNoise:
  - '^\s*\((?:DNA|RNA|LNA|MOE|2OMe|MOD)\)\s*[-–]?\s*'
modifications:
  - { pattern: '(?:/56-FAM/|/6-FAM/|\[FAM\]|\(FAM\)|^FAM[- ])', label: FAM, role: reporter, position: 5-prime }
  - { pattern: '(?:/3BHQ_1/|\[BHQ-?1\]|\(BHQ-?1\)|[- ]BHQ-?1$)', label: BHQ-1, role: quencher, position: 3-prime }
  - { pattern: '(?:\[MGBNFQ\]|\(MGBNFQ\)|[- ]MGBNFQ$)', label: MGBNFQ, role: quencher, position: 3-prime }
  - { pattern: '^VIC[- ]', label: VIC, role: reporter, position: 5-prime }
  - { pattern: '^ABY[- ]', label: ABY, role: reporter, position: 5-prime }
  - { pattern: '[- ]QSY$', label: QSY, role: quencher, position: 3-prime }
metadata:
  vendor: '^(?:Vendor|Supplier)\s*:\s*(.+)$'
  orderId: '^(?:Order\s*(?:Number|No\.?|ID)|Order\s*#)\s*[:#]?\s*(.+)$'
  purification: '^Purification\s*:\s*(.+)$'
  synthesisScale: '^(?:Scale|Synthesis\s+Scale)\s*:\s*(.+)$'
  # How many line items the document itself claims ("ITEMS: 4", "QTY 4", "Total Items: 4").
  # Anchored (\d+)\s*$ so price lines ("Total Amount: $12.34") never match;
  # case-insensitivity comes from the loader's new RegExp(pattern,'i').
  declaredItemCount: '^(?:ITEMS?|QTY|Total(?:\s+Items)?)\s*[:#]?\s*(\d+)\s*$'

# When the deterministic read cannot account for the document, offer the AI read.
# The trigger is DATA — the predicate lives here, not in TypeScript.
aiFallback:
  enabled: true
  # offer the AI read when: no rows at all | any row carries an issue (the lowerer's
  # unreadable-row arm always produces one) | fewer rows than the document declares
  offerWhen: [ no-rows, any-issue, declared-count-mismatch ]
  # manual = a later item's UI offers the action; auto reserved (not implemented here)
  mode: manual
  maxContextChars: 12000
  maxTokens: 4000
  # json_object = the repo's proven call form (8 call sites); json_schema reserved for
  # endpoints proven to honor it (zero call sites today) — Ajv is the authority either way
  responseFormat: json_object
ocr:
  enabled: true
  rasterizer: pdftoppm
  executable: tesseract
  language: eng
  dpi: 200
  maxPages: 20
  timeoutSeconds: 120
