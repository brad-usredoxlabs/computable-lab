manifestVersion: "1.0.0"

paneVocabulary:
  - ai-chat
  - event-editor
  - deck
  - project-tabs
  - collection-list

surfaces:
  - id: run-workspace
    route: "/runs/:runId"
    panes:
      - ai-chat
      - event-editor
      - deck
    requires:
      providers: [deck]
    context:
      scope_source: loaded-record-id
    gate:
      leg: null
      reason: "Browser gate for run-workspace surface still owed — J1 journey needs live probe evidence"
    description: "Run workspace — executes a run against a revision, shows output artifacts and chat."

  - id: event-editor
    route: "/runs/:runId/event-editor"
    panes:
      - ai-chat
      - event-editor
      - deck
    requires:
      providers: [deck]
    context:
      scope_source: loaded-record-id
    gate:
      leg: null
      reason: "Browser gate for event-editor surface still owed — J1 journey needs live probe evidence"
    description: "Event editor — standalone deck host for event graphs with chat and deck viewer."

  - id: analysis
    route: "/analysis"
    panes:
      - ai-chat
      - project-tabs
    context:
      scope_source: none
    gate:
      leg: null
      reason: "Browser gate for analysis surface still owed — journey leg not yet implemented"
    description: "Analysis surface — method authoring, run execution, and artifact viewing with AI assistance."

  - id: project-deck-tab
    route: "/project/:studyId"
    panes:
      - ai-chat
      - deck
    context:
      scope_source: route-param
    gate:
      leg: null
      reason: "Browser gate for project-deck-tab surface still owed — no live probe evidence for this host yet"
    description: "Project deck tab — study workspace door rendering the deck chat slice; also served at /project/:studyId/event-graph/:eventGraphId."

  - id: record-host
    route: "/record/:recordId"
    panes:
      - ai-chat
    context:
      scope_source: loaded-record-id
    gate:
      leg: null
      reason: "Browser gate for record-host surface still owed — no live probe evidence for this host yet"
    description: "Record host — record-by-id editor with thread-scoped chat; also served at /record/new/:nodeType/:parentId?."

  - id: artifact-host
    route: "/artifact/:kind/:artifactId"
    panes:
      - ai-chat
    context:
      scope_source: loaded-record-id
    gate:
      leg: null
      reason: "Browser gate for artifact-host surface still owed — no live probe evidence for this host yet"
    description: "Artifact host — artifact viewer with thread-scoped chat."

  - id: registry-host
