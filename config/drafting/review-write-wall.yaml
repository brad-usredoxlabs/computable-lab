# W2-89 g2b-1/2 — the review-panel WRITE-WALL refusal policy (deterministic).
#
# The browser gate (2026-10-11_0110-g2b) proved model discretion FAILS TWICE on
# both negatives: "rewrite the vendor text on page 2" and "relabel step-lyse-a
# provenance as vendor truth" each surfaced an actionable Apply/Accept card
# instead of failing visibly. The orchestrator ruling: the refusal must be
# DETERMINISTIC — the server recognizes a wall-crossing ask (or a wall-crossing
# op) and returns an honest refusal envelope INSTEAD of a proposal payload.
#
# Like shorthand-drafting.yaml: membership and predicates are DATA, loaded PER
# call (never process-cached); server/src/ai/reviewWriteWall.ts INTERPRETS them
# and contains ZERO surface-name or phrase literals (repo rule #1). Absent file
# => the wall is OFF (no refusal), never a TypeScript default mirroring a phrase.
#
# Semantics:
# - `surfaces` — the AI surface ids the wall guards (membership is data).
# - `matching` — how an ask wall matches (advc-W289-l2t0525 DEFECT-1/2). The ask
#   wall is a CONSTRUCTION predicate, not a word bag:
#     * OBJECT GOVERNANCE: the wall fires only when the wall verb GOVERNS the
#       declared referent as its OBJECT — the noun must follow the verb within
#       `maxGapWords` words. An ask that merely MENTIONS the source artefact
#       further away in the sentence ("change step 3 to match the vendor text on
#       page 2") changes something PERMITTED and is never walled.
#     * TURN-FORM EXEMPTION: an interrogative turn is a question ABOUT the wall,
#       not an instruction to cross it. `interrogativePatterns` are DATA; the
#       interpreter additionally exempts a turn ending in '?' structurally
#       (punctuation, not a phrase).
#   Both halves of a wall (verb AND noun) are still required. TWO governance
#   triggers fire: ADJACENCY (the noun starts within maxGapWords words after a
#   verb occurrence) AND LEADING-VERB (advc-W289-c2 DEFECT-1/2: when the turn's
#   first token — after stripping an interrogative/polite prefix and any
#   trailing '?' — is one of the wall's verbs, that verb governs any declared
#   referent that follows ANYWHERE in the turn; distance cannot be an evasion.
#   A blocker word (`leadingVerb.blockerWords`) between the verb and the
#   referent makes the referent a MENTION, not the object). The interrogative
#   exemption is evaluated on the STRIPPED remainder: an opening negation
#   (`negationTokens`) exempts the wall; a modal/polite prefix stripped by
#   `interrogativeStripPatterns` exposes the imperative underneath.
#   The refusal fires BEFORE any model call: zero inference, zero writes, no
#   proposal payload reaches the client. The ask wall reads the user's ask AND
#   the clarification-appended prompt (W2-89 cycle-3 / advc-W289-c2 DEFECT-3:
#   after structural governance, only wall-crossing CONSTRUCTIONS fire, so an
#   honest picker answer cannot trip it while an answer that IS an imperative
#   carrying a referent is refused). The structured-payload half of the wall is
#   `opsWall`.
# - `askWalls` — the declared wall-crossing asks. The verbs are the
#   wall-crossing CONSTRUCTIONS only: ordinary MEANT-editing verbs
#   (change/edit/update/fix/reword/modify/replace/…) are NOT listed on
#   said-vendor-rewrite, because they are the verbs of legitimate draft work and
#   object governance — not the verb list — is what separates "rewrite the
#   vendor text" from "change step 3 to match the vendor text".
# - `opsWall` — defense-in-depth at the protocol_edit branch: an op object
#   carrying any `forbiddenFields` key is a provenance-falsification attempt
#   (provenance/source_artifact are record structure, never chat-editable).
#   The schema envelope's unevaluatedProperties:false stays the structural half;
#   this is the honest-wording half. The op vocabulary is NOT extended.
surfaces: [protocol-review]
matching:
  # Words allowed between the wall verb and the START of the referent it
  # governs. 1 covers a determiner ("rewrite the vendor text"), 2 a named
  # target ("relabel step-lyse-a provenance"), 3 a qualified object
  # ("promote the draft without authorization"). A referent further away is a
  # MENTION, not the object of the change, and never fires.
  maxGapWords: 3
  interrogativePatterns:
    - "^(who|what|when|where|why|how|whether|can|could|should|would|will|do|does|did|is|are|was|were)\\b"
    - "\\b(why|how) (can|cannot|can't|could|do|does|are|is)\\b"
    - "\\b(what|which) (is|are|does|do|should)\\b"
    - "\\b(explain|tell me) (why|what|how)\\b"
  # LEADING-VERB GOVERNANCE (advc-W289-c2 DEFECT-1/2): when the turn's first
  # token (after stripping an interrogative/polite prefix and any trailing '?')
  # is one of the wall's verbs, the verb governs any declared referent that
  # follows ANYWHERE in the turn — distance cannot be an evasion. The referent
  # is unreachable when a blocker word sits between the verb and the referent
  # (a competing clause "rewrite the step so it reflects the vendor document"
  # is a MENTION, not the object).
  leadingVerb:
    blockerWords: [to, so, such, that, which, who, because, since, while, and, but, then, or, if, when]
  # Prefixes stripped before the leading-verb test (DATA; polite/modal shapes,
  # so "can you rewrite…" is an imperative in question dress).
  interrogativeStripPatterns:
    - "^(can|could|would|will|shall) (you|u) (please|kindly)? ?"
    - "^(please|kindly) +"
    - "^(who|what|when|where|why|how) (can|could|should|would|will|do|does|did|is|are|was|were) (you)?"
  # An interrogative remainder OPENING with a negation is a question ABOUT the
  # wall and is exempt (DEFECT-1 c1 boundary, preserved).
  negationTokens: [not, no, never, cannot, "can't", "cannot"]
askWalls:
  - id: said-vendor-rewrite
    code: SAID_IMMUTABLE
    message: >-
      The vendor document (SAID) is immutable — chat cannot rewrite vendor text.
      Edits apply only to the semantic draft (MEANT). No proposal was offered
      and nothing was written.
    # Only the SAID-REWRITE construction: verbs that mean "author the source
    # artefact's own text". Ordinary MEANT verbs are deliberately absent
    # (advc-W289-l2t0525 DEFECT-1).
    verbs:
      - rewrite
      - overwrite
      - retype
      - recopy
      - redraft
      - transcribe
      - restate
    # Only referents that ARE the vendor/SAID artefact. Generic non-SOID
    # referents (`page \d+`, `the pdf`, `source document`, `original text`,
    # `original document`) are deliberately absent: they name the source without
    # making it the object of the change, so they swallowed legitimate MEANT
    # asks (advc-W289-l2t0525 DEFECT-1).
    nouns:
      - vendor text
      - vendor's text
      - vendors text
      - vendor wording
      - vendor document
      - vendor pdf
      - vendor page
      - vendor protocol
      - source text
      - said text
  - id: provenance-falsification
    code: PROVENANCE_FALSIFICATION
    message: >-
      Provenance cannot be relabelled — an inference cannot be recorded as
      vendor truth (SAID). No proposal was offered and nothing was written.
    verbs:
      - relabel
      - relabelled
      - remap
      - reclassify
      - mark
      - mark it
      - record
      - records
      - label
      - claim
      - assert
      - encode
      - present
      - pass off
      - falsify
      - change
      - rewrite
      - edit
      - set
    nouns:
      - provenance
      - source_artifact
      - source artifact
      - vendor truth
      - vendor-truth
      - vendor-stated
      - vendor stated
      - as vendor
      - inference as
      - inferred as
      - vendor-sourced
      - vendor sourced
  # Criterion 2 names FIVE negatives that must ALL fail visibly; (e) retarget is
  # already refused deterministically client-side (protocolId mismatch -> named
  # refusal, ReviewAiPanel bait 3). These two walls complete the set for (c)
  # bypass-validation and (d) promote-unauthorized with the same mechanism.
  - id: bypass-validation
    code: VALIDATION_CANNOT_BE_BYPASSED
    message: >-
      Validation cannot be bypassed — every draft write rides the record
      schema and lint gates. No proposal was offered and nothing was written.
    verbs:
      - bypass
      - skip
      - ignore
      - circumvent
      - override
      - force
      - write
      - save
      - commit
    # The gate being bypassed, not the word "validation": a bare `validation`
    # noun fired on "write the validation results into the notes", which is an
    # ordinary note-taking ask (advc-W289-l2t0525 DEFECT-1).
    nouns:
      - validation gate
      - validation gates
      - validation checks
      - validation and write
      - validation or write
      - lint gate
      - lint
      - schema check
      - verification
  - id: promote-unauthorized
    code: PROMOTION_NOT_ON_THIS_SURFACE
    message: >-
      Promotion is a QMS lifecycle action requiring review and signatures —
      this review chat cannot promote or publish anything. Nothing was written.
    verbs:
      - promote
      - publish
      - finalize
      - sign
      - merge
    nouns:
      - promote
      - promotion
      - without authorization
      - without authorisation
      - unauthorized
      - unauthorised
      - without review
      - skip review
      - bypass review
opsWall:
  code: PROVENANCE_FALSIFICATION
  message: >-
    The proposal carries a provenance/source field — provenance is record
    structure, never a chat-editable property, and an inference cannot be
    relabelled as vendor truth (SAID). No proposal was offered and nothing was
    written.
  forbiddenFields:
    - provenance
    - source_artifact
    - sourceArtifact
    - vendorTruth
    - vendor_truth
    - vendor-truth
    - rung
    - ladder
  # W2-89 cycle-3 (architect decision FIX-4): the only expressible payload-side
  # rule — a proposal whose `protocolId` override names a vendor-protocol-
  # candidate (CAN-, the SAID shape already declared in
  # schema/workflow/protocol.lint.yaml) targets an immutable record. Chat edits
  # apply only to the MEANT draft. Absent `targetIdRules` => no target rule
  # (absent = OFF, the standing contract).
  targetIdRules:
    - pattern: "^CAN-"
      code: SAID_IMMUTABLE
      message: >-
        The proposal targets a vendor-protocol-candidate (SAID) record — chat
        edits apply only to the semantic draft (MEANT). No proposal was offered
        and nothing was written.
