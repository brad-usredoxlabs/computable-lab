# Only side-effect-free authoring operations may use the staged authoring adapter.
adapters:
  sequence-authoring:
    domain: sequences
    operations: [save_sequence, create_oligo]
    projection:
      sequence: sequence
      modifications: modifications
      vendor: vendor
  # PB-CH-2: tier-2 workstate proposals. Projection-only: the projection map is
  # the intent echo (empty here); the compiled session document rides in the
  # compile/accept `result`. Kind→tab policy lives in workstate-tab-kinds.yaml.
  workstate:
    domain: workstate
    operations: [compose-workstate]
    projection: {}
  # PB-CH-5: analysis proposals compiled onto the EXISTING analysis-revision →
  # analysis-run → analysis-output-artifact → view-spec chain. At most ONE
  # staged `analysis-run` create (status `queued`, initiator = the actor); the
  # compiled session document rides in the compile/accept `result` like the
  # workstate adapter. Kind policy: workstate-tab-kinds.yaml (landing tabs) +
  # analysis-composition.yaml (this adapter's own reference/id policy).
  analysis:
    domain: analysis
    operations: [compose-analysis]
    projection: {}
  # QMS7-7 (OQ-1 ruling A, the ONE sanctioned block of this item): record-drafting
  # proposals compile a model intent into a full record envelope and stage AT MOST
  # ONE create through the staging store (real schema validate + lint run at
  # compile time; nothing durable before the reviewHash-verified accept). The
  # compiled card document (recordFields + landing sessionDocument) rides in the
  # compile/accept `result` like the workstate/analysis adapters; the accept write
  # rides the EXISTING accept loop. Field vocabulary: the target schema + its
  # *.ui.yaml projection (never TS literals). Kind→schema resolution reads each
  # schema's properties.kind.const; the staged id derives from the schema's
  # declared properties.id.pattern.
  record-drafting:
    domain: registry-records
    operations: [compose-record]
    projection: {}
