# Only side-effect-free authoring operations may use the staged authoring adapter.
adapters:
  sequence-authoring:
    domain: sequences
    operations: [save_sequence, create_oligo]
    projection:
      sequence: sequence
      modifications: modifications
      vendor: vendor
  # PB-CH-2: tier-2 workstate proposals. Projection-only: the projection map is
  # the intent echo (empty here); the compiled session document rides in the
  # compile/accept `result`. Kind→tab policy lives in workstate-tab-kinds.yaml.
  workstate:
    domain: workstate
    operations: [compose-workstate]
    projection: {}
  # PB-CH-5: analysis proposals compiled onto the EXISTING analysis-revision →
  # analysis-run → analysis-output-artifact → view-spec chain. At most ONE
  # staged `analysis-run` create (status `queued`, initiator = the actor); the
  # compiled session document rides in the compile/accept `result` like the
  # workstate adapter. Kind policy: workstate-tab-kinds.yaml (landing tabs) +
  # analysis-composition.yaml (this adapter's own reference/id policy).
  analysis:
    domain: analysis
    operations: [compose-analysis]
    projection: {}
  # QMS7-7 (OQ-1 ruling A, the ONE sanctioned block of this item): record-drafting
  # proposals compile a model intent into a full record envelope and stage AT MOST
  # ONE create through the staging store (real schema validate + lint run at
  # compile time; nothing durable before the reviewHash-verified accept). The
  # compiled card document (recordFields + landing sessionDocument) rides in the
  # compile/accept `result` like the workstate/analysis adapters; the accept write
  # rides the EXISTING accept loop. Field vocabulary: the target schema + its
  # *.ui.yaml projection (never TS literals). Kind→schema resolution reads each
  # schema's properties.kind.const; the staged id derives from the schema's
  # declared properties.id.pattern.
  record-drafting:
    domain: registry-records
    operations: [compose-record]
    projection: {}
    # QMS7-7 FIX1 (adv-review D2): the landing tab kind is DATA, not a TS
    # literal. The compiled landing document (the surface the accepted record
    # proposal re-focuses) reads landing.tabKind from this block — the same
    # per-call adapters.yaml load the adapter itself uses. tabKind must be a
    # lab-session tab kind (schema/workflow/lab-session.schema.yaml enum).
    # An absent landing key fails the compile honestly with a
    # LANDING_TAB_KIND_UNDECLARED diagnostic — the compiler never defaults a
    # surface.
    landing:
      tabKind: registry
    # QMS7-7 FIX-2 (architect RULING OPTION A): this adapter's single staged
    # create is HUMAN-REVIEWED, not a machine auto-create. Nothing is durable
    # until a human reads the card and clicks Accept, and the write rides the
    # accept loop's full policy re-evaluation (reviewHash re-check, kernel
    # re-run, owner-policy, audit). The flag tells the staged-authoring
    # compile pass to bind that staged create as a human-reviewed create, so
    # the kernel's new-record -> auto-create default (the machine-deposition
    # class that allowAutoCreate:deny exists to stop) is NOT requested for it.
    # Absent this flag every adapter keeps the auto-create classification
    # exactly as before; the material/protocol auto-deposition paths are
    # untouched.
    humanReviewedCreate: true
  # MATRES-RECV (OQ-2 ratified): the receiving attestation adapter. ONE
  # elicited intent (compose_receiving on the ONE forced agent_intent tool)
  # compiles into the attestation envelope + TWO staged creates — the
  # immutable material-receiving receipt AND the material-instance it brings
  # into custody — through the staging store (the REAL schema validate + lint
  # run at compile; nothing durable before the reviewHash-verified accept).
  # Business walls (lot-requires-product, receivedBy pairing, chain wall) are
  # material-receiving.lint.yaml DATA — the staging create refuses a blocked
  # payload and the pipeline records it as needs-missing-fact with
  # canAccept:false (the generic gate, not an adapter-name branch). The
  # staged creates are HUMAN-REVIEWED like record-drafting: nothing is
  # durable until a scientist reads the card and clicks Accept. A correction
  # stages ONLY the corrected receipt (supersession is never a second
  # arrival).
  receiving:
    domain: receiving
    operations: [compose-receiving]
    projection: {}
    humanReviewedCreate: true
  # MATRES-CHAIN (OQ-1(a)/OQ-2(b)/OQ-3(a) rulings): the execute-chain attestation
  # adapter. ONE elicited intent (compose_execute_chain on the ONE forced
  # agent_intent tool) compiles the chain record-graph — material-derivation
  # (preparation) + the prepared material-instance + N aliquots + ONE
  # attestation-chain envelope (the FULFIL fulfillment claims ride INSIDE the
  # same envelope; zero new kinds, zero new envelopes) — through the staging
  # store (the REAL schema validate + lint run at compile; nothing durable
  # before the reviewHash-verified accept). Business walls (mixed-parentage
  # orphan shape, the elicitation wall, the occurred pairings, the OQ-1(a)
  # cross-session consumption refusal, the shipped chain-no-proposed wall) are
  # schema/workflow/chain-draft.lint.yaml + schema/lab/attestation.lint.yaml
  # DATA; the arithmetic ACs (aliquot volumes sum <= prepared volume, the count
  # reconcile) are config/drafting/execute-chain-arithmetic.yaml DATA via the
  # pure compile-time evaluator (OQ-2 ruling (b) — the named missing lint
  # predicate is a follow-up capability item, NOT a lint-v1 edit). A blocked
  # wall surfaces as needs-missing-fact with canAccept:false (the generic gate,
  # not an adapter-name branch). ALL ids are deterministic seed-hashes over
  # (draft content, plan coordinate) — a re-draft of identical content lands the
  # SAME records (AC-2 idempotence via the shipped prior-scan + the hook's
  # volatileFields exemption). Consumption is staged at CREATION for the
  # born-in-session aliquot; the cross-session case is refused by name, never
  # silently converted. The staged creates are HUMAN-REVIEWED.
  chain:
    domain: chain
    operations: [compose-execute-chain]
    projection: {}
    humanReviewedCreate: true
    # §7.5 landing: the accepted chain re-focuses the attestation record on its
    # record-edit tab (a REGISTERED lab-session tab kind — DATA, never a TS
    # literal; the same landing.tabKind precedent as record-drafting, plus the
    # workstate-tab-kinds.yaml idField/idPrefix shape so the server-derived
    # activeTabId matches what app/src/shared/session/tabId.ts re-derives). An
    # absent landing key fails the compile honestly with a named diagnostic.
    landing:
      tabKind: record-edit
      idField: recordId
      idPrefix: record
