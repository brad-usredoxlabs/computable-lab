id: manual
label: Manual
allowedVocabIds:
  - liquid-handling/v1
  - animal-handling/v1
defaultVariant: manual_single_plate
toolTypeIds:
  - pipette_1ch
  - pipette_4ch_fixed
  - pipette_6ch_fixed
  - pipette_8ch_fixed
  - pipette_12ch
  - pipette_4ch_adjustable
  - pipette_6ch_adjustable
compilerFamily: manual
modules: []
variants:
  - id: manual_single_plate
    title: Single SBS Plate
    slots:
      - id: PLATE
        kind: standard
        label: Click to choose labware
        orientationMode: locked_landscape
        row: 1
        col: 1
        reachable: true
    # Overflow bench: every other slot-capable variant declares one (the
    # robot decks' side lawns, the freeform bench's surface). Without it a
    # lawn placement committed to this deck (the draft/commit path never
    # stamps a lawn surfaceId — the schema default is 'primary',
    # event-graph.schema.yaml) has NO rendering surface: the record's
    # placements grow but the deck tile count stays 1. A `surface` (the
    # PRIMARY bench), not a `sideLawn` — committed placements carry no
    # surfaceId, so they resolve to 'primary'; sideLawn placements are
    # stamped 'side' on drop and would never match. Sized 340×280mm: a
    # compact spare bench that fits an SBS plate (127×85) plus a 5×16 rack
    # (220×77), legible, uncluttered.
    surface:
      kind: lawn
      widthMm: 340
      heightMm: 280
  - id: manual_collapsed
    title: Manual Technician Mode
    slots: []
    # Same surface idiom as the side-lawn next to robot decks (400×500mm)
    # — just sized for a technician's working area. The freeform bench
    # variant below is bigger again. Without a surface here the deck
    # stage renders the placeholder; with it, LawnSurface takes over.
    surface:
      kind: lawn
      widthMm: 900
      heightMm: 600
  - id: manual_freeform
    title: Manual Bench (freeform)
    slots: []
    surface:
      kind: lawn
      widthMm: 1200
      heightMm: 800
    # A second, smaller freebench so tiles can be dragged between two lawn
    # surfaces (primary bench ↔ side labware lawn). DeckStage renders both.
    sideLawn:
      widthMm: 600
      heightMm: 400
      label: Labware lawn
