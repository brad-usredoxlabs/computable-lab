      # WELLSET-RESOLVER-1 (architect ruling SUITEA-P7-mix-wellset-scope-l2t0635
      # Q2): the declared CONTENTS-DERIVED wellset carrier. A symbolic token
      # (never a well list) that the server-side resolve_wellsets pass resolves
      # to a concrete well set from the run's contents ledger. kind: wellset is
      # its OWN argument kind (not a referent level, not a resolvable noun) —
      # the membership + token set are DATA (the pass reads them from this
      # vocabulary object, never a string literal). required: false so a mix
      # with no wellset rides byte-identically.
      #
      # domain: labware is a DECLARATION SLOT (not a resolvable noun, not a
      # strategyOrder noun, not a referent level): it names the ENTITY the
      # wellset's AMBIGUITY clarification is about — the labware the contents
      # sit on. The answerable-card builder (clarificationsFromUnresolvedFacts)
      # maps domain:labware -> kind:'labware' (the OQ-3 ruling's kind:'labware'
      # candidate-card shape); the never-guess arm raises ONE labware card on
      # an ambiguous (two-plate) contents set.
      - name: wells
        kind: wellset
        required: false
        domain: labware
        # L2-LABSTATE-CONTENTS-1 FIX RUN 2 (ruling LABSTATE-TOKENSITE-gate-
        # l2t2355 Q1, Brad option A): the PRODUCER-SIDE teaching for the
        # contents-derived carrier, rendered generically by contractBlock()
        # into every live prompt site (forced-draft instruction, agent_intent
        # tool def, repair prompt). The `teaching:` string states the
        # phrase->token CONTRACT only; the token VALUE stays single-homed in
        # wellsetValueTokens below (the renderer composes the token list from
        # that DATA — this text must never re-list token literals).
        teaching: >-
          A contents-derived phrase ("all wells that have material") is the
          DECLARED wellset token (the vocabulary's wellsetValueTokens list) —
          never a literal well list or well range. Omit labware unless the
          scientist names it: the token resolves its labware from the
          contents ledger.
