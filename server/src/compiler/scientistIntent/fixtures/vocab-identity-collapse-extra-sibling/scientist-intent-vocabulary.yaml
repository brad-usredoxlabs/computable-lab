# SPINE-2 authority document: the scientist-intent closed verb vocabulary +
# per-argument contracts. TypeScript keeps NO hand-maintained verb list; the
# parser (Ajv enum injection), tool schema, prompt, lifter and the normalizer
# pattern-set all read this file. Verb order is the migration baseline order
# (fixtures/verb-inventory.yaml) — do not alphabetize (parity is order-aware).
# class: pattern marks the geometric macros (PATTERN_ACTIONS source).
# domain/capability are DECLARATION SLOTS for SPINE-3 adapters; no knowledge-
# layer term validation fires here (SPINE-1 5 ruling).
# Structural rules: scientist-intent-vocabulary.schema.yaml.
# Conditional policy (P1-P4): scientist-intent-vocabulary.lint.yaml.
