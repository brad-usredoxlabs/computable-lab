# COMP-4 Stage B golden fixture — golden.intent-to-clarification.unresolvable-mixture-component
# The SHIPPED vocabulary declares add_material.composition cardinality: many
# (vocabulary DATA — the resolve_nouns door iterates it, one request per entry).
# The fixture store seeds THREE of the four components; 'Equine Serum' matches
# nothing => the door's unknown-noun arm clarifies naming the COMPONENT (label
# is the component name, actionLocation.argument is the declared arg), the pass
# bars atomically (422), and the cascade barrier skips every downstream pass —
# zero events, zero writes, no partial mint.
name: golden.intent-to-clarification.unresolvable-mixture-component
request:
  protocolText: >-
    Add 50 uL of the trypsin mixture to well A1: 50% trypsin-EDTA, 50% DMEM,
    10% Equine Serum, with HepG2 cells.
  answers:
    sample_type: bacterial
store:
  records:
    - recordId: LAB-plate-1
      payload:
        kind: labware
        title: Plate
        synonyms: [plate]
    - recordId: MAT-trypsin-1
      payload:
        kind: material
        title: trypsin-EDTA
        synonyms: [trypsin edta]
    - recordId: MAT-dmem-1
      payload:
        kind: material
        title: DMEM
    - recordId: MAT-hepg2-1
      payload:
        kind: material
        title: HepG2 cells
        synonyms: [hepg2]
modelOutput:
  intentId: golden-unresolvable-mixture-component
  actions:
    - action: add_material
      labware: plate
      volumeUl: 50
      targetWells: [A1]
      composition:
        - { material: "trypsin-EDTA", role: solvent, fraction: "50%" }
        - { material: "DMEM", role: buffer_component, fraction: "50%" }
        - { material: "Equine Serum", role: additive, fraction: "10%" }
        - { material: "HepG2 cells", role: cells, count: 10000 }
