# SPINE-6 golden fixture 1 — golden.intent-to-graph.transfer-read
# (amended per SPINE-6-ruling-amendment-l2t0140, "Amended FIXTURE 1", clauses 1-6).
#
# Store seeds are TITLE+SYNONYMS-ONLY payloads: createLabwareLookup reads
# payload.name/aliases only, so the hint arm returns [] (asserted in-test —
# proof the engine binding came from the SPINE arm, not the hint search).
# The spine's record provider reads name/title/label/synonyms and binds.
name: golden.intent-to-graph.transfer-read
request:
  protocolText: >-
    Transfer 50 uL from the source plate to the destination plate, then read
    the source plate at 450 nm absorbance.
  answers:
    sample_type: bacterial
store:
  records:
    - recordId: LAB-source-plate
      payload:
        kind: labware
        title: Source Plate
        synonyms: [source plate]
    - recordId: LAB-dest-plate
      payload:
        kind: labware
        title: Destination Plate
        synonyms: [destination plate]
modelOutput:
  intentId: golden-transfer-read
  actions:
    - action: transfer
      source: source plate
      target: destination plate
      volumeUl: 50
    - action: read
      labware: source plate
      mode: absorbance
      wavelength: '450'
