# MIXFRAC-1 GOLDEN-C (bar leg) — the explicit on-top phrasing (spec §7.3 +
# §14.2: C = explicit-on-top 50/50/10 + sum note, reading 3 of three).
# On-top evidence is ONE-SIDED for the on-top parse, but the declared
# fractions still break the convention total, so the bar STANDS (OQ-4: the
# silent arm names ONLY the final-volume evidence) and the explicit-on-top
# reading keeps the declared fractions-of-mixture WITH the sum note riding the
# reading data — never the ledger, never the source form. No recipe-shaped
# evidence on this document, so the shipped presentation order stands and
# explicit-on-top is reading 3 of three.
name: golden.intent-to-clarification.mixfrac-on-top
request:
  protocolText: >-
    50/50 Trypsin-EDTA/DMEM, add 10% FBS v/v on top
  answers:
    sample_type: bacterial
store:
  records:
    - recordId: LAB-mixfrac-plate-1
      payload:
        kind: labware
        title: Plate
        synonyms: [plate]
modelOutput:
  intentId: golden-mixfrac-on-top
  sourcePrompt: "50/50 Trypsin-EDTA/DMEM, add 10% FBS v/v on top"
  actions:
    - action: add_material
      labware: plate
      volumeUl: 50
      targetWells: [A1]
      params:
        composition:
          - { material: "Trypsin-EDTA", role: other, fraction: "50%" }
          - { material: "DMEM", role: buffer_component, fraction: "50%" }
          - { material: "FBS", role: additive, fraction: "10%" }
