modelOutput:
  intentId: w211-golden-bench-prep
  actions:
    - action: transfer
      source: Sample Plate
      target: Lysis Plate
      volumeUl: 50
    - action: add_material
      target: Lysis Plate
      material: Lysis Solution
      volumeUl: 700
    - action: bead_beat
      labware: Bead Beating Plate
      duration: 30 s
    - action: spin
      labware: Lysis Plate
      rpm: 3000
      duration: 10 min
    - action: transfer
      source: Lysis Plate
      target: MagBinding Plate
      volumeUl: 500
    - action: add_material
      target: MagBinding Plate
      material: MagBinding Beads v211g1
      volumeUl: 500
    - action: add_material
      target: MagBinding Plate
      material: MagBinding Buffer
      volumeUl: 800
    - action: wash
      labware: MagBinding Plate
      cycles: 1
    - action: elute
      source: MagBinding Plate
      target: Sample Plate
      material: nuclease-free water
      volumeUl: 100
    - action: incubate
      labware: Sample Plate
      duration: 30 min
      temperatureC: 37
    - action: read
      labware: Sample Plate
      mode: absorbance
      wavelength: 600 nm

