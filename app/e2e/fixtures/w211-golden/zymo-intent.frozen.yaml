      expectedCard: false
      expectedMenu: null
      expectedOptionLabels: []
      blockedOnFix: W211-GAPCARD-1
  - obligation: a-role-unique-noun
    wire: null
    expected:
      expectedCard: false
      expectedMenu: null
      expectedOptionLabels: []
