fixtureId: w211-golden-zymo-bench-prep
version: 1
cohortNonce: v211g1

# The scientist's free text the UI sends (pl-protocol-text). The replay producer
# answers it with the frozen modelOutput below; the prose and the macro state
# the SAME experiment (fixture review doc maps sentence -> obligation).
protocolText: |
  ZymoBIOMICS 96 MagBead-style DNA prep on the bench, single 96-well plate workflow.
  Bring one Sample Plate holding 50 uL of each stool sample in wells A1-D4 to the bench.
  Transfer 50 uL from the Sample Plate to the Lysis Plate.
  Add 700 uL of Lysis Solution to each well A1-D4 of the Lysis Plate.
  Bead beat the samples in the Bead Beating Plate for 30 s.
  Spin the Lysis Plate at 3000 rpm for 10 min.
  Transfer 500 uL from the Lysis Plate to the MagBinding Plate.
  Add 500 uL of MagBinding Beads v211g1 to each well A1-D4 of the MagBinding Plate.
  Add 800 uL of MagBinding Buffer to each well A1-D4 of the MagBinding Plate, then wash the plate once.
  Elute the MagBinding Plate into the Sample Plate with 100 uL of nuclease-free water.
  Incubate the Sample Plate at 37 C for 30 min.
  Read the Sample Plate at 600 nm absorbance.

# ---------------------------------------------------------------------------
# THE OBLIGATIONS (classes per the W211-MACH-1 block; STEP 0 outcome applied)
# ---------------------------------------------------------------------------
obligations:
  - id: a-role-unique-noun
    class: role-uniquely-resolvable-noun
    noun: Sample Plate
    slots: "transfer.source, elute.target, incubate.labware, read.labware"
    seededAgainst: "exactly ONE labware record names it (LAB-w211-sample-plate)"
    expected: "binds WITHOUT a card on the first draw (single in-band tier-1 hit, resolutionEngine.ts single-winner arm); no clarification fact ever names its label"
    status: built
  - id: b-ambiguous-labware-slot
    class: genuine-ambiguity-on-labware-semantic-slot
    noun: Bead Beating Plate
    slots: "bead_beat.labware"
    seededAgainst: "TWO labware records whose names both land in the acceptance band (Bead Beating Plate A / B)"
    expected: "fact carries reason ambiguous-noun + actionLocation.argument 'labware'; card renders the '/l' labware surface (ANSWER-SURFACE-1) with NO mint floor row; answer by PICKING a candidate in the real ClarificationPicker; the pick emits [[labware:<id>|label]]; ANSWER-BIND-1 binds it authoritatively; the NEXT compile deterministically lacks the fact and the recomputed artifacts carry the PICKED record id"
    status: built
  - id: c-unknown-material-noun
    class: unknown-noun-material
    noun: MagBinding Beads v211g1
    slots: "add_material.material"
    seededAgainst: "NOTHING (zero store match; cohort nonce v211g1 keeps it fresh per cohort; the leg FAILS if the nonce pre-exists)"
    expected: "fact carries reason unknown-noun with the mint affordance; card renders '/m' WITH the mint floor row; take the REAL UI mint act (picker floor row -> POST /vocab/mint {refKind:'material', label}); the minted record is a governed material; the next compile binds the slot and the fact clears; minted id is read dynamically, never fixture-pinned"
    status: built
  - id: d-gap-fact-deck-surface
    class: one-gap-fact-answered-through-its-real-surface
    noun: "(non-noun gap fact — prose-reason clarification, no actionLocation)"
    slots: "n/a"
    seededAgainst: "n/a"
    expected: "spec: the fact is answered through its real surface and survives to the deck"
    status: "BLOCKED-ON-FIX — STEP 0 probe (see report §STEP0 + named fix task W211-GAPCARD-1): a non-noun gap fact reaches NO answerable card surface. On the held-422 arm heldFactToClarificationRequest maps it to null (no menu row for its reason -> no card, infoMsg only); on the 200-gap arm the client 200 arms never read res.clarifications and setHeldCards([]). Answering it requires a product change (adapter menu row for gap reasons + a client arm that folds 200-gap clarifications) — a STOP-boundary fix task, NOT absorbed here."
    status_note: "the three built legs (a/b/c) stand; the deck-surface fidelity bar transfers to the (b)-picked record's placement offer (expectedDeck below)"

